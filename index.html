    const o = document.createElement('option');
    o.value = v; o.textContent = t;
    el.appendChild(o);
  }
}

/* ОДНА ДВЕРЬ НА ПЯТЬ ОПЕРАЦИЙ: ожидание, отказ, перерисовка и слова человеку устроены у
   них одинаково, и пять копий этого разошлись бы на первой правке (закон №40). Разное -
   только тело запроса, надо ли перерисовывать холст и чем кончить. */
async function morRun(тело, опции) {
  const o = опции || {};
  if (MOR_BUSY) return;
  const off = whyOff();
  if (off) { morSay(off, 'bad'); return; }
  MOR_BUSY = true;
  morSay(o.working || T.working);
  try {
    if (!(await apply(тело))) { morSay($('say').textContent || T.working, 'bad'); return; }
    if (o.redraw) await reshow();
    morSay(o.done ? o.done(LAST_RES || {}) : T.ready, 'ok');
    if (o.note) note(o.note);
  } finally {
    MOR_BUSY = false;
  }
}

async function morOcr() {
  await morRun({ op: 'ocr', lang: $('morOcrLang').value },
               { working: T.morOcrWork, redraw: true,
                 done: (r) => T.morOcrDone(r.ocred || r.pages || 0, r.chars || 0) });
}

async function morWm() {
  const t = ($('morWmText').value || '').trim();
  if (!t) { morSay(T.morWmNeed, 'bad'); return; }
  await morRun({ op: 'watermark', text: t },
               { redraw: true, done: (r) => T.morWmDone(r.marked || r.pages || 0),
                 note: T.morWmSafe });
}

async function morPg() {
  await morRun({ op: 'page_numbers', fmt: $('morPgFmt').value, pos: $('morPgPos').value },
               { redraw: true, done: (r) => T.morPgDone(r.marked || r.pages || 0) });
}

async function morMd() {
  await morRun({ op: 'to_markdown' },
               { done: (r) => T.morMdDone(r.pages || 0, r.tables || 0), note: T.morMdSave });
}

async function morPwSet(on) {
  const pw = $('morPw').value || '';
  if (!pw) { morSay(T.morPwNeed, 'bad'); return; }
  /* ПОЛЕ ЧИСТИМ СРАЗУ, А НЕ ПОСЛЕ ОТВЕТА: пароль не должен лежать в DOM дольше, чем
     нужно на один запрос, а ответ может идти секунды. */
  $('morPw').value = '';
  await morRun({ op: on ? 'protect' : 'unlock', password: pw },
               { done: () => (on ? T.morPwOnDone : T.morPwOffDone),
                 note: on ? T.morPwNote : '' });
}

/* ═══════════════════════════════════════════════════════════════════════════════
   ОБРЕЗКА ПОЛЕЙ: ОДНА РАМКА, И ОНА ПРО ТО, ЧТО ОСТАНЕТСЯ
   ═══════════════════════════════════════════════════════════════════════════════
   РАМКА ОДНА НА ВЕСЬ ДОКУМЕНТ, А НЕ ПО ОДНОЙ НА СТРАНИЦУ: поля у сканов и вёрстки
   одинаковы на всех листах, и предложи мы обводить каждый - человек бы обводил сорок раз
   ради одного и того же числа. Первый лист показан как образец; то, что рамка применится
   ко всем, сказано словами НА ЭКРАНЕ, а не оставлено на догадку.

   ОБРЕЗКА МЕНЯЕТ ПОКАЗ (`/CropBox`), А НЕ УДАЛЯЕТ СОДЕРЖИМОЕ - и это написано здесь же:
   экран с похожей рамкой рядом («Скрыть данные») делает ровно обратное, и перепутать их
   значило бы для человека «я убрал адрес» там, где адрес остался в файле. */
let CRP = { page: 0 };

function crpSay(t, cls) {
  const e = $('crpSay');
  e.textContent = t || '';
  e.style.color = cls === 'bad' ? 'var(--bad)' : 'var(--dim)';
}

function crpClose() {
  $('crp').classList.remove('on');
  $('crpBar').hidden = true;
}

async function crpOpen() {
  const off = whyOff();
  if (off) { say(off, 'bad'); return; }
  /* ДОКУМЕНТА НЕТ - МОЛЧА НИЧЕГО НЕ ДЕЛАЕМ, РОВНО КАК ОСТАЛЬНЫЕ ЭКРАНЫ (`rdtOpen`):
     кнопки тулбара до загрузки файла вообще скрыты, и свой текст здесь означал бы ключ,
     которого человек не увидит никогда. */
  if (!DOC || !PAGES.length) return;
  CRP.page = 0;
  $('crpTtl').textContent = T.crpTtl;
  $('crpHint').textContent = T.crpHint;
  $('bCrpCancel').textContent = T.rdtCancel;
  $('bCrpReset').textContent = T.crpReset;
  $('bCrpGo').textContent = T.crpGo;
  crpSay('');
  $('crp').classList.add('on');
  $('crpBar').hidden = false;
  await crpPaintPage();
}

async function crpPaintPage() {
  const cv = await paintSheet('crpPageCv', CRP.page);
  $('crpPage').textContent = T.crpPage(PAGES.length);
  /* РАМКА ПО УМОЛЧАНИЮ - ТИПИЧНЫЕ ПОЛЯ, А НЕ ВЕСЬ ЛИСТ: рамка размером в страницу
     выглядит как «ничего не выбрано», и человек не понимает, что ему делать. */
  const box = $('crpBox');
  box.style.left = Math.round(cv.clientWidth * 0.07) + 'px';
  box.style.top = Math.round(cv.clientHeight * 0.07) + 'px';
  box.style.width = Math.round(cv.clientWidth * 0.86) + 'px';
  box.style.height = Math.round(cv.clientHeight * 0.86) + 'px';
  wireBox(cv, box, $('crpGrip'));
}

async function crpGo() {
  const off = whyOff();
  if (off) { crpSay(off, 'bad'); return; }
  const доли = boxFractions($('crpPageCv'), $('crpBox'));
  if (!доли) { crpSay(T.crpNone, 'bad'); return; }
  /* ПРОВЕРКА РАЗМЕРА СТОИТ И ЗДЕСЬ, И У ВОРКЕРА, И ЭТО НЕ ДУБЛЬ ПРАВИЛА: воркер решает
     ЧИСЛОМ (его потолок - правда), а страница обязана сказать человеку ДО отправки, иначе
     он ждёт результат и получает отказ. Текст один, число - его. */
  if (доли.nw < 0.02 || доли.nh < 0.02) { crpSay(T.crpSmall, 'bad'); return; }
  crpSay(T.working);
  if (!(await apply({ op: 'crop', box: JSON.stringify(доли) }))) {
    crpSay($('say').textContent || T.working, 'bad');
    return;
  }
  crpClose();
  const pct = Math.round((1 - доли.nw * доли.nh) * 100);
  const стр = PAGES.length;
  /* ХОЛСТ ОБЯЗАН ПОКАЗАТЬ ОБРЕЗАННОЕ: иначе единственный ответ человеку - слово
     «готово», а глазами он видит прежние поля. */
  const видно = await reshow();
  say(T.crpDone(стр, pct) + (видно ? '' : ' ' + T.crpNoShow), видно ? 'ok' : 'bad');
  note(T.crpNote);
}

async function crpReset() {
  const off = whyOff();
  if (off) { crpSay(off, 'bad'); return; }
  crpSay(T.working);
  /* ОБРАТНЫЙ ПУТЬ ЕСТЬ И ОН ПРОВЕРЕН (закон №55): промах рамкой не должен стоить
     человеку повторной загрузки документа. */
  if (!(await apply({ op: 'crop', reset: '1' }))) {
    crpSay($('say').textContent || T.working, 'bad');
    return;
  }
  crpClose();
  const видно2 = await reshow();
  say(T.crpOff + (видно2 ? '' : ' ' + T.crpNoShow), видно2 ? 'ok' : 'bad');
}

/* ═══════════════════════════════════════════════════════════════════════════════
   СРАВНЕНИЕ ВЕРСИЙ: ЛИСТ ВТОРОЙ ВЕРСИИ С ПОДСВЕТКОЙ, УДАЛЁННОЕ - СПИСКОМ
   ═══════════════════════════════════════════════════════════════════════════════
   ЛИСТ РИСУЕТСЯ ИЗ ФАЙЛА В БРАУЗЕРЕ, А НЕ КАЧАЕТСЯ С СЕРВЕРА: вторую версию человек
   ТОЛЬКО ЧТО выбрал у себя, она уже в памяти вкладки. Скачивать её обратно значило бы
   гонять мегабайты по кругу ради картинки, которую можно нарисовать сразу.
   СВОДКА СОБИРАЕТСЯ ИЗ ЧИСЕЛ ВОРКЕРА, А НЕ ПЕРЕСКАЗЫВАЕТСЯ МОДЕЛЬЮ: пересказ правок в
   договоре - это ровно то место, где выдумка стоит дороже всего, а числа и фрагменты
   человек сверит сам. Модели здесь нет вообще. */
let CMP = { file: null, doc: null, res: null, page: 0, mode: 'words', sent: false };

const cmpSay = (t, cls) => {
  const e = $('cmpSay');
  e.textContent = t || '';
  e.style.color = cls === 'bad' ? 'var(--bad)' : 'var(--dim)';
};

function cmpClose() {
  $('cmp').classList.remove('on');
  $('cmpBar').hidden = true;
}

async function cmpOpen() {
  if (!DOC) return;
  const off = whyOff();
  if (off) { say(off, 'bad'); return; }
  CMP = { file: null, doc: null, res: null, page: 0, mode: 'words', sent: false };
  MRG_WAIT = false;
  $('cmpTtl').textContent = T.cmpTtl;
  $('cmpWhat').textContent = T.cmpWhat;
  $('bCmpPick').textContent = T.cmpPick;
  $('bCmpCancel').textContent = T.cmpCancel;
  $('bCmpGo').textContent = T.cmpGo;
  $('bCmpPrev').textContent = '‹';
  $('bCmpNext').textContent = '›';
  $('cmpWhich').textContent = T.cmpNoFile;
  for (const id of ['cmpSum', 'cmpNav', 'cmpWrap', 'cmpLeg']) $(id).hidden = true;
  for (const id of ['cmpList', 'cmpGone', 'cmpMoved']) $(id).innerHTML = '';
  cmpMode(false);
  $('cmp').classList.add('on');
  $('cmpBar').hidden = false;
  cmpSay('');
}

/* ПЕРЕКЛЮЧАТЕЛЬ НАЗЫВАЕТ ТЕКУЩИЙ РЕЖИМ, А НЕ ТОТ, В КОТОРЫЙ ПЕРЕЙДЁТ: подпись «по
   пикселям» на кнопке в режиме слов читается и так, и так, а ошибка здесь означает, что
   человек получил не ту мерку и не понял этого. Обратный путь у переключателя проверен
   (закон №55): второе нажатие возвращает слова. */
function cmpMode(flip) {
  if (flip) CMP.mode = (CMP.mode === 'words') ? 'pixels' : 'words';
  $('bCmpMode').textContent = (CMP.mode === 'words') ? T.cmpModeWords : T.cmpModePixels;
  if (flip) {
    CMP.res = null;
    for (const id of ['cmpSum', 'cmpNav', 'cmpWrap', 'cmpLeg']) $(id).hidden = true;
    for (const id of ['cmpList', 'cmpGone', 'cmpMoved']) $(id).innerHTML = '';
    cmpSay(T.cmpModeSay);
  }
}

async function cmpPick(f) {
  if (!f) return;
  CMP.file = f;
  CMP.res = null;
  CMP.sent = false;
  $('cmpWhich').textContent = T.cmpWhich(f.name || '?');
  cmpSay(T.working);
  try {
    const buf = await f.arrayBuffer();
    /* ЛИСТ ВТОРОЙ ВЕРСИИ ГОТОВИМ СРАЗУ: если файл не открывается, человек узнает это
       ЗДЕСЬ, а не после ожидания сравнения на сервере. */
    if (!pdfjs) { cmpSay(pdfjsWhy(T.cmpNoPdfjs), 'bad'); return; }
    CMP.doc = await openDoc(new Uint8Array(buf.slice(0)));
    const sent = await sendSecond(f, buf);
    if (!sent.ok) {
      CMP.file = null; CMP.doc = null;
      cmpSay(sent.why, 'bad');
      $('cmpWhich').textContent = T.cmpNoFile;
      return;
    }
    CMP.sent = true;
    cmpSay(T.cmpReady(sent.pages || CMP.doc.numPages));
  } catch (e) {
    CMP.file = null; CMP.doc = null;
    $('cmpWhich').textContent = T.cmpNoFile;
    cmpSay(T.cmpBadFile + ' ' + String(e && e.message || e), 'bad');
  }
}

async function cmpGo() {
  const off = whyOff();
  if (off) { cmpSay(off, 'bad'); return; }
  if (!CMP.sent) { cmpSay(T.cmpNeedFile, 'bad'); return; }
  cmpSay(T.working);
  const ok = await apply({ op: 'compare', mode: CMP.mode });
  if (!ok) {
    const why = $('say').textContent || '';
    /* ОТКАЗ «НЕТ ТЕКСТОВОГО СЛОЯ» - ЭТО ПРЕДЛОЖЕНИЕ, А НЕ ТУПИК: распознавание у нас
       есть, и спросить человека надо здесь, назвав цену (числа станут приблизительными).
       Решает он, а не мы: молча пустить скан через tesseract значило бы выдать
       приблизительные числа за точные (закон №32 - гейт у действия). */
    if (/текстов/i.test(why) || /text layer/i.test(why)) {
      cmpSay(why, 'bad');
      const yes = await askYesNo(T.cmpOcrAsk);
      if (!yes) return;
      cmpSay(T.working);
      if (!(await apply({ op: 'compare', mode: CMP.mode, ocr: '1' }))) {
        cmpSay($('say').textContent || T.cmpFail, 'bad');
        return;
      }
    } else {
      cmpSay(why || T.cmpFail, 'bad');
      return;
    }
  }
  CMP.res = LAST_RES || null;
  if (!CMP.res) { cmpSay(T.cmpFail, 'bad'); return; }
  CMP.page = 0;
  await cmpPaint();
}

async function cmpPaint() {
  const r = CMP.res;
  if (!r) return;
  if (r.mode === 'pixels') return cmpPaintPixels(r);
  const s = r.summary || {};
  $('cmpSum').hidden = false;
  $('cmpSum').className = (s.places ? '' : 'plain');
  $('cmpSum').textContent = T.cmpSum(s, r);
  /* ПЕРВОЙ ПОКАЗЫВАЕМ СТРАНИЦУ С ПРАВКОЙ, А НЕ ПЕРВУЮ СТРАНИЦУ ДОКУМЕНТА: человек открыл
     сравнение, чтобы увидеть различия, и титульный лист без подсветки читается как
     «ничего не нашлось». */
  CMP.page = (s.pages && s.pages.length) ? (s.pages[0] - 1) : 0;
  $('cmpLeg').hidden = false;
  $('cmpLeg').innerHTML = '';
  for (const [cls, txt] of [['ins', T.cmpLegIns], ['rep', T.cmpLegRep], ['mv', T.cmpLegMv]]) {
    const d = document.createElement('span');
    const i = document.createElement('i');
    i.className = 'cmpHit ' + cls;
    i.style.position = 'static';
    d.appendChild(i);
    d.appendChild(document.createTextNode(txt));
    $('cmpLeg').appendChild(d);
  }
  cmpPaintLists(r);
  await cmpPaintPage();
}

async function cmpPaintPage() {
  const r = CMP.res;
  if (!r || !CMP.doc) return;
  const total = CMP.doc.numPages;
  CMP.page = Math.max(0, Math.min(CMP.page, total - 1));
  const cv = $('cmpPageCv');
  const page = await CMP.doc.getPage(CMP.page + 1);
  /* ПОВОРОТ БЕРЁТСЯ ИЗ САМОГО ФАЙЛА, А НЕ ИЗ СЕТКИ: сетка про ПЕРВЫЙ документ, а рисуем
     мы ВТОРОЙ, и его страницы человек не крутил. Доли от воркера считаны от видимого
     кадра (pdfplumber отдаёт их уже с учётом `/Rotate`), значит и кадр здесь - видимый. */
  const v0 = page.getViewport({ scale: 1, rotation: page.rotate % 360 });
  const wide = Math.min(520, (window.innerWidth || 360) - 56);
  const v = page.getViewport({ scale: wide / v0.width, rotation: page.rotate % 360 });
  cv.width = Math.ceil(v.width); cv.height = Math.ceil(v.height);
  cv.style.width = Math.ceil(v.width) + 'px';
  $('cmpWrap').hidden = false;
  $('cmpNav').hidden = false;
  await page.render({ canvasContext: cv.getContext('2d'), viewport: v }).promise;
  $('cmpPage').textContent = T.cmpPage(CMP.page + 1, total);
  const wrap = $('cmpWrap');
  for (const el of [...wrap.querySelectorAll('.cmpHit')]) el.remove();
  const W = cv.clientWidth || cv.width, H = cv.clientHeight || cv.height;
  for (const e of (r.edits || [])) {
    for (const b of (e.boxes || [])) {
      if (b.p !== CMP.page + 1) continue;
      const d = document.createElement('div');
      d.className = 'cmpHit ' + (e.stayed ? 'mv' : (e.kind === 'insert' ? 'ins' : 'rep'));
      d.style.left = (b.nx * W) + 'px';
      d.style.top = (b.ny * H) + 'px';
      d.style.width = Math.max(2, b.nw * W) + 'px';
      d.style.height = Math.max(2, b.nh * H) + 'px';
      wrap.appendChild(d);
    }
  }
}

function cmpPaintLists(r) {
  const box = $('cmpList');
  box.innerHTML = '';
  const head = (el, t) => {
    const h = document.createElement('div');
    h.innerHTML = '<b></b>';
    h.querySelector('b').textContent = t;
    el.appendChild(h);
  };
  if ((r.edits || []).length) {
    head(box, T.cmpEditsTtl((r.edits || []).length));
    for (const e of r.edits) {
      const d = document.createElement('div');
      d.textContent = T.cmpPageNo(e.page) + ' ';
      if (e.kind === 'replace' && e.was) {
        const a = document.createElement('span');
        a.className = 'cmpWas'; a.textContent = e.was;
        d.appendChild(a);
        d.appendChild(document.createTextNode(' → '));
      }
      const b = document.createElement('span');
      b.className = 'cmpNow'; b.textContent = e.now;
      d.appendChild(b);
      if (e.stayed) d.appendChild(document.createTextNode(' ' + T.cmpStayed(e.from_page)));
      /* ПО ПРАВКЕ МОЖНО ПЕРЕЙТИ НА ЕЁ СТРАНИЦУ: список и лист - одно и то же, и искать
         страницу руками после того, как мы её УЖЕ знаем, человеку незачем. */
      d.style.cursor = 'pointer';
      d.onclick = () => { CMP.page = (e.page || 1) - 1; cmpPaintPage(); };
      box.appendChild(d);
    }
  }
  if (r.human_cut) {
    const d = document.createElement('div');
    d.style.color = 'var(--warn)';
    d.textContent = r.human_cut;
    box.appendChild(d);
  }
  const gone = $('cmpGone');
  gone.innerHTML = '';
  if ((r.deleted || []).length) {
    head(gone, T.cmpGoneTtl(r.deleted.length));
    for (const x of r.deleted) {
      const d = document.createElement('div');
      const a = document.createElement('span');
      a.className = 'cmpWas'; a.textContent = x.was;
      d.appendChild(document.createTextNode(T.cmpPageNo(x.page) + ' '));
      d.appendChild(a);
      d.appendChild(document.createTextNode(
        ' ' + (x.moved_to ? T.cmpGoneMoved(x.moved_to) : T.cmpGoneWhere(x.after, x.before))));
      gone.appendChild(d);
    }
  }
  const mv = $('cmpMoved');
  mv.innerHTML = '';
  if ((r.moved || []).length) {
    head(mv, T.cmpMovedTtl(r.moved.length));
    for (const x of r.moved) {
      const d = document.createElement('div');
      d.textContent = T.cmpMovedOne(x);
      mv.appendChild(d);
    }
  }
  if (r.note) {
    const d = document.createElement('div');
    d.style.color = 'var(--warn)';
    d.textContent = r.note;
    mv.appendChild(d);
  }
}

/* ПИКСЕЛЬНЫЙ РЕЖИМ ОТВЕЧАЕТ ЧИСЛАМИ ПО СТРАНИЦАМ И НАЗЫВАЕТ СВОЮ СЛАБОСТЬ ТУТ ЖЕ:
   перевёрстку он видит как сплошное различие, и не скажи мы этого - человек прочитал бы
   «изменились все страницы» про документ, где поправлено одно слово. */
function cmpPaintPixels(r) {
  $('cmpSum').hidden = false;
  $('cmpSum').className = '';
  $('cmpSum').textContent = T.cmpPxSum(r);
  $('cmpLeg').hidden = true;
  $('cmpWrap').hidden = true;
  $('cmpNav').hidden = true;
  const box = $('cmpList');
  box.innerHTML = '';
  for (const p of (r.pages || [])) {
    const d = document.createElement('div');
    d.textContent = T.cmpPxRow(p);
    if (p.changed) d.style.color = 'var(--warn)';
    box.appendChild(d);
  }
  for (const o of (r.only_in_one || [])) {
    const d = document.createElement('div');
    d.style.color = 'var(--warn)';
    d.textContent = T.cmpPxOnly(o);
    box.appendChild(d);
  }
  $('cmpGone').innerHTML = '';
  const mv = $('cmpMoved');
  mv.innerHTML = '';
  const d = document.createElement('div');
  d.style.color = 'var(--dim)';
  d.textContent = r.note || '';
  mv.appendChild(d);
}

/* ═══════════════════════════════════════════════════════════════════════════════
   ПРАВКА ТЕКСТА: ТАП ПО СТРОКЕ, ПОЛЕ ПОВЕРХ НЕЁ, ПЕРЕРИСОВКА РЕЗУЛЬТАТОМ
   ═══════════════════════════════════════════════════════════════════════════════
   ТРИ РЕШЕНИЯ ЭТОГО ЭКРАНА, И КАЖДОЕ СТОИТ НА ЧУЖОМ ОТКАЗЕ:

   1. СТРОКИ БЕРУТСЯ У ВОРКЕРА, А НЕ ИЗ ТЕКСТОВОГО СЛОЯ pdf.js. Текстовый слой у нас под
      рукой, рисовать по нему зоны было бы дешевле и быстрее. Но правку делает PDFium, а
      pdf.js делит строки по-своему: человек тронул бы блок, текста которого редактор НЕ
      НАХОДИТ, и получил бы «такого текста нет» на том, что видит глазами. Сигнал,
      добытый соседним путём, тут не годится (закон №41).

   2. РЕЗУЛЬТАТ ПЕРЕРИСОВЫВАЕТСЯ ФАЙЛОМ С СЕРВЕРА (`reshow`), а не нашим представлением о
      том, что должно было получиться (закон №52). Для операции, у которой весь смысл в
      ВИДЕ, «готово» без листа это и есть «не сработало» - живой отказ обрезки 14.10.

   3. ПРО ПОДПИСЬ СКАЗАНО ДО ПЕРВОЙ ПРАВКИ, А НЕ ПОСЛЕ ФАЙЛА: после неё она уже
      недействительна, и предупреждать поздно (закон №32 - гейт стоит у действия).
      Фраза берётся У ВОРКЕРА (`warn`), а не пишется здесь: он знает, сколько подписей и
      что с ними будет, а вторая редакция одного предупреждения разошлась бы с первой. */
let TXT = { page: 0, blocks: [], pick: null, asked: false, edited: 0 };

const txtSay = (t, cls) => {
  const e = $('txtSay');
  e.textContent = t || '';
  e.style.color = cls === 'bad' ? 'var(--bad)' : (cls === 'ok' ? 'var(--ok)' : 'var(--dim)');
};

function txtClose() {
  $('txt').classList.remove('on');
  $('txtBar').hidden = true;
}

async function txtOpen() {
  if (!DOC) return;
  const off = whyOff();
  if (off) { say(off, 'bad'); return; }
  TXT = { page: 0, blocks: [], pick: null, asked: false, edited: 0 };
  $('txtTtl').textContent = T.txtTtl;
  $('txtHint').textContent = T.txtHint;
  $('bTxtPrev').textContent = '‹';
  $('bTxtNext').textContent = '›';
  $('bTxtDrop').textContent = T.txtDrop;
  $('bTxtGo').textContent = T.txtGo;
  $('bTxtCancel').textContent = T.txtCancel;
  $('txtWarn').hidden = true;
  $('txtEdit').hidden = true;
  $('txtCut').textContent = '';
  $('txt').classList.add('on');
  $('txtBar').hidden = false;
  txtSay('');
  await txtLoad();
}

/* СТРОКИ СТРАНИЦЫ - ОДНИМ ЗАПРОСОМ НА ЛИСТ, А НЕ НА ВЕСЬ ДОКУМЕНТ: у договора на сорок
   листов это сорок тысяч рамок, из которых человек смотрит одну страницу. */
async function txtLoad() {
  TXT.pick = null;
  TXT.blocks = [];
  $('txtEdit').hidden = true;
  txtSay(T.txtLoad);
  if (!(await apply({ op: 'text_blocks', page: String(TXT.page + 1) }))) {
    txtSay($('say').textContent || T.txtFail, 'bad');
    return;
  }
  const r = LAST_RES || {};
  TXT.blocks = r.blocks || [];
  /* ПОДПИСЬ - СЛОВАМИ ВОРКЕРА И ДО ПЕРВОГО ТАПА. */
  if (r.signed && r.warn) {
    $('txtWarn').hidden = false;
    $('txtWarn').textContent = T.txtWarnSig(r.warn);
  }
  /* ОБРЕЗКА СПИСКА НАЗЫВАЕТ СЕБЯ СЛОВАМИ ВОРКЕРА (закон №64): человек, не нашедший свою
     строку, должен знать, что её срезали, а не решить, что её нет. */
  $('txtCut').textContent = r.human_cut || '';
  txtSay(TXT.blocks.length ? '' : T.txtNone, TXT.blocks.length ? '' : 'bad');
  await txtPaintPage();
}

async function txtPaintPage() {
  const total = PAGES.length;
  TXT.page = Math.max(0, Math.min(TXT.page, total - 1));
  const p = PAGES[TXT.page];
  const cv = $('txtPageCv');
  /* ЛИСТ БЕРЁМ ЧЕРЕЗ `docFor`, А НЕ У `DOC`: после объединения номер страницы
     продолжается во ВТОРОМ документе, и спроси мы седьмую у первого (где их четыре) -
     pdf.js отказал бы, а холст показал бы пустоту. */
  const d = docFor(p.src);
  const page = await d.doc.getPage(d.n);
  const v0 = page.getViewport({ scale: 1, rotation: (page.rotate + p.rot) % 360 });
  const wide = Math.min(520, (window.innerWidth || 360) - 56);
  const v = page.getViewport({ scale: wide / v0.width, rotation: (page.rotate + p.rot) % 360 });
  cv.width = Math.ceil(v.width); cv.height = Math.ceil(v.height);
  cv.style.width = Math.ceil(v.width) + 'px';
  $('txtWrap').hidden = false;
  $('txtNav').hidden = false;
  await page.render({ canvasContext: cv.getContext('2d'), viewport: v }).promise;
  $('txtPage').textContent = T.txtPage(TXT.page + 1, total);
  txtPaintHits();
}

function txtPaintHits() {
  const wrap = $('txtWrap'), cv = $('txtPageCv');
  for (const el of [...wrap.querySelectorAll('.txtHit')]) el.remove();
  const W = cv.clientWidth || cv.width, H = cv.clientHeight || cv.height;
  TXT.blocks.forEach((b, i) => {
    const d = document.createElement('div');
    d.className = 'txtHit' + (TXT.pick === i ? ' sel' : (b.done ? ' done' : ''));
    d.style.left = (b.nx * W) + 'px';
    d.style.top = (b.ny * H) + 'px';
    d.style.width = Math.max(6, b.nw * W) + 'px';
    /* ЗОНА НЕ ТОНЬШЕ ПАЛЬЦА. Строка кегля 8 на ужатом холсте это 5 пикселей, и попасть по
       ней нельзя - человек решил бы, что экран не отвечает, а не что он промахнулся. */
    d.style.height = Math.max(14, b.nh * H) + 'px';
    d.onclick = () => txtPick(i);
    wrap.appendChild(d);
  });
}

function txtPick(i) {
  const b = TXT.blocks[i];
  if (!b) return;
  TXT.pick = i;
  $('txtEdit').hidden = false;
  $('txtWas').textContent = T.txtWas(b.t);
  $('txtInput').value = b.t;
  $('txtNote').textContent = '';
  txtSay('');
  txtPaintHits();
  $('txtInput').focus();
}

function txtDrop() {
  TXT.pick = null;
  $('txtEdit').hidden = true;
  txtPaintHits();
  txtSay('');
}

async function txtApply() {
  const off = whyOff();
  if (off) { txtSay(off, 'bad'); return; }
  const b = TXT.blocks[TXT.pick];
  if (!b) return;
  const было = b.t;
  const стало = $('txtInput').value;
  if (стало === было) { txtSay(T.txtSame, 'bad'); return; }
  if (!стало) { txtSay(T.txtEmpty, 'bad'); return; }
  /* ═══ ПРО ПОДПИСЬ СПРАШИВАЕМ ОДИН РАЗ И ДО ПЕРВОЙ ПРАВКИ ═══
     Второй вопрос на каждую строку человек перестанет читать уже на третьей, а смысл у
     него ровно один: «ты знаешь, что подпись умрёт». Она умирает на ПЕРВОЙ правке. */
  if (!TXT.asked && !$('txtWarn').hidden) {
    TXT.asked = true;
    if (!(await askYesNo(T.txtAsk))) return;
  }
  txtSay(T.working);
  const ok = await apply({
    op: 'text_edit',
    edits: JSON.stringify([{ page: b.p, old: было, new: стало, nth: b.nth }]),
  });
  if (!ok) { txtSay($('say').textContent || T.txtFail, 'bad'); return; }
  const res = LAST_RES || {};
  TXT.edited += 1;
  /* ═══ ЛИСТ ПЕРЕРИСОВЫВАЕТСЯ ФАЙЛОМ С СЕРВЕРА ═══
     Показать «как должно было получиться» значит однажды показать не то, что в файле. */
  if (!(await reshow())) { txtSay(T.txtNoShow, 'bad'); return; }
  /* ГРАНИЦУ ИЗ ОТВЕТА ВОРКЕРА ДОВОЗИМ ЕГО СЛОВАМИ: «буквы растянуты до 118%» решает,
     годится результат или нет, а наш пересказ «вид немного изменился» не решает ничего
     (закон №41 - сигнал, который у нас есть, не подменяется соседним). */
  const оговорки = [];
  for (const e of (res.edits || [])) {
    for (const k of ['fit_note', 'font_note', 'spacing_note']) {
      const t = (e && e[k] || '').trim();
      if (t && оговорки.indexOf(t) < 0) оговорки.push(t);
    }
  }
  $('txtEdit').hidden = true;
  TXT.pick = null;
  /* СТРОКИ ПЕРЕСПРАШИВАЕМ ПОСЛЕ ПРАВКИ, А НЕ ПРАВИМ СПИСОК У СЕБЯ: текст страницы стал
     другим, и рамки вместе с ним. Свой пересчёт разошёлся бы с документом на второй
     правке той же строки. */
  await txtLoad();
  txtSay(T.txtDone + (оговорки.length ? ' ' + оговорки.join(' · ') : ''), 'ok');
}

/* ═══════════════════════════════════════════════════════════════════════════════
   ФОРМЫ: ПОКАЗАТЬ ПОЛЯ, ЗАПОЛНИТЬ ИХ, А ЕСЛИ ИХ НЕТ - СОЗДАТЬ
   ═══════════════════════════════════════════════════════════════════════════════ */
let FRM = { fields: [], xfa: 'no', make: [], page: 0 };

const frmSay = (t, cls) => {
  const e = $('frmSay');
  e.textContent = t || '';
  e.style.color = cls === 'bad' ? 'var(--bad)' : 'var(--dim)';
};

function frmClose() {
  $('frm').classList.remove('on');
  $('frmBar').hidden = true;
}

async function frmOpen() {
  if (!DOC) return;
  const off = whyOff();
  if (off) { say(off, 'bad'); return; }
  FRM = { fields: [], xfa: 'no', make: [], page: 0 };
  $('frmTtl').textContent = T.frmTtl;
  $('bFrmCancel').textContent = T.frmCancel;
  $('bFrmAdd').textContent = T.frmAdd;
  $('bFrmGo').textContent = T.frmApply;
  $('frmNmLbl').textContent = T.frmNmLbl;
  $('frmKindLbl').textContent = T.frmKindLbl;
  $('frmOptsLbl').textContent = T.frmOptsLbl;
  const kd = $('frmKind');
  kd.innerHTML = '';
  for (const k of ['text', 'check', 'choice']) {
    const o = document.createElement('option');
    o.value = k; o.textContent = T.frmKinds[k];
    kd.appendChild(o);
  }
  kd.onchange = () => { $('frmOptsBox').hidden = kd.value !== 'choice'; };
  $('frmOptsBox').hidden = true;
  $('frmMake').hidden = true;
  $('frmList').innerHTML = '';
  $('frmMade').textContent = '';
  $('frm').classList.add('on');
  $('frmBar').hidden = false;
  frmSay(T.frmLoading);
  /* ═══ СПРАШИВАЕМ ВОРКЕР, А НЕ pdf.js ═══
     У pdf.js есть свой разбор аннотаций, и соблазн прочитать поля ЗДЕСЬ большой. Нельзя:
     заполнять их будет ВОРКЕР, и его представление о том, как зовётся поле и что в нём
     допустимо, - единственное, которое имеет значение. Прочитай мы своим разбором -
     человек увидел бы поля, которых воркер не знает, и отказ «нет такого поля» на
     собственном же списке (закон №40). */
  const r = await fetch(u('/pdf/op'), {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ op: 'form_read' }),
  });
  const j = await r.json().catch(() => null);
  if (!r.ok || !j || !j.ok) {
    /* ОТКАЗ ВОРКЕРА ПОКАЗЫВАЕМ ЕГО СЛОВАМИ: именно здесь приезжает объяснение про XFA, и
       переписать его своими словами значило бы потерять «чем открыть». */
    frmSay((j && (j.human || j.error)) || ('HTTP ' + r.status), 'bad');
    return;
  }
  const res = j.res || {};
  FRM.fields = res.fields || [];
  FRM.xfa = res.xfa || 'no';
  frmPaintList();
}

function frmPaintList() {
  const box = $('frmList');
  box.innerHTML = '';
  if (!FRM.fields.length) {
    frmSay(FRM.make.length ? T.frmMade(FRM.make.length) : T.frmNone);
  } else {
    frmSay(FRM.xfa === 'hybrid' ? T.frmHybrid : T.frmFound(FRM.fields.length));
  }
  for (const f of FRM.fields) {
    const d = document.createElement('div');
    d.className = 'fld' + (f.readonly ? ' ro' : '');
    const lbl = document.createElement('div');
    lbl.className = 'lbl';
    const b = document.createElement('b');
    b.textContent = f.name;
    lbl.appendChild(b);
    const tags = [];
    if (f.required) tags.push(T.frmReq);
    if (f.readonly) tags.push(T.frmRo);
    if (tags.length) lbl.appendChild(document.createTextNode(' · ' + tags.join(' · ')));
    d.appendChild(lbl);
    /* ВИД ВВОДА - ПО ВИДУ ПОЛЯ, И ЗНАЧЕНИЯ БЕРУТСЯ ИЗ ЕГО НАБОРА, А НЕ ПРИДУМЫВАЮТСЯ.
       Свободный ввод у флажка означал бы «/Maybe» в документе: воркер такое отвергнет, и
       человек получит отказ за то, что мы дали ему печатать. */
    if (f.kind === 'button' && f.states && f.states.length) {
      const on = f.states.map((s) => String(s[0])).find((v) => v !== '/Off');
      const w = document.createElement('label');
      w.className = 'chk';
      const i = document.createElement('input');
      i.type = 'checkbox';
      i.dataset.name = f.name;
      i.dataset.on = on || '/Yes';
      i.checked = String(f.value || '') === String(on);
      i.disabled = !!f.readonly;
      w.appendChild(i);
      w.appendChild(document.createTextNode(' ' + (on || '/Yes')));
      d.appendChild(w);
    } else if (f.kind === 'choice' && f.states && f.states.length) {
      const sel = document.createElement('select');
      sel.dataset.name = f.name;
      sel.disabled = !!f.readonly;
      for (const pair of f.states) {
        const o = document.createElement('option');
        o.value = String(pair[0]);
        o.textContent = String(pair[1] || pair[0]);
        if (String(f.value || '') === o.value) o.selected = true;
        sel.appendChild(o);
      }
      d.appendChild(sel);
    } else {
      const i = document.createElement('input');
      i.type = 'text';
      i.dataset.name = f.name;
      i.value = f.value == null ? '' : String(f.value);
      i.disabled = !!f.readonly;
      d.appendChild(i);
    }
    box.appendChild(d);
  }
}

/* ── СОЗДАНИЕ ПОЛЯ: ОБВЕСТИ МЕСТО НА СТРАНИЦЕ ───────────────────────────────────── */
async function frmAddMode() {
  if (!DOC) return;
  $('frmMake').hidden = false;
  const sel = PAGES.map((p, i) => p.sel ? i : -1).filter((i) => i >= 0);
  FRM.page = sel.length ? sel[0] : 0;
  await frmPaintPage();
  frmSay(FRM.make.length ? T.frmMade(FRM.make.length) : '');
}

async function frmPaintPage() {
  const p = PAGES[FRM.page];
  const cv = $('frmPageCv');
  const page = await DOC.getPage(p.src);
  /* ПОВОРОТ УЧТЁН ТАК ЖЕ, КАК У ПОДПИСИ: человек обводит то, что ВИДИТ, а доли считаются
     от видимого кадра - воркер переводит их в систему страницы сам. */
  const v0 = page.getViewport({ scale: 1, rotation: (page.rotate + p.rot) % 360 });
  const wide = Math.min(520, (window.innerWidth || 360) - 56);
  const sc = wide / v0.width;
  const v = page.getViewport({ scale: sc, rotation: (page.rotate + p.rot) % 360 });
  cv.width = Math.ceil(v.width); cv.height = Math.ceil(v.height);
  cv.style.width = Math.ceil(v.width) + 'px';
  await page.render({ canvasContext: cv.getContext('2d'), viewport: v }).promise;
  $('frmPage').textContent = T.frmPage(FRM.page + 1, PAGES.length);
  const box = $('frmBox');
  box.style.width = Math.round(cv.clientWidth * 0.5) + 'px';
  box.style.height = Math.round(cv.clientHeight * 0.045) + 'px';
  box.style.left = Math.round(cv.clientWidth * 0.1) + 'px';
  box.style.top = Math.round(cv.clientHeight * 0.1) + 'px';
  frmWireBox();
}

function frmWireBox() {
  const cv = $('frmPageCv'), box = $('frmBox'), grip = $('frmGrip');
  if (box.dataset.wired) return;
  box.dataset.wired = '1';
  let mode = '', sx = 0, sy = 0, bx = 0, by = 0, bw = 0, bh = 0;
  const clamp = () => {
    const W = cv.clientWidth, H = cv.clientHeight;
    let w = Math.max(18, Math.min(box.offsetWidth, W));
    let h = Math.max(10, Math.min(box.offsetHeight, H));
    box.style.width = w + 'px'; box.style.height = h + 'px';
    box.style.left = Math.max(0, Math.min(box.offsetLeft, W - w)) + 'px';
    box.style.top = Math.max(0, Math.min(box.offsetTop, H - h)) + 'px';
  };
  const down = (e, m) => {
    mode = m; sx = e.clientX; sy = e.clientY;
    bx = box.offsetLeft; by = box.offsetTop; bw = box.offsetWidth; bh = box.offsetHeight;
    e.target.setPointerCapture && e.target.setPointerCapture(e.pointerId);
    e.preventDefault(); e.stopPropagation();
  };
  const move = (e) => {
    if (!mode) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (mode === 'move') {
      box.style.left = (bx + dx) + 'px'; box.style.top = (by + dy) + 'px';
    } else {
      box.style.width = (bw + dx) + 'px'; box.style.height = (bh + dy) + 'px';
    }
    clamp();
    e.preventDefault();
  };
  const up = () => { mode = ''; };
  box.onpointerdown = (e) => { if (e.target !== grip) down(e, 'move'); };
  grip.onpointerdown = (e) => down(e, 'size');
  box.onpointermove = grip.onpointermove = move;
  box.onpointerup = grip.onpointerup = up;
  box.onpointercancel = grip.onpointercancel = up;
}

function frmAddCommit() {
  const nm = ($('frmNm').value || '').trim();
  const kind = $('frmKind').value;
  if (!nm) { frmSay(T.frmNeedName, 'bad'); return false; }
  /* ИМЯ ПОЛЯ - ЛАТИНИЦА БЕЗ ПРОБЕЛОВ, И ЭТО НЕ ПРИДИРКА. Оно уезжает ключом JSON и
     ложится в `/T` документа; кириллица и пробелы в нём живут плохо в чужих читалках, а
     заметит это человек у получателя. Говорим правило СРАЗУ, а не отказом после. */
  if (!/^[A-Za-z0-9_]+$/.test(nm)) { frmSay(T.frmBadName, 'bad'); return false; }
  let opts = [];
  if (kind === 'choice') {
    opts = ($('frmOpts').value || '').split(',').map((x) => x.trim()).filter(Boolean);
    if (opts.length < 2) { frmSay(T.frmNeedOpts, 'bad'); return false; }
  }
  const cv = $('frmPageCv'), box = $('frmBox');
  const it = {
    name: nm, kind: kind, page: PAGES[FRM.page].src,
    nx: +(box.offsetLeft / cv.clientWidth).toFixed(4),
    ny: +(box.offsetTop / cv.clientHeight).toFixed(4),
    nw: +(box.offsetWidth / cv.clientWidth).toFixed(4),
    nh: +(box.offsetHeight / cv.clientHeight).toFixed(4),
  };
  if (opts.length) it.options = opts;
  FRM.make.push(it);
  $('frmNm').value = '';
  $('frmMade').textContent = T.frmMade(FRM.make.length);
  frmSay(T.frmMade(FRM.make.length));
  return true;
}

async function frmGo() {
  const off = whyOff();
  if (off) { frmSay(off, 'bad'); return; }
  /* ═══ СОЗДАНИЕ И ЗАПОЛНЕНИЕ - ДВА РАЗНЫХ ДЕЛА, И ПОРЯДОК ВАЖЕН ═══
     Есть незакреплённые новые поля - сперва создаём их и ПЕРЕЧИТЫВАЕМ форму: заполнять
     можно только то, что воркер уже видит. Слепи мы оба шага в один запрос - отказ на
     половине оставил бы человека в неведении, какая половина прошла. */
  if ($('frmMake').hidden === false && ($('frmNm').value || '').trim()) {
    if (!frmAddCommit()) return;
  }
  if (FRM.make.length) {
    frmSay(T.working);
    const ok = await apply({ op: 'form_make', spec: JSON.stringify(FRM.make) });
    if (!ok) { frmSay($('say').textContent || T.working, 'bad'); return; }
    const n = FRM.make.length;
    FRM.make = [];
    $('frmMade').textContent = '';
    $('frmMake').hidden = true;
    await frmOpen();
    say(T.frmMadeDone(n), 'ok');
    return;
  }
  const vals = {};
  for (const el of $('frmList').querySelectorAll('[data-name]')) {
    if (el.disabled) continue;
    const nm = el.dataset.name;
    if (el.type === 'checkbox') {
      vals[nm] = el.checked ? el.dataset.on : '/Off';
    } else {
      vals[nm] = el.value;
    }
  }
  if (!Object.keys(vals).length) { frmSay(T.frmNothing, 'bad'); return; }
  frmSay(T.working);
  const ok = await apply({ op: 'form_fill', fields: JSON.stringify(vals) });
  if (!ok) { frmSay($('say').textContent || T.working, 'bad'); return; }
  const cyr = Object.values(vals).some((v) => /[^\u0000-\u00ff]/.test(String(v)));
  frmClose();
  /* НЕЛАТИНИЦУ НАЗЫВАЕМ ЧЕЛОВЕКУ, А НЕ ПРЯЧЕМ В ОТВЕТЕ ВОРКЕРА: читалка перерисует поля
     сама, но в части просмотрщиков поле выглядит пустым, и об этом он должен узнать от
     нас, а не от получателя документа. */
  say(T.frmDone(Object.keys(vals).length) + (cyr ? ' ' + T.frmCyr : ''), 'ok');
}

async function sigKeep() {
  if (!INIT) { sigSay(T.noSign); return; }
  const dflt = (SIG_PICK >= 0 && SIG_LIST[SIG_PICK]) ? SIG_LIST[SIG_PICK].name : '';
  const nm = await askText(T.signAskName, dflt);
  if (nm === null) return;
  sigSay(T.working);
  try {
    const blob = await (await fetch(SIG_PNG)).blob();
    const r = await fetch(u('/pdf/sig'), { method: 'POST', body: blob });
    const j = await r.json().catch(() => null);
    if (!r.ok || !j || !j.ok) {
      sigSay((j && (j.human || j.error)) || ('HTTP ' + r.status));
      return;
    }
  } catch (e) { sigSay(String(e && e.message || e)); return; }
  const rr = await signalAsk({ kind: 'pdfsig', act: 'sig_save', sid: SID, nm2: nm });
  if (rr.res && rr.res.signs) { SIG_LIST = rr.res.signs; SIG_PICK = -1; sigPaintSaved(); }
  sigSay((rr.res && rr.res.note) || (rr.why ? T.signWait : ''));
}

function sigClose() {
  SIG_PHASE = '';
  $('sig').classList.remove('on');
  $('sigBar').hidden = true;
}

async function sigOpen() {
  if (!DOC) return;
  const off = whyOff();
  if (off) { say(off, 'bad'); return; }
  SIG_PHASE = 'pick';
  SIG_PNG = ''; SIG_PICK = -1;
  /* СТАВИМ НА ВЫДЕЛЕННУЮ, А БЕЗ ВЫДЕЛЕНИЯ - НА ПОСЛЕДНЮЮ, И ЭТО ВИДНО СТРОКОЙ. Молчаливое
     «наверное, сюда» здесь недопустимо: подпись не на той странице человек заметит уже
     после отправки файла. */
  const sel = PAGES.map((p, i) => p.sel ? i : -1).filter((i) => i >= 0);
  SIG_PAGE = sel.length ? sel[0] : PAGES.length - 1;
  $('sigTtl').textContent = T.signTtl;
  $('sigNote').textContent = T.signNote;
  $('sigPickBox').hidden = false;
  $('sigPlaceBox').hidden = true;
  $('bSigClear').textContent = T.signClear;
  $('bSigFile').textContent = T.signFile;
  $('bSigCancel').textContent = T.signCancel;
  $('bSigKeep').textContent = T.signKeep;
  $('bSigKeep').hidden = true;
  $('bSigGo').textContent = T.signNext;
  $('sigDrawTtl').textContent = T.signDraw;
  $('sig').classList.add('on');
  $('sigBar').hidden = false;
  sigSay('');
  sigPaintSaved();
  sigPadInit();
  sigLoadSaved();
}

/* ═══ ШОВ ДЛЯ БРАУЗЕРНОЙ ПРОБЫ ═══
   Страница - ES-модуль, и её внутренности снаружи не видны. Проба, которая ради этого
   завела бы СВОЮ копию обрезки по чернилам, проверяла бы себя, а не продукт (закон №40),
   поэтому наружу отдаётся ссылка на боевые функции. Тот же ход, что `window.__SND_LAST`
   на странице комнаты. Ничего, кроме чтения, здесь нет: поставить подпись через этот шов
   нельзя - для этого нужны билет и приём. */
window.__studio = {
  fromPad: () => sigFromPad(),
  page: () => SIG_PAGE,
  phase: () => SIG_PHASE,
  png: () => SIG_PNG.slice(0, 24),
  /* ПЕРЕРИСОВКА ХОЛСТА - ТОЖЕ БОЕВАЯ ФУНКЦИЯ, А НЕ КОПИЯ В ПРОБЕ. Браузерному прогону
     она нужна, чтобы поставить на холст ТОТ ЖЕ лист, по которому воркер считал блоки:
     заведи проба свою загрузку - она проверяла бы правку против другого документа. */
  reshow: () => reshow(),
};

async function sigNext() {
  if (SIG_PHASE === 'pick') {
    const drawn = sigFromPad();
    if (drawn) SIG_PNG = drawn;
    if (!SIG_PNG) { sigSay(T.signEmpty); return; }
    await sigPlace();
    return;
  }
  await sigApply();
}

     ИМЕЛИ - их подписи приехали из разметки, то есть в английской студии на тулбаре

  $('bForm').textContent = T.form;

(async function boot() {
  texts();
  if (tg) { try { tg.ready(); tg.expand(); } catch (e) { /* браузер */ } }
  const off = whyOff();
  if (off) { $('sub').textContent = ''; say(off, 'bad'); }
  else $('sub').textContent = '';
  checkVersion();
  pdfjs = await loadPdfjs();
  if (!pdfjs) note(pdfjsWhy());

  /* ЧТО ПРОСИЛИ ОТКРЫТЬ - ЧИТАЕМ ИЗ АДРЕСА. Неизвестное имя игнорируем молча: чужой
     параметр в ссылке не повод пугать человека ошибкой. */
  try {
    const _s = (new URLSearchParams(location.search)).get('screen') || '';
    if (SCREENS[_s]) {
      WANT_SCREEN = _s;
      note(T.scrWait);
    }
  } catch (e) { /* адрес без параметров */ }

  $('drop').onclick = () => $('file').click();
  /* ЗНАЧЕНИЕ ВВОДА СБРАСЫВАЕМ: выбери человек тот же набор второй раз - `change` не
     придёт вовсе, и страница будет выглядеть замершей. */
  /* СПИСОК КОПИРУЕТСЯ ДО СБРОСА, И ЭТО НЕ СТИЛЬ: `files` - ЖИВОЙ объект ввода, и
     `value = ''` обнуляет его же. Первая редакция читала `files` после сброса и получала
     пустой список: документ не открывался ВОВСЕ, а выглядело это как «страница зависла».
     Нашёл браузерный прибор на первом же прогоне (закон №75). */
  $('file').onchange = (e) => {
    const fs = [...e.target.files];
    e.target.value = '';
    pick(fs);
  };
  ['dragenter', 'dragover'].forEach((n) => document.addEventListener(n, (e) => {
    e.preventDefault(); $('drop').classList.add('hot');
  }));
  ['dragleave', 'drop'].forEach((n) => document.addEventListener(n, (e) => {
    e.preventDefault(); $('drop').classList.remove('hot');
  }));
  /* ПЕРЕТАСКИВАНИЕ ИДЁТ ТЕМ ЖЕ РЕШАТЕЛЕМ, ЧТО КНОПКА (`pick`): своя проверка формата
     здесь была второй копией правила, и с приходом картинок она отказывала бы на том,
     что кнопка принимает (закон №40). */
  document.addEventListener('drop', (e) => {
    const fs = e.dataTransfer && e.dataTransfer.files;
    if (fs && fs.length) pick(fs);
  });
  $('bAll').onclick = () => { PAGES.forEach((p) => p.sel = true); paint(); };
  $('bNone').onclick = () => { PAGES.forEach((p) => p.sel = false); paint(); };
  $('bRotL').onclick = () => rotate(-90);
  $('bRotR').onclick = () => rotate(90);
  $('bKeep').onclick = () => {
    const idx = selIdx();
    if (!idx.length) { say(T.pick, 'bad'); return; }
    if (idx.length === PAGES.length) { say(T.keepAll, 'bad'); return; }
    PAGES = PAGES.filter((p) => p.sel);
    PAGES.forEach((p) => p.sel = false);
    DIRTY = true; say(''); paint();
  };
  $('bDel').onclick = () => {
    const idx = selIdx();
    if (!idx.length) { say(T.pick, 'bad'); return; }
    if (idx.length === PAGES.length) { say(T.delAll, 'bad'); return; }
    PAGES = PAGES.filter((p) => !p.sel);
    DIRTY = true; say(''); paint();
  };
  $('bZip').onclick = async () => { await apply({ op: 'compress' }); };
  /* ОБЪЕДИНЕНИЕ БЕРЁТ ВТОРОЙ ФАЙЛ ТЕМ ЖЕ ВВОДОМ, ЧТО СРАВНЕНИЕ (`cmpFile`), НО РАЗБИРАЕТ
     ЕГО СВОИМ обработчиком: один `<input type=file>` на две операции - это одна дверь к
     файловой системе, а решают они разное. Какой из двух ждёт файл, помнит `MRG_WAIT`:
     без него второй выбор уехал бы в сравнение (`onchange` у ввода один). */
  $('bMrg').onclick = () => {
    const off = whyOff();
    if (off) { say(off, 'bad'); return; }
    if (!DOC) { say(T.mrgPick, 'bad'); return; }
    MRG_WAIT = true;
    say(T.mrgPick);
    $('cmpFile').click();
  };
  $('bSpl').onclick = () => splMode(!SPL.on);
  $('bSplGo').onclick = splGo;
  $('bSign').onclick = sigOpen;
  $('bForm').onclick = frmOpen;
  $('bCrop').onclick = crpOpen;
  $('bMore').onclick = morOpen;
  $('bMorClose').onclick = morClose;
  $('bMorOcr').onclick = morOcr;
  $('bMorWm').onclick = morWm;
  $('bMorPg').onclick = morPg;
  $('bMorMd').onclick = morMd;
  $('bMorPwOn').onclick = () => morPwSet(true);
  $('bMorPwOff').onclick = () => morPwSet(false);
  $('bCrpCancel').onclick = crpClose;
  $('bCrpReset').onclick = crpReset;
  $('bCrpGo').onclick = crpGo;
  $('bRdt').onclick = rdtOpen;
  $('bRdtCancel').onclick = rdtClose;
  $('bRdtAdd').onclick = rdtAdd;
  $('bRdtGo').onclick = rdtGo;
  $('bFrmCancel').onclick = frmClose;
  $('bFrmAdd').onclick = frmAddMode;
  $('bFrmGo').onclick = frmGo;
  $('bCmp').onclick = cmpOpen;
  $('bTxt').onclick = txtOpen;
  $('bCmpCancel').onclick = cmpClose;
  $('bCmpPick').onclick = () => { MRG_WAIT = false; $('cmpFile').click(); };
  $('cmpFile').onchange = (e) => {
    const f = e.target.files[0];
    /* ВВОД СБРАСЫВАЕМ ВСЕГДА: без этого второй выбор ТОГО ЖЕ файла не даёт `onchange`
       вовсе (значение не изменилось), и человек нажимает кнопку, а ничего не происходит. */
    e.target.value = '';
    if (!f) return;
    if (MRG_WAIT) { MRG_WAIT = false; mrgGo(f); return; }
    cmpPick(f);
  };
  $('bCmpMode').onclick = () => cmpMode(true);
  $('bCmpGo').onclick = cmpGo;
  $('bCmpPrev').onclick = () => { CMP.page -= 1; cmpPaintPage(); };
  $('bCmpNext').onclick = () => { CMP.page += 1; cmpPaintPage(); };
  /* ПРАВКА ТЕКСТА. Листание ПЕРЕСПРАШИВАЕТ СТРОКИ, а не только перерисовывает холст:
     блоки приходят на ОДНУ страницу, и показать лист без них значило бы показать лист,
     по которому ничего не тапается. */
  $('bAnnCancel').onclick = annClose;
  $('bAnnAdd').onclick = annAdd;
  $('bAnnGo').onclick = annGo;
  $('annBurn').onchange = annBurnNote;
  $('bAnn').onclick = annOpen;
  $('bTxtCancel').onclick = txtClose;
  $('bTxtPrev').onclick = () => { TXT.page -= 1; txtLoad(); };
  $('bTxtNext').onclick = () => { TXT.page += 1; txtLoad(); };
  $('bTxtDrop').onclick = txtDrop;
  $('bTxtGo').onclick = txtApply;
  $('bSigCancel').onclick = sigClose;
  $('bSigGo').onclick = sigNext;
  $('bSigKeep').onclick = sigKeep;
  $('bSigClear').onclick = () => {
    const c = $('sigPad');
    if (c.__reset) c.__reset();
    SIG_PNG = ''; SIG_PICK = -1; sigPaintSaved(); sigSay('');
  };
  $('bSigFile').onclick = () => $('sigFile').click();
  $('sigFile').onchange = (e) => {
    const f = e.target.files[0];
    if (!f) return;
    const fr = new FileReader();
    fr.onload = () => {
      /* ПРОВЕРЯЕМ КАРТИНКУ ЗАГРУЗКОЙ, А НЕ РАСШИРЕНИЕМ: имя приходит от файловой системы
         и ничего не доказывает, а `img.onerror` - доказывает. Приём на песочнице спросит
         то же самое у первых байт: два забора на разных концах, как у самого документа. */
      const probe = new Image();
      probe.onload = () => {
        SIG_PNG = fr.result;
        SIG_PICK = -1;
        if ($('sigPad').__reset) $('sigPad').__reset();
        sigPaintSaved();
        sigSay('');
      };
      probe.onerror = () => sigSay(T.signBad);
      probe.src = fr.result;
    };
    fr.onerror = () => sigSay(T.signBad);
    fr.readAsDataURL(f);
  };
  sigWireBox();
  $('bReset').onclick = () => {
    if (!DOC) return;
    PAGES = [];
    for (let i = 1; i <= DOC.numPages; i++) PAGES.push({ src: i, rot: 0, sel: false });
    DIRTY = false; say(''); paint();
  };
  $('bSave').onclick = save;
  $('bChat').onclick = toChat;
  $('bZclose').onclick = () => $('zoom').classList.remove('on');
})();
</script>
