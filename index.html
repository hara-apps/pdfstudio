const VERSION = '4ff0c1bc6087';
/* АДРЕСА - ПАРАМЕТРОМ ССЫЛКИ СИЛЬНЕЕ ЗАШИТОГО ПРИ ВЫКЛАДКЕ. Причина записана в
   publish_static.page_url и стоила полдня: `https://hara-search.laynenorstrud.workers.dev` подставляется В МОМЕНТ ДЕПЛОЯ, и
   если Worker тогда не был в реестре, страница остаётся без адреса НАВСЕГДА. Ссылку же
   бот собирает заново на каждый тап. */
const API = (Q.get('api') || 'https://hara-search.laynenorstrud.workers.dev').replace(/\/+$/, '');
const BASE = (Q.get('pdf') || '').replace(/\/+$/, '');
const INIT = (tg && tg.initData) || '';

const $ = (id) => document.getElementById(id);
const say = (t, cls) => { const e = $('say'); e.textContent = t || ''; e.className = cls || ''; };
const note = (t) => { const e = $('note'); e.textContent = t || ''; e.hidden = !t; };

/* ═══ ПОЧЕМУ НЕ РАБОТАЕТ - ТРИ РАЗНЫХ ОТВЕТА, А НЕ ОДИН ═══
   Живой урок плеера: одна фраза «связи с ботом нет» стояла и там, где нет адреса, и там,
   где нет подписи, - и разбор полдня шёл в сторону исправного Worker'а. */
function whyOff() {
  if (!INIT) return T.noSign;
  if (!API) return T.noApi;
  if (!BASE) return T.noBase;
  return '';
}

/* ═══════════════════════════════════════════════════════════════════════════════
   PDF.JS: СОВРЕМЕННАЯ СБОРКА, ОТКАТ НА LEGACY БЕЗ ПЕРЕДЕЛКИ
   Обе лежат рядом со страницей (условие Ren: откат не должен требовать выкладки). Какая
   из них поедет, решает ФАКТ загрузки, а не разбор UserAgent: UA врёт, а неудавшийся
   импорт - это факт. Разница по весу мала (494 КБ gzip против 529), и держать вторую
   ради вебвью, которого мы не видели живьём, дешевле, чем узнать о несовместимости от
   человека.
   ═══════════════════════════════════════════════════════════════════════════════ */
let pdfjs = null, PDFJS_BUILD = '';
const PDFJS_BUILDS = [['.', 'modern'], ['./legacy', 'legacy']];
async function loadOne(i) {
  if (i >= PDFJS_BUILDS.length) return null;
  const [dir, tag] = PDFJS_BUILDS[i];
  try {
    const lib = await import(dir + '/pdf.min.mjs');
    lib.GlobalWorkerOptions.workerSrc = dir + '/pdf.worker.min.mjs';
    PDFJS_BUILD = tag;
    return lib;
  } catch (e) {
    console.log('[pdf] сборка ' + tag + ' не поднялась: ' + e);
    return null;
  }
}
async function loadPdfjs() {
  for (let i = 0; i < PDFJS_BUILDS.length; i++) {
    const lib = await loadOne(i);
    if (lib) return lib;
  }
  return null;
}
/* ═══ ОТКАТ НА LEGACY ИДЁТ И ПО ОТКАЗУ В РАБОТЕ, А НЕ ТОЛЬКО ПО ОТКАЗУ ИМПОРТА ═══
   НАЙДЕНО БРАУЗЕРНЫМ ПРОГОНОМ, а не чтением: в Chromium 1194 современная сборка
   ИМПОРТИРУЕТСЯ БЕЗ ЕДИНОЙ ОШИБКИ и падает уже на документе -
   `this[#Yr].getOrInsertComputed is not a function`. Лестница по импорту такого не ловит
   по построению, и человек на старом вебвью получал бы сырую строку чужой ошибки вместо
   отката, ради которого вторая сборка и лежит рядом (условие Ren: откат без переделки). */
async function pdfjsFallback() {
  if (PDFJS_BUILD === 'legacy') return false;
  const lib = await loadOne(1);
  if (!lib) return false;
  pdfjs = lib;
  console.log('[pdf] современная сборка не сработала на документе - перешёл на legacy');
  return true;
}

/* ═══════════════════════════════════════════════════════════════════════════════
   СОСТОЯНИЕ. Порядок страниц и повороты живут ЗДЕСЬ, а применяются ОДНИМ вызовом на
   песочнице. Гонять документ туда-сюда на каждый поворот значило бы платить сетью за
   то, что человек делает пальцем.
   ═══════════════════════════════════════════════════════════════════════════════ */
let TICKET = '', SID = '', DOC = null, NAME = '', MAXMB = 100;
let PAGES = [];          // [{src:<номер в исходнике, с 1>, rot:<0|90|180|270>, sel:bool}]
let DIRTY = false;       // есть ли несохранённые намерения
let THUMBS = new Map();  // src -> canvas (рисуем один раз, перестановка их не меняет)

const req = async (path, opt) => {
  const o = opt || {};
  o.headers = Object.assign({ 'X-Init-Data': INIT }, o.headers || {});
  const r = await fetch(path, o);
  let j = null;
  try { j = await r.json(); } catch (e) { j = null; }
  return { status: r.status, j: j };
};

/* ── билет ─────────────────────────────────────────────────────────────────────── */
async function ticket() {
  if (TICKET) return TICKET;
  const r = await req(API + '/pdf/ticket', { method: 'POST', body: '{}' });
  if (r.status !== 200 || !r.j || !r.j.ticket) {
    const why = (r.j && (r.j.error || r.j.human)) || ('HTTP ' + r.status);
    throw new Error('пропуск не выдан: ' + why);
  }
  TICKET = r.j.ticket; SID = r.j.sid;
  return TICKET;
}
const u = (p) => BASE + p + '?ticket=' + encodeURIComponent(TICKET);

/* ── загрузка файла ────────────────────────────────────────────────────────────── */
async function upload(f) {
  const off = whyOff();
  if (off) { say(off, 'bad'); return; }
  if (f.size > MAXMB * 1048576) { say(T.big(MAXMB), 'bad'); return; }
  say(T.sending);
  try {
    await ticket();
    /* ИМЯ ЕДЕТ PERCENT-ENCODED: в HTTP-заголовке сырой UTF-8 не переживает дорогу
       (спецификация разрешает там latin-1), и «отчёт.pdf» приехал бы мусором. Приём
       раскодирует. Проверено живым прогоном службы: без этого имя схлопывалось в « .pdf». */
    const r = await fetch(u('/pdf/upload'), {
      method: 'POST', body: f,
      headers: { 'X-Pdf-Name': encodeURIComponent(f.name || 'document.pdf') },
    });
    const j = await r.json().catch(() => null);
    if (!r.ok || !j || !j.ok) {
      say((j && (j.human || j.error)) || ('HTTP ' + r.status), 'bad');
      return;
    }
    NAME = j.name || f.name || 'document.pdf';
    await render(f);
    say('');
  } catch (e) {
    say(String(e && e.message || e), 'bad');
  }
}

/* ── отрисовка ─────────────────────────────────────────────────────────────────── */
async function render(fileOrBytes) {
  if (!pdfjs) { say('pdf.js не поднялся - показать страницы нечем.', 'bad'); return; }
  say(T.loading);
  /* БАЙТЫ БЕРЁМ ЗАНОВО НА КАЖДУЮ ПОПЫТКУ, И ЭТО НЕ ПЕДАНТИЗМ: pdf.js ПЕРЕДАЁТ буфер
     воркеру, то есть ОТСОЕДИНЯЕТ его. Замер: вторая попытка на том же буфере падала
     `Cannot perform Construct on a detached ArrayBuffer` - то есть откат на legacy был бы
     мёртвым по построению. Из файла байты читаются заново и лишней памяти в обычном пути
     это не стоит. */
  const bytes = async () => (fileOrBytes instanceof Blob
    ? await fileOrBytes.arrayBuffer()
    : fileOrBytes.slice(0));
  /* ОТКАТ ОБНИМАЕТ ВЕСЬ ПЕРВЫЙ ПРОХОД, А НЕ ОДИН `getDocument`. Сборка ломается и на
     отрисовке страницы тоже (замер: `getOrInsertComputed` прилетел из `page.render`, а не
     из разбора документа), и узкий try поймал бы только половину случаев. */
  try {
    await renderWith(await bytes());
  } catch (e) {
    if (!(await pdfjsFallback())) throw e;
    await renderWith(await bytes());
  }
}

async function renderWith(buf) {
  DOC = await pdfjs.getDocument({ data: new Uint8Array(buf) }).promise;
  PAGES = [];
  for (let i = 1; i <= DOC.numPages; i++) PAGES.push({ src: i, rot: 0, sel: false });
  THUMBS.clear();
  DIRTY = false;
  $('drop').hidden = true;
  $('tools').hidden = false;
  $('bar').hidden = false;
  await paint();
}

async function thumb(src) {
  if (THUMBS.has(src)) return THUMBS.get(src);
  const page = await DOC.getPage(src);
  const vp = page.getViewport({ scale: 1 });
  const scale = Math.min(1.4, 190 / vp.width);
  const v = page.getViewport({ scale: scale });
  const c = document.createElement('canvas');
  c.width = Math.ceil(v.width); c.height = Math.ceil(v.height);
  await page.render({ canvasContext: c.getContext('2d'), viewport: v }).promise;
  THUMBS.set(src, c);
  return c;
}

async function paint() {
  const g = $('grid');
  g.textContent = '';
  for (let i = 0; i < PAGES.length; i++) {
    const p = PAGES[i];
    const d = document.createElement('div');
    d.className = 'pg' + (p.sel ? ' sel' : '');
    d.dataset.i = String(i);
    const c = await thumb(p.src);
    const shown = c.cloneNode(true);
    shown.getContext('2d').drawImage(c, 0, 0);
    /* ПОВОРОТ ПОКАЗЫВАЕМ CSS-ОМ, А ПРИМЕНЯЕМ НА ПЕСОЧНИЦЕ. Перерисовывать страницу
       ради предпросмотра значило бы платить временем за то, что видно и так. */
    if (p.rot) shown.style.transform = 'rotate(' + p.rot + 'deg)';
    d.appendChild(shown);
    const n = document.createElement('div');
    n.className = 'n';
    n.textContent = (i + 1) + (p.src !== i + 1 ? ' (' + p.src + ')' : '')
                  + (p.rot ? ' ' + p.rot + '°' : '');
    d.appendChild(n);
    const x = document.createElement('button');
    x.className = 'x'; x.textContent = '✕'; x.title = T.del;
    x.onclick = (ev) => { ev.stopPropagation(); dropPage(i); };
    d.appendChild(x);
    d.onclick = () => { p.sel = !p.sel; paint(); };
    g.appendChild(d);
  }
  const nsel = PAGES.filter((p) => p.sel).length;
  $('sub').textContent = (NAME ? NAME + ' · ' : '') + T.pages(PAGES.length)
                       + (nsel ? T.sel(nsel) : '');
  wireDrag();
}

function dropPage(i) {
  if (PAGES.length <= 1) { say(T.delAll, 'bad'); return; }
  PAGES.splice(i, 1); DIRTY = true; say(''); paint();
}

/* ═══ ПЕРЕТАСКИВАНИЕ НА POINTER EVENTS, А НЕ НА HTML5 DRAG ═══
   HTML5 drag-and-drop на мобильных не работает вовсе - там нет `dragstart`. Pointer
   events одинаковы для мыши и пальца, поэтому одна реализация закрывает обе платформы, и
   ветки «если телефон» здесь нет ни одной. */
function wireDrag() {
  let from = -1, ghost = null;
  const cards = [...document.querySelectorAll('.pg')];
  cards.forEach((el) => {
    el.onpointerdown = (e) => {
      if (e.target.classList.contains('x')) return;
      from = +el.dataset.i;
      ghost = el;
      el.setPointerCapture(e.pointerId);
      el.classList.add('drag');
    };
    el.onpointermove = (e) => {
      if (from < 0 || ghost !== el) return;
      const t = document.elementFromPoint(e.clientX, e.clientY);
      const card = t && t.closest ? t.closest('.pg') : null;
      cards.forEach((c) => c.classList.remove('over'));
      if (card && card !== el) card.classList.add('over');
    };
    el.onpointerup = (e) => {
      if (from < 0 || ghost !== el) return;
      const t = document.elementFromPoint(e.clientX, e.clientY);
      const card = t && t.closest ? t.closest('.pg') : null;
      el.classList.remove('drag');
      cards.forEach((c) => c.classList.remove('over'));
      const to = card ? +card.dataset.i : -1;
      const was = from;
      from = -1; ghost = null;
      if (to >= 0 && to !== was) {
        const [m] = PAGES.splice(was, 1);
        PAGES.splice(to, 0, m);
        DIRTY = true; say(''); paint();
      }
    };
  });
}

/* ── операции ──────────────────────────────────────────────────────────────────── */
function selIdx() { return PAGES.map((p, i) => p.sel ? i : -1).filter((i) => i >= 0); }

function rotate(deg) {
  const idx = selIdx();
  const target = idx.length ? idx : PAGES.map((_p, i) => i);
  target.forEach((i) => { PAGES[i].rot = (((PAGES[i].rot + deg) % 360) + 360) % 360; });
  DIRTY = true; say(''); paint();
}

/* ═══ ОДИН ВЫЗОВ НА ВСЁ НАМЕРЕНИЕ, А НЕ ПО ВЫЗОВУ НА ТАП ═══
   Порядок, удаление и повороты копятся на странице и уезжают вместе: две операции
   означали бы два прохода по стомегабайтному документу и два повода разойтись
   состояниями. Порядок применяется ПЕРВЫМ, повороты - вторым и уже по НОВЫМ номерам:
   наоборот они легли бы на страницы, которых в результате нет. */
/* Ответ ПОСЛЕДНЕЙ операции: заполняется в `apply`, читается тем, кому нужны его слова. */
let LAST_RES = null;

async function apply(extra) {
  LAST_RES = null;
  const off = whyOff();
  if (off) { say(off, 'bad'); return false; }
  say(T.working);
  try {
    const order = PAGES.map((p) => p.src).join(',');
    const r1 = await fetch(u('/pdf/op'), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ op: 'pages', order: order }),
    });
    const j1 = await r1.json().catch(() => null);
    if (!r1.ok || !j1 || !j1.ok) {
      say((j1 && (j1.human || j1.error)) || ('HTTP ' + r1.status), 'bad'); return false;
    }
    const groups = {};
    PAGES.forEach((p, i) => {
      if (p.rot) (groups[p.rot] = groups[p.rot] || []).push(i + 1);
    });
    for (const deg of Object.keys(groups)) {
      const r2 = await fetch(u('/pdf/op'), {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ op: 'rotate', turn: deg, pages: groups[deg].join(',') }),
      });
      const j2 = await r2.json().catch(() => null);
      if (!r2.ok || !j2 || !j2.ok) {
        say((j2 && (j2.human || j2.error)) || ('HTTP ' + r2.status), 'bad'); return false;
      }
    }
    if (extra) {
      const r3 = await fetch(u('/pdf/op'), {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(extra),
      });
      const j3 = await r3.json().catch(() => null);
      if (!r3.ok || !j3 || !j3.ok) {
        say((j3 && (j3.human || j3.error)) || ('HTTP ' + r3.status), 'bad'); return false;
      }
      /* ОТВЕТ ПОСЛЕДНЕЙ ОПЕРАЦИИ ОСТАЁТСЯ ДОСТУПНЫМ ВЫЗЫВАЮЩЕМУ. `apply` отдаёт только
         «вышло/не вышло», а воркер иногда говорит БОЛЬШЕ: скрытие данных предупреждает,
         что картинка есть на странице ещё раз. Потеряй мы это по дороге - человек решит,
         что убрал лицо, а оно видно рядом. */
      LAST_RES = j3.res || null;
    }
    say(T.ready, 'ok');
    return true;
  } catch (e) {
    say(String(e && e.message || e), 'bad');
    return false;
  }
}

/* ── отдача ────────────────────────────────────────────────────────────────────── */
async function save() {
  if (!(await apply(null))) return;
  /* СКАЧИВАНИЕ ИДЁТ ССЫЛКОЙ, А НЕ fetch+blob: стомегабайтный ответ, собранный в память
     вкладки, на телефоне её и роняет. Билет поэтому едет в query - к ссылке, которую
     открывает сам браузер, заголовок не прицепить ничем. */
  const a = document.createElement('a');
  a.href = u('/pdf/result');
  a.download = NAME || 'document.pdf';
  document.body.appendChild(a); a.click(); a.remove();
  /* СЕССИЯ ЗАКРЫВАЕТСЯ НА ТОЙ СТОРОНЕ, СРАЗУ ПОСЛЕ ОТДАЧИ. Здесь мы только говорим об
     этом человеку: держать кнопку «Скачать» живой над снесённой сессией значило бы
     обещать то, что уже не выполнится. */
  setTimeout(() => { say(T.gone); $('bar').hidden = true; }, 1200);
}

async function toChat() {
  if (!INIT) { say(T.noSign, 'bad'); return; }
  if (!(await apply(null))) return;
  const r = await req(API + '/signal', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ kind: 'pdf', sid: SID }),
  });
  if (r.status !== 200) { say('не отправилось: HTTP ' + r.status, 'bad'); return; }
  say(T.sentChat, 'ok');
  $('bar').hidden = true;
}

/* ═══════════════════════════════════════════════════════════════════════════════
   САМООБНОВЛЕНИЕ. Спрашиваем WORKER'А, а не файл рядом со страницей: сосед лежит на том
   же хосте и попадает в тот же кэш вебвью, то есть отвечает ровно так же устарело -
   старая страница спрашивала бы у старого файла, свежа ли она, и получала «да».
   ЧЕТЫРЕ ИСХОДА, А НЕ ДВА: свежая / есть новее (перезагрузка) / договор разошёлся
   (перезагрузка НЕ лечит) / перезагрузились и всё равно старые (сами не можем).
   ═══════════════════════════════════════════════════════════════════════════════ */
async function checkVersion() {
  if (!API) return;
  try {
    const r = await fetch(API + '/appver?app=pdfstudio');
    const j = await r.json();
    if (!j || j.error) return;                       // молчание не мешает работать
    if (!j.ver || j.ver === VERSION) return;
    if (Q.get('r') === '1') { note(T.oldStuck); return; }
    note(T.old);
    const q = new URLSearchParams(location.search);
    q.set('v', j.ver); q.set('r', '1');
    location.replace(location.pathname + '?' + q.toString());
  } catch (e) { /* сеть молчит - работаем как есть */ }
}

/* ═══════════════════════════════════════════════════════════════════════════════
   ПОДПИСЬ НА СТРАНИЦЕ
   ═══════════════════════════════════════════════════════════════════════════════
   ГЛАВНОЕ РЕШЕНИЕ: НАРУЖУ ЕДУТ ДОЛИ КАДРА, А НЕ КООРДИНАТЫ PDF.
   `viewport.convertToPdfPoint` у pdf.js масштаб съедает верно, но у страницы с
   `/Rotate 90` отдаёт координаты MEDIABOX, а воркер строит накладку в ВИДИМОМ размере -
   это две разные системы, и подпись на повёрнутой странице легла бы не туда. Доли же
   считаются от кадра, который эта самая страница и нарисовала, поэтому системе координат
   PDF взяться неоткуда. Проверено рендером на всех четырёх формах листа.
   ═══════════════════════════════════════════════════════════════════════════════ */
let SIG_PNG = '';        // dataURL выбранной/нарисованной подписи
let SIG_PAGE = 0;        // индекс страницы в PAGES, куда ставим
let SIG_PHASE = '';      // '' | 'pick' | 'place'
let SIG_LIST = [];       // [{num, name, png}] из профиля
let SIG_PICK = -1;       // выбранная сохранённая (её имя предложим при «в профиль»)

const sigSay = (t) => { $('sigSay').textContent = t || ''; };

/* ── своя карточка вместо prompt (в вебвью Telegram его не показывают) ─────────── */
function askText(title, dflt) {
  return new Promise((res) => {
    $('askTtl').textContent = title;
    $('askInput').value = dflt || '';
    $('askNo').textContent = T.cancel;
    $('askYes').textContent = T.ok;
    $('ask').classList.add('on');
    setTimeout(() => { try { $('askInput').focus(); } catch (e) {} }, 60);
    const done = (v) => { $('ask').classList.remove('on'); res(v); };
    $('askNo').onclick = () => done(null);
    $('askYes').onclick = () => done($('askInput').value);
    $('askInput').onkeydown = (e) => { if (e.key === 'Enter') done($('askInput').value); };
  });
}

/* ВОПРОС «ДА ИЛИ НЕТ» - ТОЙ ЖЕ КАРТОЧКОЙ, ЧТО И ВОПРОС СО СТРОКОЙ. Заводить вторую
   означало бы две разные карточки с одинаковой работой, а `confirm()` в вебвью Telegram не
   показывают так же, как и `prompt()`. Поле ввода просто прячется: оно здесь лишнее, а
   показанное пустым читается как «надо что-то написать». */
function askYesNo(title) {
  return new Promise((res) => {
    $('askTtl').textContent = title;
    $('askInput').hidden = true;
    $('askNo').textContent = T.no;
    $('askYes').textContent = T.yes;
    $('ask').classList.add('on');
    const done = (v) => {
      $('ask').classList.remove('on');
      $('askInput').hidden = false;
      res(v);
    };
    $('askNo').onclick = () => done(false);
    $('askYes').onclick = () => done(true);
  });
}

/* ── ящик сигналов: положить и дождаться ответа ────────────────────────────────
   ТРИ МОЛЧАНИЯ РАЗЛИЧИМЫ. «Бот не забрал», «забрал и работает дольше окна» и «ответа нет»
   лечатся по-разному, и одна фраза на все три отправляла бы чинить не то (урок комнаты). */
async function signalAsk(body, tries) {
  const r = await req(API + '/signal', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  if (r.status !== 200 || !r.j || !r.j.id) return { why: 'HTTP ' + r.status };
  const id = r.j.id;
  for (let i = 0; i < (tries || 20); i++) {
    await new Promise((z) => setTimeout(z, 1200));
    const g = await req(API + '/result?id=' + encodeURIComponent(id));
    if (g.status === 200 && g.j && g.j.state === 'done') return { res: g.j.res || {} };
  }
  return { why: 'timeout' };
}

/* ── холст рисования ───────────────────────────────────────────────────────────── */
function sigPadInit() {
  const c = $('sigPad');
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = c.clientWidth || 300, h = c.clientHeight || 190;
  c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);
  const g = c.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);
  g.lineWidth = 3; g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = '#101020';
  let drawing = false, drawn = false;
  const at = (e) => {
    const r = c.getBoundingClientRect();
    return [e.clientX - r.left, e.clientY - r.top];
  };
  c.onpointerdown = (e) => {
    e.preventDefault();
    drawing = true; drawn = true;
    const [x, y] = at(e);
    g.beginPath(); g.moveTo(x, y);
    try { c.setPointerCapture(e.pointerId); } catch (z) {}
    SIG_PICK = -1; sigPaintSaved();
  };
  c.onpointermove = (e) => {
    if (!drawing) return;
    e.preventDefault();
    const [x, y] = at(e);
    g.lineTo(x, y); g.stroke();
  };
  c.onpointerup = c.onpointercancel = () => { drawing = false; };
  c.__drawn = () => drawn;
  c.__reset = () => { g.clearRect(0, 0, w, h); drawn = false; };
}

/* ЧТО ЗАБИРАЕМ С ХОЛСТА: только то, что нарисовано, а не весь прямоугольник. Пустые поля
   вокруг росчерка на странице превратились бы в невидимый, но занятый кусок листа - и
   человек не понял бы, почему подпись не встаёт вплотную к строке. */
function sigFromPad() {
  const c = $('sigPad');
  if (!c.__drawn || !c.__drawn()) return '';
  const g = c.getContext('2d');
  const d = g.getImageData(0, 0, c.width, c.height).data;
  let x0 = c.width, y0 = c.height, x1 = -1, y1 = -1;
  for (let y = 0; y < c.height; y++) {
    for (let x = 0; x < c.width; x++) {
      if (d[(y * c.width + x) * 4 + 3] > 8) {
        if (x < x0) x0 = x;
        if (x > x1) x1 = x;
        if (y < y0) y0 = y;
        if (y > y1) y1 = y;
      }
    }
  }
  if (x1 < 0) return '';
  const pad = 6;
  x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad);
  x1 = Math.min(c.width - 1, x1 + pad); y1 = Math.min(c.height - 1, y1 + pad);
  const o = document.createElement('canvas');
  o.width = x1 - x0 + 1; o.height = y1 - y0 + 1;
  o.getContext('2d').drawImage(c, x0, y0, o.width, o.height, 0, 0, o.width, o.height);
  return o.toDataURL('image/png');
}

/* ── сохранённые подписи ───────────────────────────────────────────────────────── */
function sigPaintSaved() {
  const box = $('sigSaved');
  box.textContent = '';
  $('sigSavedTtl').textContent = SIG_LIST.length ? T.signSaved : T.signNoSaved;
  SIG_LIST.forEach((it, i) => {
    const d = document.createElement('div');
    d.className = 'sigCard' + (i === SIG_PICK ? ' sel' : '');
    const im = document.createElement('img');
    im.src = 'data:image/png;base64,' + it.png;
    d.appendChild(im);
    const nm = document.createElement('div');
    nm.className = 'nm'; nm.textContent = it.name || ('#' + it.num);
    d.appendChild(nm);
    const x = document.createElement('button');
    x.className = 'x'; x.textContent = '✕';
    x.onclick = async (ev) => {
      ev.stopPropagation();
      sigSay(T.working);
      const r = await signalAsk({ kind: 'pdfsig', act: 'sig_del', n: it.num });
      if (r.res && r.res.signs) { SIG_LIST = r.res.signs; SIG_PICK = -1; sigPaintSaved(); }
      sigSay((r.res && r.res.note) || (r.why ? T.signWait : ''));
    };
    d.appendChild(x);
    d.onclick = () => {
      SIG_PICK = i;
      SIG_PNG = 'data:image/png;base64,' + it.png;
      $('sigPad').__reset && $('sigPad').__reset();
      sigPaintSaved();
      sigSay('');
    };
    box.appendChild(d);
  });
}

async function sigLoadSaved() {
  if (!INIT || !API) return;
  const r = await signalAsk({ kind: 'pdfsig', act: 'sig_list' });
  if (r.res && r.res.signs) { SIG_LIST = r.res.signs; sigPaintSaved(); }
  else if (r.why) sigSay(T.signWait);
}

/* ── размещение ────────────────────────────────────────────────────────────────── */
async function sigPlace() {
  SIG_PHASE = 'place';
  $('sigPickBox').hidden = true;
  $('sigPlaceBox').hidden = false;
  $('bSigGo').textContent = T.signGo;
  $('bSigKeep').hidden = false;
  await sigPaintPage();
}

async function sigPaintPage() {
  const p = PAGES[SIG_PAGE];
  const cv = $('sigPageCv');
  const page = await DOC.getPage(p.src);
  const v0 = page.getViewport({ scale: 1, rotation: (page.rotate + p.rot) % 360 });
  const wide = Math.min(520, (window.innerWidth || 360) - 56);
  const sc = wide / v0.width;
  const v = page.getViewport({ scale: sc, rotation: (page.rotate + p.rot) % 360 });
  cv.width = Math.ceil(v.width); cv.height = Math.ceil(v.height);
  cv.style.width = Math.ceil(v.width) + 'px';
  await page.render({ canvasContext: cv.getContext('2d'), viewport: v }).promise;
  $('sigPage').textContent = T.signPage(SIG_PAGE + 1, PAGES.length);
  const img = $('sigImg');
  img.src = SIG_PNG;
  await new Promise((z) => { if (img.complete) z(); else img.onload = img.onerror = z; });
  const box = $('sigBox');
  const bw = Math.min(cv.clientWidth * 0.34, cv.clientWidth - 8);
  const ar = (img.naturalHeight || 1) / (img.naturalWidth || 1);
  box.style.width = bw + 'px';
  box.style.height = (bw * ar) + 'px';
  box.style.left = Math.round(cv.clientWidth * 0.55) + 'px';
  box.style.top = Math.round(cv.clientHeight * 0.72) + 'px';
  sigClamp();
}

/* ГРАНИЦЫ ДЕРЖИТ СТРАНИЦА, А ВОРКЕР ИХ ПРОВЕРЯЕТ. Два забора, и это не дублирование:
   здесь человек не может перетащить подпись за лист, там - никто не может прислать такое
   в обход страницы (закон №32). */
function sigClamp() {
  const cv = $('sigPageCv'), box = $('sigBox');
  const W = cv.clientWidth, H = cv.clientHeight;
  let w = box.offsetWidth, h = box.offsetHeight;
  w = Math.max(24, Math.min(w, W)); h = Math.max(12, Math.min(h, H));
  let l = Math.max(0, Math.min(box.offsetLeft, W - w));
  let t = Math.max(0, Math.min(box.offsetTop, H - h));
  box.style.width = w + 'px'; box.style.height = h + 'px';
  box.style.left = l + 'px'; box.style.top = t + 'px';
}

function sigWireBox() {
  const box = $('sigBox'), grip = $('sigGrip'), cv = $('sigPageCv');
  let mode = '', sx = 0, sy = 0, sl = 0, st = 0, sw = 0, sh = 0;
  const start = (e, m) => {
    e.preventDefault(); e.stopPropagation();
    mode = m; sx = e.clientX; sy = e.clientY;
    sl = box.offsetLeft; st = box.offsetTop; sw = box.offsetWidth; sh = box.offsetHeight;
    try { (m === 'size' ? grip : box).setPointerCapture(e.pointerId); } catch (z) {}
  };
  box.addEventListener('pointerdown', (e) => { if (e.target !== grip) start(e, 'move'); });
  grip.addEventListener('pointerdown', (e) => start(e, 'size'));
  const move = (e) => {
    if (!mode) return;
    e.preventDefault();
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (mode === 'move') {
      box.style.left = (sl + dx) + 'px';
      box.style.top = (st + dy) + 'px';
    } else {
      /* ПРОПОРЦИЮ ДЕРЖИМ: растянутая подпись - это чужой почерк, а не размер. */
      const k = Math.max(24, sw + dx) / sw;
      box.style.width = (sw * k) + 'px';
      box.style.height = (sh * k) + 'px';
    }
    sigClamp();
  };
  box.addEventListener('pointermove', move);
  grip.addEventListener('pointermove', move);
  const stop = () => { mode = ''; };
  box.addEventListener('pointerup', stop); box.addEventListener('pointercancel', stop);
  grip.addEventListener('pointerup', stop); grip.addEventListener('pointercancel', stop);
  cv.addEventListener('pointerdown', (e) => e.preventDefault());
}

/* ── поставить ─────────────────────────────────────────────────────────────────── */
async function sigApply() {
  const off = whyOff();
  if (off) { sigSay(off); return; }
  const cv = $('sigPageCv'), box = $('sigBox');
  const nx = box.offsetLeft / cv.clientWidth;
  const ny = box.offsetTop / cv.clientHeight;
  const nw = box.offsetWidth / cv.clientWidth;
  const nh = box.offsetHeight / cv.clientHeight;
  sigSay(T.working);
  try {
    const blob = await (await fetch(SIG_PNG)).blob();
    const r = await fetch(u('/pdf/sig'), { method: 'POST', body: blob });
    const j = await r.json().catch(() => null);
    if (!r.ok || !j || !j.ok) {
      sigSay((j && (j.human || j.error)) || ('HTTP ' + r.status));
      return;
    }
  } catch (e) {
    sigSay(String(e && e.message || e));
    return;
  }
  const ok = await apply({ op: 'sign', pages: String(SIG_PAGE + 1),
                           nx: nx.toFixed(4), ny: ny.toFixed(4),
                           nw: nw.toFixed(4), nh: nh.toFixed(4) });
  if (!ok) { sigSay($('say').textContent || T.working); return; }
  sigClose();
  say(T.signPlaced, 'ok');
}

/* ═══════════════════════════════════════════════════════════════════════════════
   СКРЫТИЕ ДАННЫХ: ОБВЕСТИ ОБЛАСТИ, УВИДЕТЬ СПИСОК, ПРИМЕНИТЬ
   ═══════════════════════════════════════════════════════════════════════════════
   ОБЛАСТЕЙ БОЛЬШЕ ОДНОЙ, И ОНИ НАКАПЛИВАЮТСЯ ДО ПРИМЕНЕНИЯ. Скрытие необратимо, поэтому
   человек должен видеть ВЕСЬ список и обведённое на листе ДО того, как нажмёт: «применилось
   не то» здесь дороже, чем лишний тап. */
let RDT = { areas: [], page: 0 };

const rdtSay = (t, cls) => {
  const e = $('rdtSay');
  e.textContent = t || '';
  e.style.color = cls === 'bad' ? 'var(--bad)' : 'var(--dim)';
};

function rdtClose() {
  $('rdt').classList.remove('on');
  $('rdtBar').hidden = true;
}

async function rdtOpen() {
  if (!DOC) return;
  const off = whyOff();
  if (off) { say(off, 'bad'); return; }
  RDT = { areas: [], page: 0 };
  const sel = PAGES.map((p, i) => p.sel ? i : -1).filter((i) => i >= 0);
  RDT.page = sel.length ? sel[0] : 0;
  $('rdtTtl').textContent = T.rdtTtl;
  /* ПРЕДУПРЕЖДЕНИЕ - ПЕРВОЙ СТРОКОЙ И ДО ОБВОДКИ, как дисклеймер подписи: сказанное
     после применения читается как оправдание задним числом. */
  $('rdtWarn').textContent = T.rdtWarn;
  $('bRdtCancel').textContent = T.rdtCancel;
  $('bRdtAdd').textContent = T.rdtAdd;
  $('bRdtGo').textContent = T.rdtGo;
  $('rdt').classList.add('on');
  $('rdtBar').hidden = false;
  rdtSay('');
  rdtPaintList();
  await rdtPaintPage();
}

async function rdtPaintPage() {
  const p = PAGES[RDT.page];
  const cv = $('rdtPageCv');
  const page = await DOC.getPage(p.src);
  /* ПОВОРОТ УЧТЁН ТАК ЖЕ, КАК У ПОДПИСИ И ПОЛЕЙ: человек обводит то, что ВИДИТ, доли
     считаются от видимого кадра, а воркер переводит их в систему страницы сам. */
  const v0 = page.getViewport({ scale: 1, rotation: (page.rotate + p.rot) % 360 });
  const wide = Math.min(520, (window.innerWidth || 360) - 56);
  const sc = wide / v0.width;
  const v = page.getViewport({ scale: sc, rotation: (page.rotate + p.rot) % 360 });
  cv.width = Math.ceil(v.width); cv.height = Math.ceil(v.height);
  cv.style.width = Math.ceil(v.width) + 'px';
  await page.render({ canvasContext: cv.getContext('2d'), viewport: v }).promise;
  $('rdtPage').textContent = T.rdtPage(RDT.page + 1, PAGES.length);
  const box = $('rdtBox');
  box.style.width = Math.round(cv.clientWidth * 0.4) + 'px';
  box.style.height = Math.round(cv.clientHeight * 0.05) + 'px';
  box.style.left = Math.round(cv.clientWidth * 0.1) + 'px';
  box.style.top = Math.round(cv.clientHeight * 0.1) + 'px';
  rdtWireBox();
  rdtPaintDone();
}

/* УЖЕ ОБВЕДЁННОЕ РИСУЕМ НА ЛИСТЕ: список числами человек не сверит глазами с документом,
   а обводил он глазами. */
function rdtPaintDone() {
  const wrap = $('rdtWrap'), cv = $('rdtPageCv');
  for (const el of [...wrap.querySelectorAll('.rdtDone')]) el.remove();
  for (const a of RDT.areas) {
    if (a.page !== PAGES[RDT.page].src) continue;
    const d = document.createElement('div');
    d.className = 'rdtDone';
    d.style.left = (a.nx * cv.clientWidth) + 'px';
    d.style.top = (a.ny * cv.clientHeight) + 'px';
    d.style.width = (a.nw * cv.clientWidth) + 'px';
    d.style.height = (a.nh * cv.clientHeight) + 'px';
    wrap.appendChild(d);
  }
}

function rdtPaintList() {
  const box = $('rdtList');
  box.innerHTML = '';
  if (!RDT.areas.length) return;
  const head = document.createElement('div');
  head.textContent = T.rdtList(RDT.areas.length);
  box.appendChild(head);
}

function rdtWireBox() {
  const cv = $('rdtPageCv'), box = $('rdtBox'), grip = $('rdtGrip');
  if (box.dataset.wired) return;
  box.dataset.wired = '1';
  let mode = '', sx = 0, sy = 0, bx = 0, by = 0, bw = 0, bh = 0;
  const clamp = () => {
    const W = cv.clientWidth, H = cv.clientHeight;
    const w = Math.max(14, Math.min(box.offsetWidth, W));
    const h = Math.max(8, Math.min(box.offsetHeight, H));
    box.style.width = w + 'px'; box.style.height = h + 'px';
    box.style.left = Math.max(0, Math.min(box.offsetLeft, W - w)) + 'px';
    box.style.top = Math.max(0, Math.min(box.offsetTop, H - h)) + 'px';
  };
  const down = (e, m) => {
    mode = m; sx = e.clientX; sy = e.clientY;
    bx = box.offsetLeft; by = box.offsetTop; bw = box.offsetWidth; bh = box.offsetHeight;
    if (e.target.setPointerCapture) e.target.setPointerCapture(e.pointerId);
    e.preventDefault(); e.stopPropagation();
  };
  const move = (e) => {
    if (!mode) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (mode === 'move') {
      box.style.left = (bx + dx) + 'px'; box.style.top = (by + dy) + 'px';
    } else {
      box.style.width = (bw + dx) + 'px'; box.style.height = (bh + dy) + 'px';
    }
    clamp();
    e.preventDefault();
  };
  const up = () => { mode = ''; };
  box.onpointerdown = (e) => { if (e.target !== grip) down(e, 'move'); };
  grip.onpointerdown = (e) => down(e, 'size');
  box.onpointermove = grip.onpointermove = move;
  box.onpointerup = grip.onpointerup = up;
  box.onpointercancel = grip.onpointercancel = up;
}

function rdtAdd() {
  const cv = $('rdtPageCv'), box = $('rdtBox');
  if (!cv.clientWidth) return;
  RDT.areas.push({
    page: PAGES[RDT.page].src,
    nx: +(box.offsetLeft / cv.clientWidth).toFixed(4),
    ny: +(box.offsetTop / cv.clientHeight).toFixed(4),
    nw: +(box.offsetWidth / cv.clientWidth).toFixed(4),
    nh: +(box.offsetHeight / cv.clientHeight).toFixed(4),
  });
  rdtPaintList();
  rdtPaintDone();
  rdtSay(T.rdtList(RDT.areas.length));
}

async function rdtGo() {
  const off = whyOff();
  if (off) { rdtSay(off, 'bad'); return; }
  if (!RDT.areas.length) { rdtSay(T.rdtNone, 'bad'); return; }
  rdtSay(T.working);
  const n = RDT.areas.length;
  const ok = await apply({ op: 'redact', areas: JSON.stringify(RDT.areas) });
  if (!ok) { rdtSay($('say').textContent || T.working, 'bad'); return; }
  rdtClose();
  /* ПРО ВТОРУЮ ВСТАВКУ КАРТИНКИ ГОВОРИМ ЗДЕСЬ ЖЕ: воркер её называет, и терять это
     предупреждение по дороге нельзя - человек думает, что убрал лицо, а оно видно рядом. */
  const shared = (LAST_RES && LAST_RES.shared_images || []).length;
  say(T.rdtDone(n) + (shared ? ' ' + T.rdtShared : ''), 'ok');
}

/* ═══════════════════════════════════════════════════════════════════════════════
   СРАВНЕНИЕ ВЕРСИЙ: ЛИСТ ВТОРОЙ ВЕРСИИ С ПОДСВЕТКОЙ, УДАЛЁННОЕ - СПИСКОМ
   ═══════════════════════════════════════════════════════════════════════════════
   ЛИСТ РИСУЕТСЯ ИЗ ФАЙЛА В БРАУЗЕРЕ, А НЕ КАЧАЕТСЯ С СЕРВЕРА: вторую версию человек
   ТОЛЬКО ЧТО выбрал у себя, она уже в памяти вкладки. Скачивать её обратно значило бы
   гонять мегабайты по кругу ради картинки, которую можно нарисовать сразу.
   СВОДКА СОБИРАЕТСЯ ИЗ ЧИСЕЛ ВОРКЕРА, А НЕ ПЕРЕСКАЗЫВАЕТСЯ МОДЕЛЬЮ: пересказ правок в
   договоре - это ровно то место, где выдумка стоит дороже всего, а числа и фрагменты
   человек сверит сам. Модели здесь нет вообще. */
let CMP = { file: null, doc: null, res: null, page: 0, mode: 'words', sent: false };

const cmpSay = (t, cls) => {
  const e = $('cmpSay');
  e.textContent = t || '';
  e.style.color = cls === 'bad' ? 'var(--bad)' : 'var(--dim)';
};

function cmpClose() {
  $('cmp').classList.remove('on');
  $('cmpBar').hidden = true;
}

async function cmpOpen() {
  if (!DOC) return;
  const off = whyOff();
  if (off) { say(off, 'bad'); return; }
  CMP = { file: null, doc: null, res: null, page: 0, mode: 'words', sent: false };
  $('cmpTtl').textContent = T.cmpTtl;
  $('cmpWhat').textContent = T.cmpWhat;
  $('bCmpPick').textContent = T.cmpPick;
  $('bCmpCancel').textContent = T.cmpCancel;
  $('bCmpGo').textContent = T.cmpGo;
  $('bCmpPrev').textContent = '‹';
  $('bCmpNext').textContent = '›';
  $('cmpWhich').textContent = T.cmpNoFile;
  for (const id of ['cmpSum', 'cmpNav', 'cmpWrap', 'cmpLeg']) $(id).hidden = true;
  for (const id of ['cmpList', 'cmpGone', 'cmpMoved']) $(id).innerHTML = '';
  cmpMode(false);
  $('cmp').classList.add('on');
  $('cmpBar').hidden = false;
  cmpSay('');
}

/* ПЕРЕКЛЮЧАТЕЛЬ НАЗЫВАЕТ ТЕКУЩИЙ РЕЖИМ, А НЕ ТОТ, В КОТОРЫЙ ПЕРЕЙДЁТ: подпись «по
   пикселям» на кнопке в режиме слов читается и так, и так, а ошибка здесь означает, что
   человек получил не ту мерку и не понял этого. Обратный путь у переключателя проверен
   (закон №55): второе нажатие возвращает слова. */
function cmpMode(flip) {
  if (flip) CMP.mode = (CMP.mode === 'words') ? 'pixels' : 'words';
  $('bCmpMode').textContent = (CMP.mode === 'words') ? T.cmpModeWords : T.cmpModePixels;
  if (flip) {
    CMP.res = null;
    for (const id of ['cmpSum', 'cmpNav', 'cmpWrap', 'cmpLeg']) $(id).hidden = true;
    for (const id of ['cmpList', 'cmpGone', 'cmpMoved']) $(id).innerHTML = '';
    cmpSay(T.cmpModeSay);
  }
}

async function cmpPick(f) {
  if (!f) return;
  CMP.file = f;
  CMP.res = null;
  CMP.sent = false;
  $('cmpWhich').textContent = T.cmpWhich(f.name || '?');
  cmpSay(T.working);
  try {
    const buf = await f.arrayBuffer();
    /* ЛИСТ ВТОРОЙ ВЕРСИИ ГОТОВИМ СРАЗУ: если файл не открывается, человек узнает это
       ЗДЕСЬ, а не после ожидания сравнения на сервере. */
    if (!pdfjs) { cmpSay(T.cmpNoPdfjs, 'bad'); return; }
    CMP.doc = await pdfjs.getDocument({ data: new Uint8Array(buf.slice(0)) }).promise;
    const r = await fetch(u('/pdf/second'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/pdf', 'X-Pdf-Name': encodeURIComponent(f.name || 'cmp.pdf') },
      body: buf,
    });
    const j = await r.json().catch(() => null);
    if (!r.ok || !j || !j.ok) {
      CMP.file = null; CMP.doc = null;
      cmpSay((j && (j.human || j.error)) || ('HTTP ' + r.status), 'bad');
      $('cmpWhich').textContent = T.cmpNoFile;
      return;
    }
    CMP.sent = true;
    cmpSay(T.cmpReady(j.pages || CMP.doc.numPages));
  } catch (e) {
    CMP.file = null; CMP.doc = null;
    $('cmpWhich').textContent = T.cmpNoFile;
    cmpSay(T.cmpBadFile + ' ' + String(e && e.message || e), 'bad');
  }
}

async function cmpGo() {
  const off = whyOff();
  if (off) { cmpSay(off, 'bad'); return; }
  if (!CMP.sent) { cmpSay(T.cmpNeedFile, 'bad'); return; }
  cmpSay(T.working);
  const ok = await apply({ op: 'compare', mode: CMP.mode });
  if (!ok) {
    const why = $('say').textContent || '';
    /* ОТКАЗ «НЕТ ТЕКСТОВОГО СЛОЯ» - ЭТО ПРЕДЛОЖЕНИЕ, А НЕ ТУПИК: распознавание у нас
       есть, и спросить человека надо здесь, назвав цену (числа станут приблизительными).
       Решает он, а не мы: молча пустить скан через tesseract значило бы выдать
       приблизительные числа за точные (закон №32 - гейт у действия). */
    if (/текстов/i.test(why) || /text layer/i.test(why)) {
      cmpSay(why, 'bad');
      const yes = await askYesNo(T.cmpOcrAsk);
      if (!yes) return;
      cmpSay(T.working);
      if (!(await apply({ op: 'compare', mode: CMP.mode, ocr: '1' }))) {
        cmpSay($('say').textContent || T.cmpFail, 'bad');
        return;
      }
    } else {
      cmpSay(why || T.cmpFail, 'bad');
      return;
    }
  }
  CMP.res = LAST_RES || null;
  if (!CMP.res) { cmpSay(T.cmpFail, 'bad'); return; }
  CMP.page = 0;
  await cmpPaint();
}

async function cmpPaint() {
  const r = CMP.res;
  if (!r) return;
  if (r.mode === 'pixels') return cmpPaintPixels(r);
  const s = r.summary || {};
  $('cmpSum').hidden = false;
  $('cmpSum').className = (s.places ? '' : 'plain');
  $('cmpSum').textContent = T.cmpSum(s, r);
  /* ПЕРВОЙ ПОКАЗЫВАЕМ СТРАНИЦУ С ПРАВКОЙ, А НЕ ПЕРВУЮ СТРАНИЦУ ДОКУМЕНТА: человек открыл
     сравнение, чтобы увидеть различия, и титульный лист без подсветки читается как
     «ничего не нашлось». */
  CMP.page = (s.pages && s.pages.length) ? (s.pages[0] - 1) : 0;
  $('cmpLeg').hidden = false;
  $('cmpLeg').innerHTML = '';
  for (const [cls, txt] of [['ins', T.cmpLegIns], ['rep', T.cmpLegRep], ['mv', T.cmpLegMv]]) {
    const d = document.createElement('span');
    const i = document.createElement('i');
    i.className = 'cmpHit ' + cls;
    i.style.position = 'static';
    d.appendChild(i);
    d.appendChild(document.createTextNode(txt));
    $('cmpLeg').appendChild(d);
  }
  cmpPaintLists(r);
  await cmpPaintPage();
}

async function cmpPaintPage() {
  const r = CMP.res;
  if (!r || !CMP.doc) return;
  const total = CMP.doc.numPages;
  CMP.page = Math.max(0, Math.min(CMP.page, total - 1));
  const cv = $('cmpPageCv');
  const page = await CMP.doc.getPage(CMP.page + 1);
  /* ПОВОРОТ БЕРЁТСЯ ИЗ САМОГО ФАЙЛА, А НЕ ИЗ СЕТКИ: сетка про ПЕРВЫЙ документ, а рисуем
     мы ВТОРОЙ, и его страницы человек не крутил. Доли от воркера считаны от видимого
     кадра (pdfplumber отдаёт их уже с учётом `/Rotate`), значит и кадр здесь - видимый. */
  const v0 = page.getViewport({ scale: 1, rotation: page.rotate % 360 });
  const wide = Math.min(520, (window.innerWidth || 360) - 56);
  const v = page.getViewport({ scale: wide / v0.width, rotation: page.rotate % 360 });
  cv.width = Math.ceil(v.width); cv.height = Math.ceil(v.height);
  cv.style.width = Math.ceil(v.width) + 'px';
  $('cmpWrap').hidden = false;
  $('cmpNav').hidden = false;
  await page.render({ canvasContext: cv.getContext('2d'), viewport: v }).promise;
  $('cmpPage').textContent = T.cmpPage(CMP.page + 1, total);
  const wrap = $('cmpWrap');
  for (const el of [...wrap.querySelectorAll('.cmpHit')]) el.remove();
  const W = cv.clientWidth || cv.width, H = cv.clientHeight || cv.height;
  for (const e of (r.edits || [])) {
    for (const b of (e.boxes || [])) {
      if (b.p !== CMP.page + 1) continue;
      const d = document.createElement('div');
      d.className = 'cmpHit ' + (e.stayed ? 'mv' : (e.kind === 'insert' ? 'ins' : 'rep'));
      d.style.left = (b.nx * W) + 'px';
      d.style.top = (b.ny * H) + 'px';
      d.style.width = Math.max(2, b.nw * W) + 'px';
      d.style.height = Math.max(2, b.nh * H) + 'px';
      wrap.appendChild(d);
    }
  }
}

function cmpPaintLists(r) {
  const box = $('cmpList');
  box.innerHTML = '';
  const head = (el, t) => {
    const h = document.createElement('div');
    h.innerHTML = '<b></b>';
    h.querySelector('b').textContent = t;
    el.appendChild(h);
  };
  if ((r.edits || []).length) {
    head(box, T.cmpEditsTtl((r.edits || []).length));
    for (const e of r.edits) {
      const d = document.createElement('div');
      d.textContent = T.cmpPageNo(e.page) + ' ';
      if (e.kind === 'replace' && e.was) {
        const a = document.createElement('span');
        a.className = 'cmpWas'; a.textContent = e.was;
        d.appendChild(a);
        d.appendChild(document.createTextNode(' → '));
      }
      const b = document.createElement('span');
      b.className = 'cmpNow'; b.textContent = e.now;
      d.appendChild(b);
      if (e.stayed) d.appendChild(document.createTextNode(' ' + T.cmpStayed(e.from_page)));
      /* ПО ПРАВКЕ МОЖНО ПЕРЕЙТИ НА ЕЁ СТРАНИЦУ: список и лист - одно и то же, и искать
         страницу руками после того, как мы её УЖЕ знаем, человеку незачем. */
      d.style.cursor = 'pointer';
      d.onclick = () => { CMP.page = (e.page || 1) - 1; cmpPaintPage(); };
      box.appendChild(d);
    }
  }
  if (r.human_cut) {
    const d = document.createElement('div');
    d.style.color = 'var(--warn)';
    d.textContent = r.human_cut;
    box.appendChild(d);
  }
  const gone = $('cmpGone');
  gone.innerHTML = '';
  if ((r.deleted || []).length) {
    head(gone, T.cmpGoneTtl(r.deleted.length));
    for (const x of r.deleted) {
      const d = document.createElement('div');
      const a = document.createElement('span');
      a.className = 'cmpWas'; a.textContent = x.was;
      d.appendChild(document.createTextNode(T.cmpPageNo(x.page) + ' '));
      d.appendChild(a);
      d.appendChild(document.createTextNode(
        ' ' + (x.moved_to ? T.cmpGoneMoved(x.moved_to) : T.cmpGoneWhere(x.after, x.before))));
      gone.appendChild(d);
    }
  }
  const mv = $('cmpMoved');
  mv.innerHTML = '';
  if ((r.moved || []).length) {
    head(mv, T.cmpMovedTtl(r.moved.length));
    for (const x of r.moved) {
      const d = document.createElement('div');
      d.textContent = T.cmpMovedOne(x);
      mv.appendChild(d);
    }
  }
  if (r.note) {
    const d = document.createElement('div');
    d.style.color = 'var(--warn)';
    d.textContent = r.note;
    mv.appendChild(d);
  }
}

/* ПИКСЕЛЬНЫЙ РЕЖИМ ОТВЕЧАЕТ ЧИСЛАМИ ПО СТРАНИЦАМ И НАЗЫВАЕТ СВОЮ СЛАБОСТЬ ТУТ ЖЕ:
   перевёрстку он видит как сплошное различие, и не скажи мы этого - человек прочитал бы
   «изменились все страницы» про документ, где поправлено одно слово. */
function cmpPaintPixels(r) {
  $('cmpSum').hidden = false;
  $('cmpSum').className = '';
  $('cmpSum').textContent = T.cmpPxSum(r);
  $('cmpLeg').hidden = true;
  $('cmpWrap').hidden = true;
  $('cmpNav').hidden = true;
  const box = $('cmpList');
  box.innerHTML = '';
  for (const p of (r.pages || [])) {
    const d = document.createElement('div');
    d.textContent = T.cmpPxRow(p);
    if (p.changed) d.style.color = 'var(--warn)';
    box.appendChild(d);
  }
  for (const o of (r.only_in_one || [])) {
    const d = document.createElement('div');
    d.style.color = 'var(--warn)';
    d.textContent = T.cmpPxOnly(o);
    box.appendChild(d);
  }
  $('cmpGone').innerHTML = '';
  const mv = $('cmpMoved');
  mv.innerHTML = '';
  const d = document.createElement('div');
  d.style.color = 'var(--dim)';
  d.textContent = r.note || '';
  mv.appendChild(d);
}

/* ═══════════════════════════════════════════════════════════════════════════════
   ФОРМЫ: ПОКАЗАТЬ ПОЛЯ, ЗАПОЛНИТЬ ИХ, А ЕСЛИ ИХ НЕТ - СОЗДАТЬ
   ═══════════════════════════════════════════════════════════════════════════════ */
let FRM = { fields: [], xfa: 'no', make: [], page: 0 };

const frmSay = (t, cls) => {
  const e = $('frmSay');
  e.textContent = t || '';
  e.style.color = cls === 'bad' ? 'var(--bad)' : 'var(--dim)';
};

function frmClose() {
  $('frm').classList.remove('on');
  $('frmBar').hidden = true;
}

async function frmOpen() {
  if (!DOC) return;
  const off = whyOff();
  if (off) { say(off, 'bad'); return; }
  FRM = { fields: [], xfa: 'no', make: [], page: 0 };
  $('frmTtl').textContent = T.frmTtl;
  $('bFrmCancel').textContent = T.frmCancel;
  $('bFrmAdd').textContent = T.frmAdd;
  $('bFrmGo').textContent = T.frmApply;
  $('frmNmLbl').textContent = T.frmNmLbl;
  $('frmKindLbl').textContent = T.frmKindLbl;
  $('frmOptsLbl').textContent = T.frmOptsLbl;
  const kd = $('frmKind');
  kd.innerHTML = '';
  for (const k of ['text', 'check', 'choice']) {
    const o = document.createElement('option');
    o.value = k; o.textContent = T.frmKinds[k];
    kd.appendChild(o);
  }
  kd.onchange = () => { $('frmOptsBox').hidden = kd.value !== 'choice'; };
  $('frmOptsBox').hidden = true;
  $('frmMake').hidden = true;
  $('frmList').innerHTML = '';
  $('frmMade').textContent = '';
  $('frm').classList.add('on');
  $('frmBar').hidden = false;
  frmSay(T.frmLoading);
  /* ═══ СПРАШИВАЕМ ВОРКЕР, А НЕ pdf.js ═══
     У pdf.js есть свой разбор аннотаций, и соблазн прочитать поля ЗДЕСЬ большой. Нельзя:
     заполнять их будет ВОРКЕР, и его представление о том, как зовётся поле и что в нём
     допустимо, - единственное, которое имеет значение. Прочитай мы своим разбором -
     человек увидел бы поля, которых воркер не знает, и отказ «нет такого поля» на
     собственном же списке (закон №40). */
  const r = await fetch(u('/pdf/op'), {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ op: 'form_read' }),
  });
  const j = await r.json().catch(() => null);
  if (!r.ok || !j || !j.ok) {
    /* ОТКАЗ ВОРКЕРА ПОКАЗЫВАЕМ ЕГО СЛОВАМИ: именно здесь приезжает объяснение про XFA, и
       переписать его своими словами значило бы потерять «чем открыть». */
    frmSay((j && (j.human || j.error)) || ('HTTP ' + r.status), 'bad');
    return;
  }
  const res = j.res || {};
  FRM.fields = res.fields || [];
  FRM.xfa = res.xfa || 'no';
  frmPaintList();
}

function frmPaintList() {
  const box = $('frmList');
  box.innerHTML = '';
  if (!FRM.fields.length) {
    frmSay(FRM.make.length ? T.frmMade(FRM.make.length) : T.frmNone);
  } else {
    frmSay(FRM.xfa === 'hybrid' ? T.frmHybrid : T.frmFound(FRM.fields.length));
  }
  for (const f of FRM.fields) {
    const d = document.createElement('div');
    d.className = 'fld' + (f.readonly ? ' ro' : '');
    const lbl = document.createElement('div');
    lbl.className = 'lbl';
    const b = document.createElement('b');
    b.textContent = f.name;
    lbl.appendChild(b);
    const tags = [];
    if (f.required) tags.push(T.frmReq);
    if (f.readonly) tags.push(T.frmRo);
    if (tags.length) lbl.appendChild(document.createTextNode(' · ' + tags.join(' · ')));
    d.appendChild(lbl);
    /* ВИД ВВОДА - ПО ВИДУ ПОЛЯ, И ЗНАЧЕНИЯ БЕРУТСЯ ИЗ ЕГО НАБОРА, А НЕ ПРИДУМЫВАЮТСЯ.
       Свободный ввод у флажка означал бы «/Maybe» в документе: воркер такое отвергнет, и
       человек получит отказ за то, что мы дали ему печатать. */
    if (f.kind === 'button' && f.states && f.states.length) {
      const on = f.states.map((s) => String(s[0])).find((v) => v !== '/Off');
      const w = document.createElement('label');
      w.className = 'chk';
      const i = document.createElement('input');
      i.type = 'checkbox';
      i.dataset.name = f.name;
      i.dataset.on = on || '/Yes';
      i.checked = String(f.value || '') === String(on);
      i.disabled = !!f.readonly;
      w.appendChild(i);
      w.appendChild(document.createTextNode(' ' + (on || '/Yes')));
      d.appendChild(w);
    } else if (f.kind === 'choice' && f.states && f.states.length) {
      const sel = document.createElement('select');
      sel.dataset.name = f.name;
      sel.disabled = !!f.readonly;
      for (const pair of f.states) {
        const o = document.createElement('option');
        o.value = String(pair[0]);
        o.textContent = String(pair[1] || pair[0]);
        if (String(f.value || '') === o.value) o.selected = true;
        sel.appendChild(o);
      }
      d.appendChild(sel);
    } else {
      const i = document.createElement('input');
      i.type = 'text';
      i.dataset.name = f.name;
      i.value = f.value == null ? '' : String(f.value);
      i.disabled = !!f.readonly;
      d.appendChild(i);
    }
    box.appendChild(d);
  }
}

/* ── СОЗДАНИЕ ПОЛЯ: ОБВЕСТИ МЕСТО НА СТРАНИЦЕ ───────────────────────────────────── */
async function frmAddMode() {
  if (!DOC) return;
  $('frmMake').hidden = false;
  const sel = PAGES.map((p, i) => p.sel ? i : -1).filter((i) => i >= 0);
  FRM.page = sel.length ? sel[0] : 0;
  await frmPaintPage();
  frmSay(FRM.make.length ? T.frmMade(FRM.make.length) : '');
}

async function frmPaintPage() {
  const p = PAGES[FRM.page];
  const cv = $('frmPageCv');
  const page = await DOC.getPage(p.src);
  /* ПОВОРОТ УЧТЁН ТАК ЖЕ, КАК У ПОДПИСИ: человек обводит то, что ВИДИТ, а доли считаются
     от видимого кадра - воркер переводит их в систему страницы сам. */
  const v0 = page.getViewport({ scale: 1, rotation: (page.rotate + p.rot) % 360 });
  const wide = Math.min(520, (window.innerWidth || 360) - 56);
  const sc = wide / v0.width;
  const v = page.getViewport({ scale: sc, rotation: (page.rotate + p.rot) % 360 });
  cv.width = Math.ceil(v.width); cv.height = Math.ceil(v.height);
  cv.style.width = Math.ceil(v.width) + 'px';
  await page.render({ canvasContext: cv.getContext('2d'), viewport: v }).promise;
  $('frmPage').textContent = T.frmPage(FRM.page + 1, PAGES.length);
  const box = $('frmBox');
  box.style.width = Math.round(cv.clientWidth * 0.5) + 'px';
  box.style.height = Math.round(cv.clientHeight * 0.045) + 'px';
  box.style.left = Math.round(cv.clientWidth * 0.1) + 'px';
  box.style.top = Math.round(cv.clientHeight * 0.1) + 'px';
  frmWireBox();
}

function frmWireBox() {
  const cv = $('frmPageCv'), box = $('frmBox'), grip = $('frmGrip');
  if (box.dataset.wired) return;
  box.dataset.wired = '1';
  let mode = '', sx = 0, sy = 0, bx = 0, by = 0, bw = 0, bh = 0;
  const clamp = () => {
    const W = cv.clientWidth, H = cv.clientHeight;
    let w = Math.max(18, Math.min(box.offsetWidth, W));
    let h = Math.max(10, Math.min(box.offsetHeight, H));
    box.style.width = w + 'px'; box.style.height = h + 'px';
    box.style.left = Math.max(0, Math.min(box.offsetLeft, W - w)) + 'px';
    box.style.top = Math.max(0, Math.min(box.offsetTop, H - h)) + 'px';
  };
  const down = (e, m) => {
    mode = m; sx = e.clientX; sy = e.clientY;
    bx = box.offsetLeft; by = box.offsetTop; bw = box.offsetWidth; bh = box.offsetHeight;
    e.target.setPointerCapture && e.target.setPointerCapture(e.pointerId);
    e.preventDefault(); e.stopPropagation();
  };
  const move = (e) => {
    if (!mode) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (mode === 'move') {
      box.style.left = (bx + dx) + 'px'; box.style.top = (by + dy) + 'px';
    } else {
      box.style.width = (bw + dx) + 'px'; box.style.height = (bh + dy) + 'px';
    }
    clamp();
    e.preventDefault();
  };
  const up = () => { mode = ''; };
  box.onpointerdown = (e) => { if (e.target !== grip) down(e, 'move'); };
  grip.onpointerdown = (e) => down(e, 'size');
  box.onpointermove = grip.onpointermove = move;
  box.onpointerup = grip.onpointerup = up;
  box.onpointercancel = grip.onpointercancel = up;
}

function frmAddCommit() {
  const nm = ($('frmNm').value || '').trim();
  const kind = $('frmKind').value;
  if (!nm) { frmSay(T.frmNeedName, 'bad'); return false; }
  /* ИМЯ ПОЛЯ - ЛАТИНИЦА БЕЗ ПРОБЕЛОВ, И ЭТО НЕ ПРИДИРКА. Оно уезжает ключом JSON и
     ложится в `/T` документа; кириллица и пробелы в нём живут плохо в чужих читалках, а
     заметит это человек у получателя. Говорим правило СРАЗУ, а не отказом после. */
  if (!/^[A-Za-z0-9_]+$/.test(nm)) { frmSay(T.frmBadName, 'bad'); return false; }
  let opts = [];
  if (kind === 'choice') {
    opts = ($('frmOpts').value || '').split(',').map((x) => x.trim()).filter(Boolean);
    if (opts.length < 2) { frmSay(T.frmNeedOpts, 'bad'); return false; }
  }
  const cv = $('frmPageCv'), box = $('frmBox');
  const it = {
    name: nm, kind: kind, page: PAGES[FRM.page].src,
    nx: +(box.offsetLeft / cv.clientWidth).toFixed(4),
    ny: +(box.offsetTop / cv.clientHeight).toFixed(4),
    nw: +(box.offsetWidth / cv.clientWidth).toFixed(4),
    nh: +(box.offsetHeight / cv.clientHeight).toFixed(4),
  };
  if (opts.length) it.options = opts;
  FRM.make.push(it);
  $('frmNm').value = '';
  $('frmMade').textContent = T.frmMade(FRM.make.length);
  frmSay(T.frmMade(FRM.make.length));
  return true;
}

async function frmGo() {
  const off = whyOff();
  if (off) { frmSay(off, 'bad'); return; }
  /* ═══ СОЗДАНИЕ И ЗАПОЛНЕНИЕ - ДВА РАЗНЫХ ДЕЛА, И ПОРЯДОК ВАЖЕН ═══
     Есть незакреплённые новые поля - сперва создаём их и ПЕРЕЧИТЫВАЕМ форму: заполнять
     можно только то, что воркер уже видит. Слепи мы оба шага в один запрос - отказ на
     половине оставил бы человека в неведении, какая половина прошла. */
  if ($('frmMake').hidden === false && ($('frmNm').value || '').trim()) {
    if (!frmAddCommit()) return;
  }
  if (FRM.make.length) {
    frmSay(T.working);
    const ok = await apply({ op: 'form_make', spec: JSON.stringify(FRM.make) });
    if (!ok) { frmSay($('say').textContent || T.working, 'bad'); return; }
    const n = FRM.make.length;
    FRM.make = [];
    $('frmMade').textContent = '';
    $('frmMake').hidden = true;
    await frmOpen();
    say(T.frmMadeDone(n), 'ok');
    return;
  }
  const vals = {};
  for (const el of $('frmList').querySelectorAll('[data-name]')) {
    if (el.disabled) continue;
    const nm = el.dataset.name;
    if (el.type === 'checkbox') {
      vals[nm] = el.checked ? el.dataset.on : '/Off';
    } else {
      vals[nm] = el.value;
    }
  }
  if (!Object.keys(vals).length) { frmSay(T.frmNothing, 'bad'); return; }
  frmSay(T.working);
  const ok = await apply({ op: 'form_fill', fields: JSON.stringify(vals) });
  if (!ok) { frmSay($('say').textContent || T.working, 'bad'); return; }
  const cyr = Object.values(vals).some((v) => /[^\u0000-\u00ff]/.test(String(v)));
  frmClose();
  /* НЕЛАТИНИЦУ НАЗЫВАЕМ ЧЕЛОВЕКУ, А НЕ ПРЯЧЕМ В ОТВЕТЕ ВОРКЕРА: читалка перерисует поля
     сама, но в части просмотрщиков поле выглядит пустым, и об этом он должен узнать от
     нас, а не от получателя документа. */
  say(T.frmDone(Object.keys(vals).length) + (cyr ? ' ' + T.frmCyr : ''), 'ok');
}

async function sigKeep() {
  if (!INIT) { sigSay(T.noSign); return; }
  const dflt = (SIG_PICK >= 0 && SIG_LIST[SIG_PICK]) ? SIG_LIST[SIG_PICK].name : '';
  const nm = await askText(T.signAskName, dflt);
  if (nm === null) return;
  sigSay(T.working);
  try {
    const blob = await (await fetch(SIG_PNG)).blob();
    const r = await fetch(u('/pdf/sig'), { method: 'POST', body: blob });
    const j = await r.json().catch(() => null);
    if (!r.ok || !j || !j.ok) {
      sigSay((j && (j.human || j.error)) || ('HTTP ' + r.status));
      return;
    }
  } catch (e) { sigSay(String(e && e.message || e)); return; }
  const rr = await signalAsk({ kind: 'pdfsig', act: 'sig_save', sid: SID, nm2: nm });
  if (rr.res && rr.res.signs) { SIG_LIST = rr.res.signs; SIG_PICK = -1; sigPaintSaved(); }
  sigSay((rr.res && rr.res.note) || (rr.why ? T.signWait : ''));
}

function sigClose() {
  SIG_PHASE = '';
  $('sig').classList.remove('on');
  $('sigBar').hidden = true;
}

async function sigOpen() {
  if (!DOC) return;
  const off = whyOff();
  if (off) { say(off, 'bad'); return; }
  SIG_PHASE = 'pick';
  SIG_PNG = ''; SIG_PICK = -1;
  /* СТАВИМ НА ВЫДЕЛЕННУЮ, А БЕЗ ВЫДЕЛЕНИЯ - НА ПОСЛЕДНЮЮ, И ЭТО ВИДНО СТРОКОЙ. Молчаливое
     «наверное, сюда» здесь недопустимо: подпись не на той странице человек заметит уже
     после отправки файла. */
  const sel = PAGES.map((p, i) => p.sel ? i : -1).filter((i) => i >= 0);
  SIG_PAGE = sel.length ? sel[0] : PAGES.length - 1;
  $('sigTtl').textContent = T.signTtl;
  $('sigNote').textContent = T.signNote;
  $('sigPickBox').hidden = false;
  $('sigPlaceBox').hidden = true;
  $('bSigClear').textContent = T.signClear;
  $('bSigFile').textContent = T.signFile;
  $('bSigCancel').textContent = T.signCancel;
  $('bSigKeep').textContent = T.signKeep;
  $('bSigKeep').hidden = true;
  $('bSigGo').textContent = T.signNext;
  $('sigDrawTtl').textContent = T.signDraw;
  $('sig').classList.add('on');
  $('sigBar').hidden = false;
  sigSay('');
  sigPaintSaved();
  sigPadInit();
  sigLoadSaved();
}

/* ═══ ШОВ ДЛЯ БРАУЗЕРНОЙ ПРОБЫ ═══
   Страница - ES-модуль, и её внутренности снаружи не видны. Проба, которая ради этого
   завела бы СВОЮ копию обрезки по чернилам, проверяла бы себя, а не продукт (закон №40),
   поэтому наружу отдаётся ссылка на боевые функции. Тот же ход, что `window.__SND_LAST`
   на странице комнаты. Ничего, кроме чтения, здесь нет: поставить подпись через этот шов
   нельзя - для этого нужны билет и приём. */
window.__studio = {
  fromPad: () => sigFromPad(),
  page: () => SIG_PAGE,
  phase: () => SIG_PHASE,
  png: () => SIG_PNG.slice(0, 24),
};

async function sigNext() {
  if (SIG_PHASE === 'pick') {
    const drawn = sigFromPad();
    if (drawn) SIG_PNG = drawn;
    if (!SIG_PNG) { sigSay(T.signEmpty); return; }
    await sigPlace();
    return;
  }
  await sigApply();
}

/* ── подъём ────────────────────────────────────────────────────────────────────── */
function texts() {
  $('ttl').textContent = T.ttl;
  $('drop').textContent = T.drop;
  $('bAll').textContent = T.all; $('bNone').textContent = T.none;
  $('bKeep').textContent = T.keep; $('bDel').textContent = T.del;
  $('bZip').textContent = T.zip; $('bReset').textContent = T.reset;
  $('bSign').textContent = T.sign;
  /* КНОПКИ ТУЛБАРА ПЕРЕВОДЯТСЯ ВСЕ, И ЭТО НЕ УКРАШЕНИЕ. `bForm` и `bRdt` ключей НЕ
     ИМЕЛИ - их подписи приехали из разметки, то есть в английской студии на тулбаре
     висел русский текст (закон №20, мой же недосмотр этапов 3 и 4). Сторож pdf36
     сверяет РАЗМЕТКУ со этим списком: появилась кнопка с текстом - будет и ключ. */
  $('bForm').textContent = T.form;
  $('bRdt').textContent = T.rdt;
  $('bCmp').textContent = T.cmp;
  $('bSave').textContent = T.save; $('bChat').textContent = T.chat;
  $('foot').textContent = T.foot;
  document.title = T.ttl;
}

(async function boot() {
  texts();
  if (tg) { try { tg.ready(); tg.expand(); } catch (e) { /* браузер */ } }
  const off = whyOff();
  if (off) { $('sub').textContent = ''; say(off, 'bad'); }
  else $('sub').textContent = '';
  checkVersion();
  pdfjs = await loadPdfjs();
  if (!pdfjs) note('pdf.js не загрузился - страницы показать нечем. '
                 + 'Скачивание и отправка в чат при этом работают.');

  $('drop').onclick = () => $('file').click();
  $('file').onchange = (e) => { const f = e.target.files[0]; if (f) upload(f); };
  ['dragenter', 'dragover'].forEach((n) => document.addEventListener(n, (e) => {
    e.preventDefault(); $('drop').classList.add('hot');
  }));
  ['dragleave', 'drop'].forEach((n) => document.addEventListener(n, (e) => {
    e.preventDefault(); $('drop').classList.remove('hot');
  }));
  document.addEventListener('drop', (e) => {
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (!f) return;
    if (!/\.pdf$/i.test(f.name || '')) { say(T.notPdf, 'bad'); return; }
    upload(f);
  });
  $('bAll').onclick = () => { PAGES.forEach((p) => p.sel = true); paint(); };
  $('bNone').onclick = () => { PAGES.forEach((p) => p.sel = false); paint(); };
  $('bRotL').onclick = () => rotate(-90);
  $('bRotR').onclick = () => rotate(90);
  $('bKeep').onclick = () => {
    const idx = selIdx();
    if (!idx.length) { say(T.pick, 'bad'); return; }
    if (idx.length === PAGES.length) { say(T.keepAll, 'bad'); return; }
    PAGES = PAGES.filter((p) => p.sel);
    PAGES.forEach((p) => p.sel = false);
    DIRTY = true; say(''); paint();
  };
  $('bDel').onclick = () => {
    const idx = selIdx();
    if (!idx.length) { say(T.pick, 'bad'); return; }
    if (idx.length === PAGES.length) { say(T.delAll, 'bad'); return; }
    PAGES = PAGES.filter((p) => !p.sel);
    DIRTY = true; say(''); paint();
  };
  $('bZip').onclick = async () => { await apply({ op: 'compress' }); };
  $('bSign').onclick = sigOpen;
  $('bForm').onclick = frmOpen;
  $('bRdt').onclick = rdtOpen;
  $('bRdtCancel').onclick = rdtClose;
  $('bRdtAdd').onclick = rdtAdd;
  $('bRdtGo').onclick = rdtGo;
  $('bFrmCancel').onclick = frmClose;
  $('bFrmAdd').onclick = frmAddMode;
  $('bFrmGo').onclick = frmGo;
  $('bCmp').onclick = cmpOpen;
  $('bCmpCancel').onclick = cmpClose;
  $('bCmpPick').onclick = () => $('cmpFile').click();
  $('cmpFile').onchange = (e) => { const f = e.target.files[0]; if (f) cmpPick(f); };
  $('bCmpMode').onclick = () => cmpMode(true);
  $('bCmpGo').onclick = cmpGo;
  $('bCmpPrev').onclick = () => { CMP.page -= 1; cmpPaintPage(); };
  $('bCmpNext').onclick = () => { CMP.page += 1; cmpPaintPage(); };
  $('bSigCancel').onclick = sigClose;
  $('bSigGo').onclick = sigNext;
  $('bSigKeep').onclick = sigKeep;
  $('bSigClear').onclick = () => {
    const c = $('sigPad');
    if (c.__reset) c.__reset();
    SIG_PNG = ''; SIG_PICK = -1; sigPaintSaved(); sigSay('');
  };
  $('bSigFile').onclick = () => $('sigFile').click();
  $('sigFile').onchange = (e) => {
    const f = e.target.files[0];
    if (!f) return;
    const fr = new FileReader();
    fr.onload = () => {
      /* ПРОВЕРЯЕМ КАРТИНКУ ЗАГРУЗКОЙ, А НЕ РАСШИРЕНИЕМ: имя приходит от файловой системы
         и ничего не доказывает, а `img.onerror` - доказывает. Приём на песочнице спросит
         то же самое у первых байт: два забора на разных концах, как у самого документа. */
      const probe = new Image();
      probe.onload = () => {
        SIG_PNG = fr.result;
        SIG_PICK = -1;
        if ($('sigPad').__reset) $('sigPad').__reset();
        sigPaintSaved();
        sigSay('');
      };
      probe.onerror = () => sigSay(T.signBad);
      probe.src = fr.result;
    };
    fr.onerror = () => sigSay(T.signBad);
    fr.readAsDataURL(f);
  };
  sigWireBox();
  $('bReset').onclick = () => {
    if (!DOC) return;
    PAGES = [];
    for (let i = 1; i <= DOC.numPages; i++) PAGES.push({ src: i, rot: 0, sel: false });
    DIRTY = false; say(''); paint();
  };
  $('bSave').onclick = save;
  $('bChat').onclick = toChat;
  $('bZclose').onclick = () => $('zoom').classList.remove('on');
})();
</script>
