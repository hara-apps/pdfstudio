<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PDF-студия</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<!--
  ═══ PDF-СТУДИЯ, ЭТАП 1 ═══
  ЧТО ЭТА СТРАНИЦА ДЕЛАЕТ САМА, А ЧТО ПРОСИТ У ДРУГИХ:
    · рисует страницы (pdf.js, Apache-2.0, лежит рядом двумя файлами);
    · собирает НАМЕРЕНИЕ человека - порядок страниц, поворот, что удалить;
    · за БИЛЕТОМ ходит к Worker'у (там и только там проверяют подпись Telegram);
    · файл кладёт на ПЕСОЧНИЦУ (адрес приезжает параметром `pdf=`), и работу делает она.
  СВОЕЙ ЛОГИКИ РАБОТЫ НАД PDF ЗДЕСЬ НЕТ НИ ОДНОЙ СТРОКИ: страница показывает и просит.

  ═══ ЧЕГО В ЭТАПЕ 1 НЕТ, И ЭТО СКАЗАНО ЧЕЛОВЕКУ, А НЕ ЗАМОЛЧАНО ═══
  Объединение двух документов и конвертация из Word/Excel остались В ЧАТЕ, где они уже
  работают. Причина у каждой своя и названа внизу экрана: объединению нужен ВТОРОЙ файл
  (то есть вторая сессия и второй билет), конвертации - вход, который не является PDF, а
  приём студии принимает только `%PDF-`. Сделать их наполовину значило бы завести кнопку,
  которая иногда работает.
-->
<style>
/* ═══ ЦВЕТ ЖИВЁТ ТОКЕНАМИ, И ОБЕ ТЕМЫ ЗАДАНЫ ЦЕЛИКОМ ═══
   Telegram отдаёт свои `themeParams`, но НЕ ВСЕГДА и не все поля (в браузере их нет
   вовсе). Поэтому наши значения - основа, а тема клиента накладывается сверху там, где
   она есть: страница обязана быть читаемой ДО того, как SDK что-то сказал. */
:root{
  --bg:#f6f7f9; --card:#fff; --ink:#12151a; --dim:#5b6270; --line:#e3e6ea;
  --accent:#7c3aed; --accent-ink:#fff; --accent-line:#8b5cf6;
  --warn:#92400e; --warn-bg:#fef3c7; --bad:#9d174d; --ok:#059669;
  --sel:#ede9fe;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1115; --card:#171a20; --ink:#e7e9ee; --dim:#9aa2b1; --line:#262b34;
    --accent:#8b5cf6; --accent-ink:#fff; --accent-line:#a78bfa;
    --warn:#fbbf24; --warn-bg:#3a2f14; --bad:#fb7185; --ok:#34d399;
    --sel:#2a2140;
  }
}
*{box-sizing:border-box}
/* ═══ hidden ОБЯЗАН СКРЫВАТЬ, И ЭТО НЕ ОЧЕВИДНОСТЬ ═══
   ЗАМЕР БРАУЗЕРОМ 11.10: `#tools`, `#bar`, `#sigBar` и `#frmBar` стояли с атрибутом
   `hidden`, а вычисленный `display` у них был `flex` - потому что правило по ID сильнее
   браузерного `[hidden]{display:none}`. Цена: ряд операций и кнопки «Скачать»/«В чат»
   видны и НАЖИМАЕМЫ до загрузки документа, а панель подписи после закрытия экрана
   остаётся прозрачной мёртвой зоной поверх нижних кнопок. Кнопка, обещающая работу,
   которой не случится, хуже отсутствующей (закон №36).
   ПРАВИЛО ОДНО НА ВСЮ СТРАНИЦУ: без него каждая новая панель повторяет ту же ошибку, и
   заметит её не автор, а человек. Сторож - pdf30. */
[hidden]{display:none !important}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font:15px/1.45 -apple-system,BlinkMacSystemFont,
  "Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  /* min-height, А НЕ height:100% - иначе контейнер равен ровно экрану, и липкая шапка
     уезжает вместе со списком после первой прокрутки (замер в браузере, закон №37). */
  min-height:100vh; padding-bottom:96px;
  -webkit-text-size-adjust:100%;
}
header{
  position:sticky; top:0; z-index:20; background:var(--card);
  border-bottom:1px solid var(--line); padding:10px 12px 8px;
}
h1{font-size:16px; margin:0 0 2px; font-weight:650}
.sub{font-size:12px; color:var(--dim)}
.row{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
/* ═══ РЯД ДЕЙСТВИЙ ЖИВЁТ ВНУТРИ ЛИПКОЙ ШАПКИ ═══
   Отдельным блоком под ней он уезжал бы ПОД неё на первой же прокрутке, и от кнопок
   оставалась бы нижняя половина (закон №37: липкий элемент прибит к своему контейнеру). */
.tools{margin-top:8px}
button{
  font:inherit; color:var(--ink); background:var(--card); border:1px solid var(--line);
  border-radius:9px; padding:8px 11px; cursor:pointer; min-height:38px;
}
button:active{transform:translateY(1px)}
button[disabled]{opacity:.45; cursor:default}
button.pri{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
button.sm{padding:6px 9px; min-height:32px; font-size:13px}
#grid{
  display:grid; grid-template-columns:repeat(auto-fill,minmax(104px,1fr));
  gap:10px; padding:12px;
}
.pg{
  background:var(--card); border:2px solid var(--line); border-radius:10px;
  padding:6px 6px 4px; text-align:center; position:relative; touch-action:none;
  user-select:none; -webkit-user-select:none;
}
.pg.sel{border-color:var(--accent-line); background:var(--sel)}
.pg.drag{opacity:.4}
.pg.over{border-color:var(--accent); border-style:dashed}
.pg canvas{width:100%; height:auto; display:block; border-radius:4px; background:#fff}
.pg .n{font-size:11px; color:var(--dim); margin-top:3px}
.pg .x{
  position:absolute; top:2px; right:2px; width:22px; height:22px; line-height:20px;
  border-radius:50%; border:1px solid var(--line); background:var(--card);
  font-size:13px; padding:0; min-height:0;
}
/* РАЗРЕЗ ЖИВЁТ НА САМОМ ХОЛСТЕ, А НЕ НА СВОЁМ ЭКРАНЕ: смысл кнопки - «здесь кончается
   первый файл», и понять его можно только видя страницы по обе стороны от неё. Отдельный
   экран пришлось бы заполнить теми же картинками, то есть второй копией холста. */
.pg .cut{
  position:absolute; top:50%; right:-9px; transform:translateY(-50%);
  width:20px; height:20px; line-height:18px; border-radius:50%;
  border:1px solid var(--line); background:var(--card);
  font-size:11px; padding:0; min-height:0; z-index:2; opacity:.55;
}
.pg .cut.on{opacity:1; border-color:var(--accent); background:var(--sel)}
.pg.cutAfter{border-right:3px solid var(--accent)}
#drop{
  margin:14px 12px; padding:26px 14px; border:2px dashed var(--line); border-radius:12px;
  text-align:center; color:var(--dim); background:var(--card);
}
#drop.hot{border-color:var(--accent); color:var(--ink)}
#say{padding:10px 12px; font-size:13px; color:var(--dim); white-space:pre-wrap}
#say.bad{color:var(--bad)} #say.ok{color:var(--ok)}
#note{
  margin:10px 12px; padding:9px 11px; border-radius:9px; background:var(--warn-bg);
  color:var(--warn); font-size:12.5px;
}
#bar{
  position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--card);
  border-top:1px solid var(--line); padding:9px 12px calc(9px + env(safe-area-inset-bottom));
  display:flex; gap:8px;
}
#bar button{flex:1}
#zoom{
  position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.88); display:none;
  overflow:auto; padding:12px; text-align:center;
}
#zoom.on{display:block}
#zoom canvas{max-width:100%; height:auto; background:#fff; border-radius:6px}
#zoom .close{position:sticky; top:0; float:right}
.foot{padding:4px 12px 12px; font-size:11.5px; color:var(--dim)}
/* ═══ ПОДПИСЬ ═══
   `touch-action:none` обязателен и на холсте рисования, и на рамке размещения: без него
   жест пальца уезжает в ПРОКРУТКУ страницы, и человек вместо росчерка листает документ.
   Урок оплачен доской в комнате, оттуда же и pointer events вместо touch/mouse. */
/* ═══ ПОЛНОЭКРАННЫЙ ЭКРАН И ЕГО НИЖНЯЯ ПАНЕЛЬ - ОДНИМ КЛАССОМ НА ВСЕ ЧЕТЫРЕ ═══
   Подпись, скрытие, формы и сравнение выглядят одинаково НЕ случайно: человек один раз
   понял, что карточка поверх сетки это «отдельное дело с этим документом». Но описано это
   было ЧЕТЫРЬМЯ копиями правил (три экрана плюс три панели), и копии УЖЕ РАЗОШЛИСЬ: у
   панели подписи `padding` был 9px против 10px у двух других, а радиус карточки 12px
   против 14px. Никто этого не заказывал - просто правку внесли в одно место из трёх.
   Пятая копия ради сравнения версий повторила бы ровно историю закона №40 (четыре копии
   правила ссылки разошлись на кавычке в href, и карточка не приходила вовсе). */
.scr{
  position:fixed; inset:0; z-index:60; background:rgba(0,0,0,.92); display:none;
  overflow:auto; padding:12px calc(12px + env(safe-area-inset-left)) 96px;
}
.scr.on{display:block}
.scr .card{
  max-width:560px; margin:0 auto; background:var(--card); border:1px solid var(--line);
  border-radius:14px; padding:12px;
}
.scrBar{
  position:fixed; left:0; right:0; bottom:0; z-index:61; display:flex; gap:8px;
  padding:10px 12px calc(10px + env(safe-area-inset-bottom)); background:var(--card);
  border-top:1px solid var(--line);
}
.scrBar button{flex:1}
#sig h2{font-size:15px; margin:0 0 8px}
#sigNote{
  margin:0 0 10px; padding:9px 11px; border-radius:9px; background:var(--warn-bg);
  color:var(--warn); font-size:12.5px;
}
#sigSaved{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px}
.sigCard{
  position:relative; border:2px solid var(--line); border-radius:9px; background:#fff;
  padding:4px; width:132px; cursor:pointer;
}
.sigCard.sel{border-color:var(--accent)}
.sigCard img{width:100%; height:46px; object-fit:contain; display:block}
.sigCard .nm{font-size:10.5px; color:#444; text-align:center; margin-top:2px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.sigCard .x{
  position:absolute; top:-7px; right:-7px; width:22px; height:22px; line-height:20px;
  border-radius:50%; border:1px solid var(--line); background:var(--card);
  font-size:13px; padding:0; min-height:0;
}
#sigPad{
  width:100%; height:190px; background:#fff; border:1px dashed var(--line);
  border-radius:9px; display:block; touch-action:none; cursor:crosshair;
}
#sigRow{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px}
#sigWrap{position:relative; margin:0 auto; width:max-content; max-width:100%}
#sigWrap canvas{display:block; max-width:100%; height:auto; background:#fff; border-radius:6px}
#sigBox{
  position:absolute; border:1.5px dashed var(--accent); background:transparent;
  touch-action:none; cursor:move;
}
#sigBox img{width:100%; height:100%; display:block; pointer-events:none}
#sigGrip{
  position:absolute; right:-11px; bottom:-11px; width:26px; height:26px; border-radius:50%;
  background:var(--accent); border:2px solid #fff; touch-action:none; cursor:nwse-resize;
}
/* ═══ ЭКРАН СКРЫТИЯ ДАННЫХ ═══
   Устроен как экран форм и подписи - человек уже знает этот язык. Отличие одно и оно
   несущее: областей БОЛЬШЕ ОДНОЙ, поэтому обведённое складывается в список, и видно, что
   именно уйдёт, ДО нажатия. Скрытие необратимо, и «применилось не то» здесь дороже. */
#rdt h2{font-size:16px; margin:0 0 8px}
#rdtWarn{
  margin:0 0 10px; padding:9px 11px; font-size:13px; border-radius:10px;
  background:var(--warn-bg); color:var(--warn);
}
/* ═══ ЛИСТ С РАМКОЙ - ОДИН КЛАСС НА ВСЕ ЭКРАНЫ, КОТОРЫЕ ЧТО-ТО ОБВОДЯТ ═══
   Их теперь два (скрытие данных и обрезка полей), и своя копия этих правил по ID у
   каждого разошлась бы на первой правке - ровно тот класс, который ловит pdf43. Цвет
   рамки РАЗНЫЙ ПО СМЫСЛУ: красная «уберём отсюда», синяя «оставим вот это», и это
   единственное, что задаётся поверх класса. */
.pickWrap{position:relative; display:inline-block; max-width:100%}
.pickWrap canvas{max-width:100%; height:auto; display:block; border-radius:8px}
.pickBox{
  position:absolute; border:2px dashed #fb7185; background:rgba(251,113,133,.22);
  touch-action:none; cursor:move;
}
.pickGrip{
  position:absolute; right:-9px; bottom:-9px; width:20px; height:20px; border-radius:50%;
  background:#fb7185; border:2px solid #fff; touch-action:none; cursor:nwse-resize;
}
/* ОБРЕЗКА ОСТАВЛЯЕТ, А НЕ УБИРАЕТ - поэтому её рамка не красная: человек видит внутри
   рамки то, что останется, и красный тут обещал бы обратное. */
#crp .pickBox{border-color:#60a5fa; background:rgba(96,165,250,.14)}
#crp .pickGrip{background:#60a5fa}
/* УЖЕ ОБВЕДЁННЫЕ ОБЛАСТИ ВИДНЫ НА ЛИСТЕ, а не только числами в списке: человек обводит
   глазами и проверять себя будет тоже глазами. */
.rdtDone{position:absolute; background:rgba(0,0,0,.72); pointer-events:none}
#rdtList{font-size:13px; color:var(--dim); padding-top:8px}
#rdtList div{padding:2px 0}
/* ═══ ЭКРАН ПОМЕТОК ═══
   РАМКА ЖЁЛТАЯ У ВЫДЕЛЕНИЯ И КРАСНАЯ У ОБВОДКИ - ТЕ ЖЕ ЦВЕТА, ЧТО УЕДУТ В ФАЙЛ. Покажи
   мы одну рамку на все виды - человек выбирал бы вид вслепую и узнавал результат из
   скачанного файла (закон №75: экран проверяется тем, что на нём видно). */
#ann h2{font-size:16px; margin:0 0 8px}
#annKinds{display:flex; gap:8px; flex-wrap:wrap; padding-bottom:6px}
#annKinds button.on{outline:2px solid var(--accent)}
#ann .pickBox{border-color:#fbbf24; background:rgba(251,191,36,.22)}
#ann .pickGrip{background:#fbbf24}
#ann.box .pickBox{border-color:#fb7185; background:rgba(251,113,133,.16)}
#ann.box .pickGrip{background:#fb7185}
#annText{width:100%; margin-top:8px}
#annList{font-size:13px; color:var(--dim); padding-top:8px}
#annList div{padding:2px 0}
#annBurnRow{display:flex; align-items:center; gap:8px; padding-top:10px; font-size:13.5px}
#annBurnNote{padding-top:4px}
.annDone{position:absolute; pointer-events:none; border-radius:2px}
.annDone.high{background:rgba(251,191,36,.42)}
.annDone.box{border:2px solid rgba(251,113,133,.95)}
.annDone.note{background:rgba(251,191,36,.75); border:1px solid rgba(180,120,0,.9)}
/* ═══ ЭКРАН «ЕЩЁ»: ПО СТРОКЕ НА ОПЕРАЦИЮ ═══
   Классами, а не правилами по ID: пять операций - это пять ОДИНАКОВЫХ строк, и своя копия
   стилей у каждой разъехалась бы на первой правке (тот же класс, что ловит pdf43). */
.morRow{padding:10px 0; border-top:1px solid var(--line)}
.morRow:first-of-type{border-top:0}
.morName{font-size:14px; font-weight:600; padding-bottom:6px}
.morLine{display:flex; gap:6px; align-items:center; flex-wrap:wrap}
.morLine input, .morLine select{
  flex:1 1 120px; min-width:0; padding:7px 9px; font-size:14px; border-radius:8px;
  border:1px solid var(--line); background:var(--card); color:inherit;
}
.morLine button{flex:0 0 auto}
/* ═══ ЭКРАН ФОРМ ═══ */
#frm h2{font-size:16px; margin:0 0 8px}
/* ПОЛЕ - СТРОКА С ПОДПИСЬЮ СВЕРХУ: имя поля в анкете бывает длинным («Фамилия, имя и
   отчество полностью»), и в одну строку с вводом оно не влезает ни на одном телефоне. */
.fld{margin:0 0 10px}
.fld .lbl{font-size:12px; color:var(--dim); margin-bottom:3px; word-break:break-word}
.fld .lbl b{color:var(--ink); font-weight:600}
.fld input[type=text],.fld select{
  width:100%; padding:8px 10px; font-size:15px; color:var(--ink); background:var(--bg);
  border:1px solid var(--line); border-radius:9px; outline:none;
}
.fld input[type=text]:focus,.fld select:focus{border-color:var(--accent-line)}
.fld .chk{display:flex; align-items:center; gap:8px; font-size:15px}
.fld .chk input{width:20px; height:20px}
/* ПОЛЕ ТОЛЬКО ДЛЯ ЧТЕНИЯ ГАСИМ, А НЕ ПРЯЧЕМ: спрятанное читается как «такого поля нет», и
   человек ищет его глазами в документе (закон №36). */
.fld.ro input,.fld.ro select{opacity:.55}
.fld .ro-why{font-size:11px; color:var(--warn)}
#frmMake{margin-top:4px}
#frmWrap{position:relative; display:inline-block; max-width:100%}
#frmWrap canvas{max-width:100%; height:auto; display:block; border-radius:8px}
#frmBox{
  position:absolute; border:2px dashed var(--accent-line); background:rgba(124,58,237,.12);
  touch-action:none; cursor:move;
}
#frmGrip{
  position:absolute; right:-9px; bottom:-9px; width:20px; height:20px; border-radius:50%;
  background:var(--accent); border:2px solid #fff; touch-action:none; cursor:nwse-resize;
}
/* ═══ ЭКРАН СРАВНЕНИЯ ВЕРСИЙ ═══
   ПОДСВЕЧИВАЕМ НА ЛИСТЕ ВТОРОЙ ВЕРСИИ, и это решение, а не оформление: правка живёт ТАМ,
   ГДЕ СЛОВА СТОЯТ СЕЙЧАС, и человек читает новую редакцию, сверяясь со старой. Удалённого
   на этом листе НЕТ - ему отдельный список, иначе подсветка показывала бы пустое место.
   ЦВЕТ БЕЗ ЛЕГЕНДЫ - ЭТО ЗАГАДКА, А НЕ ОТВЕТ: три вида различий (новое, заменённое,
   переехавшее) различаются цветом, и подписи к цветам стоят рядом с листом. */
#cmpWrap{position:relative; display:inline-block; max-width:100%}
#cmpWrap canvas{max-width:100%; height:auto; display:block; border-radius:8px}
.cmpHit{position:absolute; pointer-events:none; border-radius:2px}
.cmpHit.ins{background:rgba(74,222,128,.34); outline:1px solid rgba(74,222,128,.85)}
.cmpHit.rep{background:rgba(250,204,21,.34); outline:1px solid rgba(250,204,21,.9)}
.cmpHit.mv{background:rgba(96,165,250,.30); outline:1px dashed rgba(96,165,250,.9)}
/* ═══ ЭКРАН ПРАВКИ ТЕКСТА ═══
   ТАП-ЗОНА ОБЯЗАНА БЫТЬ ВИДНА ДО ТАПА. Холст это картинка, и строка, по которой можно
   тронуть, ничем не отличается от строки, по которой нельзя: человек тапал бы наугад и
   решил бы, что экран не работает. Поэтому зоны подсвечены всегда, а не по наведению -
   пальцем наведения не бывает.
   ЦВЕТ - СИНИЙ, КАК У ОБРЕЗКИ, А НЕ КРАСНЫЙ, КАК У СКРЫТИЯ ДАННЫХ: красный на этом
   холсте уже значит «отсюда уберём», и второе значение у того же цвета человек прочитал

<div id="ask">

<script type="module">
/* ═══════════════════════════════════════════════════════════════════════════════
   ЯЗЫК. ОБА СРАЗУ (закон №20): страница новая, и завести её по-русски значило бы
   немедленно дописать её в реестр остатков мультиязычности - то есть отложить работу,
   которая здесь стоит десяти строк. Пин приезжает параметром `lang` от бота (он знает
   выбор человека), иначе спрашиваем клиента.
   ═══════════════════════════════════════════════════════════════════════════════ */
const Q = new URLSearchParams(location.search);
const tg = window.Telegram && window.Telegram.WebApp;
const LANG = (Q.get('lang') || (tg && tg.initDataUnsafe && tg.initDataUnsafe.user
  && tg.initDataUnsafe.user.language_code) || 'ru').slice(0, 2).toLowerCase() === 'en'
  ? 'en' : 'ru';
const T = {
  ru: {
    ttl: 'PDF-студия', drop: 'Перетащи сюда PDF или картинки (можно сразу несколько) '

/* АДРЕСА - ПАРАМЕТРОМ ССЫЛКИ СИЛЬНЕЕ ЗАШИТОГО ПРИ ВЫКЛАДКЕ. Причина записана в
   publish_static.page_url и стоила полдня: `https://rtc.harma.cc` подставляется В МОМЕНТ ДЕПЛОЯ, и
   если Worker тогда не был в реестре, страница остаётся без адреса НАВСЕГДА. Ссылку же
   бот собирает заново на каждый тап. */
const API = (Q.get('api') || 'https://rtc.harma.cc').replace(/\/+$/, '');
const BASE = (Q.get('pdf') || '').replace(/\/+$/, '');
const INIT = (tg && tg.initData) || '';

const $ = (id) => document.getElementById(id);
const say = (t, cls) => { const e = $('say'); e.textContent = t || ''; e.className = cls || ''; };
const note = (t) => { const e = $('note'); e.textContent = t || ''; e.hidden = !t; };

/* ═══ ПОЧЕМУ НЕ РАБОТАЕТ - ТРИ РАЗНЫХ ОТВЕТА, А НЕ ОДИН ═══
   Живой урок плеера: одна фраза «связи с ботом нет» стояла и там, где нет адреса, и там,
   где нет подписи, - и разбор полдня шёл в сторону исправного Worker'а. */
function whyOff() {
  if (!INIT) return T.noSign;
  if (!API) return T.noApi;
  if (!BASE) return T.noBase;
  return '';
}

   открылась и написала «pdf.js не загрузился»; отказали ОБЕ ступени СРАЗУ, и замер
   показал, почему это было неизбежно (pdf.js 6.3.289):

       признак                   современная   legacy
       static{} (блок класса)         1           1
       приватное поле `this.#`     3211        3211
       `??=`                         12          12
       `Promise.withResolvers`       27          27
       `getOrInsertComputed`         17          23   <- ЕДИНСТВЕННАЯ разница

   Legacy-сборка pdf.js подставляет ПОЛИФИЛЫ МЕТОДОВ (core-js) и не трогает СИНТАКСИС.
   То есть лестница закрывала «нет такого МЕТОДА» (так было в Chromium 1194:
   `getOrInsertComputed is not a function` уже на документе) и не закрывала «не понимаю
   такого СИНТАКСИСА»: модуль с `static{}` не разбирается вовсе, `import()` отваливается
   SyntaxError, и обе ступени падают ОДИНАКОВО. Пол по синтаксису у обеих - Safari 16.4
   (на этой границе меняется вывод esbuild), то есть на macOS 12 и ниже студия была мертва.

   ТРЕТЬЯ СТУПЕНЬ `./compat` - та же legacy, опущенная по синтаксису до es2017/safari15
   (`tools/pdfjs_compat.py`, сборка лежит в git и сверяется с источником отпечатком).
   Отрисовка проверена во всех трёх движках: chromium, webkit, firefox.
   ═══════════════════════════════════════════════════════════════════════════════ */
let pdfjs = null, PDFJS_BUILD = '';
const PDFJS_BUILDS = [['.', 'modern'], ['./legacy', 'legacy'], ['./compat', 'compat']];
/* ПРИЧИНЫ ОТКАЗОВ ПО СТУПЕНЯМ: файл и ошибка, по строке на ступень. Без этого человек
   получал фразу «не загрузился», по которой нельзя отличить 404 от SyntaxError, а разбор
   уходил на день (закон №22: число/факт без механизма хуже его отсутствия). */
const PDFJS_WHY = [];
async function loadOne(i) {
  if (i >= PDFJS_BUILDS.length) return null;
  const [dir, tag] = PDFJS_BUILDS[i];
  const file = dir + '/pdf.min.mjs';
  try {
    const lib = await import(file);
    lib.GlobalWorkerOptions.workerSrc = dir + '/pdf.worker.min.mjs';
    PDFJS_BUILD = tag;
    return lib;
  } catch (e) {
    const why = tag + ' (' + file + '): ' + ((e && (e.message || e.name)) || e);
    PDFJS_WHY.push(why);
    console.log('[pdf] сборка не поднялась - ' + why);
    return null;
  }
}
async function loadPdfjs() {
  for (let i = 0; i < PDFJS_BUILDS.length; i++) {
    const lib = await loadOne(i);
    if (lib) return lib;
  }
  return null;
}
/* ═══ ЧЕГО НЕ ХВАТИЛО ДВИЖКУ - СПРАШИВАЕМ У НЕГО, А НЕ У UA ═══
   Строка уходит человеку и в консоль. Это ОБЪЯСНЕНИЕ, а не решение: решает по-прежнему
   факт загрузки (ступени выше). Проверяем ровно то, на чём и спотыкается библиотека:
   блок `static{}` в классе (Safari 16.4) и методы, которых у старых движков нет.
   `new Function` нужен нарочно: такой синтаксис нельзя написать в самой странице - она
   тогда не разберётся на том же движке целиком, а это как раз то, от чего мы лечимся. */
function engineGaps() {
  const out = [];
  /* ДВА РАЗНЫХ ОТКАЗА `new Function` НЕ СЛИВАЮТСЯ В ОДНУ ФРАЗУ (закон №22): SyntaxError
     значит «движок не знает такого синтаксиса», а любая другая ошибка - «проверить не
     дали» (например, запрет eval политикой страницы). Сказать второе первым словами
     значило бы послать человека менять macOS там, где дело в политике. */
  try {
    new Function('class X{static {}}');
  } catch (e) {
    out.push((e && e.name === 'SyntaxError')
      ? 'нет блоков static{} в классах (Safari до 16.4)'
      : 'про блоки static{} спросить не дали: ' + ((e && e.name) || 'неизвестно'));
  }
  try { if (!Map.prototype.getOrInsertComputed) out.push('нет Map.getOrInsertComputed (Safari до 26)'); } catch (e) { out.push('нет Map.getOrInsertComputed'); }
  try { if (!Promise.withResolvers) out.push('нет Promise.withResolvers (Safari до 17.4)'); } catch (e) { out.push('нет Promise.withResolvers'); }
  try { if (typeof OffscreenCanvas === 'undefined') out.push('нет OffscreenCanvas (Safari до 16.4)'); } catch (e) { out.push('нет OffscreenCanvas'); }
  return out;
}
/* ОДНА ДВЕРЬ НА ВСЕ ФРАЗЫ «pdf.js не поднялся» (закон №40): их в странице четыре, и
   четыре разных текста расходятся на первой же правке - а расхождение здесь означает,
   что в одном месте причина названа, а в другом нет. */
function pdfjsWhy(head) {
  const g = engineGaps();
  return (head || T.noPdfjs)
       + (PDFJS_WHY.length ? ' Ступени: ' + PDFJS_WHY.join('; ') + '.' : '')
       + (g.length ? ' Движок: ' + g.join(', ') + '.' : '')
       + ' Движок целиком: ' + ((navigator && navigator.userAgent) || '?').slice(0, 120);
}
/* ═══ ОТКАТ НА LEGACY ИДЁТ И ПО ОТКАЗУ В РАБОТЕ, А НЕ ТОЛЬКО ПО ОТКАЗУ ИМПОРТА ═══
   НАЙДЕНО БРАУЗЕРНЫМ ПРОГОНОМ, а не чтением: в Chromium 1194 современная сборка
   ИМПОРТИРУЕТСЯ БЕЗ ЕДИНОЙ ОШИБКИ и падает уже на документе -
   `this[#Yr].getOrInsertComputed is not a function`. Лестница по импорту такого не ловит
   по построению, и человек на старом вебвью получал бы сырую строку чужой ошибки вместо
   отката, ради которого вторая сборка и лежит рядом (условие Ren: откат без переделки). */
async function pdfjsFallback() {
  /* ИДЁМ ПО ОСТАВШИМСЯ СТУПЕНЯМ, А НЕ ПО ОДНОЙ НАЗВАННОЙ: со второй ступени отказ в
     РАБОТЕ так же возможен, как с первой (`getOrInsertComputed` есть в обеих, полифил
     только во второй и третьей), и жёсткое `loadOne(1)` оставляло бы третью ступень
     недостижимой с legacy - то есть ровно там, где она и нужна. */
  const было = PDFJS_BUILDS.findIndex((b) => b[1] === PDFJS_BUILD);
  for (let i = (было < 0 ? 0 : было) + 1; i < PDFJS_BUILDS.length; i++) {
    const lib = await loadOne(i);
    if (!lib) continue;
    pdfjs = lib;
    console.log('[pdf] сборка не сработала на документе - перешёл на ' + PDFJS_BUILD);
    return true;
  }
  return false;
}

/* ═══ ОДНА ДВЕРЬ НА ОТКРЫТИЕ ДОКУМЕНТА, И В НЕЙ ЗАПРЕТ `ImageDecoder` ═══
   НАЙДЕНО ПЕРВЫМ ЖЕ ПРОГОНОМ В WEBKIT (31.10). PDF, внутри которого лежат JPEG (а это
   КАЖДЫЙ скан и каждая страница, собранная из снимков телефона), УРОНИЛ СТРАНИЦУ ЦЕЛИКОМ:
   не исключение, не пустой холст - падение процесса вкладки. В chromium и firefox тот же
   файл рисуется. Замер на одном документе (27 КБ, 3 страницы из JPEG):

       движок     как есть          isImageDecoderSupported: false
       webkit     СТРАНИЦА МЕРТВА   3 страницы отрисованы
       chromium   3 страницы        3 страницы
       firefox    3 страницы        3 страницы

   Виновник - WebCodecs `ImageDecoder`, которым pdf.js 6.x декодирует картинки В ВОРКЕРЕ
   (`isOffscreenCanvasSupported` тут ни при чём: с ним выключенным webkit падал так же).
   Отключаем ВО ВСЕХ движках, а не по разбору UA: UA врёт (это же правило в лестнице
   сборок выше), а цена отключения - только скорость декодирования картинок, тогда как
   цена падения - человек теряет документ и не получает даже причины.
   ТРИ МЕСТА БЫЛО, ДВЕРЬ ОДНА (закон №40): без неё запрет уехал бы в одно из трёх, а
   сравнение версий и второй документ продолжали бы ронять вкладку. */
function openDoc(bytes) {
  return pdfjs.getDocument({ data: bytes, isImageDecoderSupported: false }).promise;
}

/* ═══════════════════════════════════════════════════════════════════════════════
   СОСТОЯНИЕ. Порядок страниц и повороты живут ЗДЕСЬ, а применяются ОДНИМ вызовом на
   песочнице. Гонять документ туда-сюда на каждый поворот значило бы платить сетью за
   то, что человек делает пальцем.
   ═══════════════════════════════════════════════════════════════════════════════ */
/* ЯРЛЫК БОТА, ЧЬЕЙ КНОПКОЙ ОТКРЫЛИ СТУДИЮ: уезжает обратно в каждом сигнале, чтобы
   задачу забрал ИМЕННО ЭТОТ бот, а не первый опросивший общий ящик (прод и тест ходят
   в один). Пусто - работаем как раньше. */
const BFP = Q.get('bfp') || '';
let TICKET = '', SID = '', DOC = null, NAME = '', MAXMB = 100;
/* ═══ ЭКРАН, НА КОТОРЫЙ ЧЕЛОВЕКА ПОСЛАЛИ ИЗ ЧАТА ═══
   Кнопка под документом в чате («✍️ Подписать» и соседи) открывает студию с `screen=`.
   Документа в сессии при этом ЕЩЁ НЕТ - файл лежит в чате, и первым делом страница просит
   его выбрать. Поэтому экран открывается не при загрузке страницы, а СРАЗУ ПОСЛЕ того,
   как документ нарисован, и ровно один раз: иначе человек, закрывший экран, получал бы
   его обратно после каждой правки холста. */
let WANT_SCREEN = '';
/* РЕЕСТР ИМЁН ЭКРАНОВ, А НЕ ВЕТКИ ПО СТРОКЕ: имя приезжает из чата (`pdf_ui._STUDIO_SCREENS`),
   и список здесь - единственное место, где решается, что такое имя значит. Новый экран =
   новая строка, а не новая развилка. */
const SCREENS = {
  sign: () => sigOpen(),
  form: () => frmOpen(),
  rdt: () => rdtOpen(),
  cmp: () => cmpOpen(),
  crp: () => crpOpen(),
  mor: () => morOpen(),
  txt: () => txtOpen(),
  ann: () => annOpen(),
};
/* СКОЛЬКО КАРТИНОК БЕРЁМ В ОДИН PDF. Число названо и здесь, и у приёма: страница обязана
   отказать РАНЬШЕ отправки шестидесяти первого файла, иначе человек узнает о потолке
   после того, как всё уехало. Правду считает приём, здесь - то же число для отказа. */
const MAXIMG = 60;
let PAGES = [];          // [{src:<номер в исходнике, с 1>, rot:<0|90|180|270>, sel:bool}]
let DIRTY = false;       // есть ли несохранённые намерения
let THUMBS = new Map();  // src -> canvas (рисуем один раз, перестановка их не меняет)
let SPL = { on: false, cuts: new Set() };  // разрез: после каких позиций холста резать
let MRG_WAIT = false;    // кто ждёт файл из общего ввода: объединение (true) или сравнение

const req = async (path, opt) => {
  const o = opt || {};
  o.headers = Object.assign({ 'X-Init-Data': INIT }, o.headers || {});
  const r = await fetch(path, o);
  let j = null;
  try { j = await r.json(); } catch (e) { j = null; }
  return { status: r.status, j: j };
};

/* ── билет ─────────────────────────────────────────────────────────────────────── */
async function ticket() {
  if (TICKET) return TICKET;
  const r = await req(API + '/pdf/ticket', { method: 'POST', body: '{}' });
  if (r.status !== 200 || !r.j || !r.j.ticket) {
    const why = (r.j && (r.j.error || r.j.human)) || ('HTTP ' + r.status);
    throw new Error('пропуск не выдан: ' + why);
  }
  TICKET = r.j.ticket; SID = r.j.sid;
  return TICKET;
}
const u = (p) => BASE + p + '?ticket=' + encodeURIComponent(TICKET);

/* ═══ ЧТО ВЫБРАЛ ЧЕЛОВЕК - РЕШАЕТ ОДНО МЕСТО ═══
   Вводов у выбора файла два (кнопка и перетаскивание), а решение «это PDF или набор
   картинок» должно быть ОДНО: вторая копия разошлась бы на первом же формате, и
   перетаскивание принимало бы то, чего не принимает кнопка (закон №40). */
const IMG_RX = /\.(jpe?g|png|webp|tiff?|gif)$/i;

function isImg(f) {
  return IMG_RX.test(f.name || '') || /^image\//.test(f.type || '');
}

async function pick(list) {
  const files = [...(list || [])];
  if (!files.length) return;
  const карт = files.filter(isImg);
  if (карт.length === files.length) return uploadImages(карт);
  if (!карт.length) {
    if (!/\.pdf$/i.test(files[0].name || '')
        && (files[0].type || '') !== 'application/pdf') { say(T.notPdf, 'bad'); return; }
    /* НЕСКОЛЬКО PDF СРАЗУ НЕ СКЛЕИВАЕМ МОЛЧА: порядок склейки - решение человека, а
       «взял первый и промолчал» он заметил бы только по пропавшему документу. */
    if (files.length > 1) note(T.manyPdf);
    return upload(files[0]);
  }
  /* СМЕСЬ НЕ УГАДЫВАЕМ. «Собрать картинки и приклеить к ним PDF» - это два разных
     замысла, и выбирать за человека тут нечего (закон №36: причина названа). */
  say(T.mixPick, 'bad');
}

/* ── картинки -> один PDF ──────────────────────────────────────────────────────── */
async function uploadImages(files) {
  const off = whyOff();
  if (off) { say(off, 'bad'); return; }
  if (files.length > MAXIMG) { say(T.imgMany(MAXIMG), 'bad'); return; }
  for (const f of files) {
    if (f.size > MAXMB * 1048576) { say(T.imgBig(f.name, MAXMB), 'bad'); return; }
  }
  try {
    await ticket();
    /* ПО ОДНОЙ КАРТИНКЕ ЗА ЗАПРОС, И НОМЕР ЕДЕТ ЯВНО: приём сверяет, что номер идёт
       следующим по счёту, поэтому потерянный запрос становится ОТКАЗОМ, а не страницей,
       которая молча заняла чужое место (закон №41). И человек всё это время видит счёт -
       двадцать снимков с телефона едут не мгновенно (закон №46). */
    for (let i = 0; i < files.length; i++) {
      say(T.imgSend(i + 1, files.length));
      const r = await fetch(u('/pdf/images') + '&i=' + (i + 1), {
        method: 'POST', body: files[i],
        headers: { 'X-Pdf-Name': encodeURIComponent(files[i].name || ('img' + (i + 1))) },
      });
      const j = await r.json().catch(() => null);
      if (!r.ok || !j || !j.ok) {
        say((j && (j.human || j.error)) || ('HTTP ' + r.status), 'bad');
        return;
      }
    }
    say(T.imgWork(files.length));
    const r = await fetch(u('/pdf/op'), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ op: 'from_images' }),
    });
    const j = await r.json().catch(() => null);
    if (!r.ok || !j || !j.ok) {
      say((j && (j.human || j.error)) || ('HTTP ' + r.status), 'bad');
      return;
    }
    NAME = j.name || 'картинки.pdf';
    /* СОБРАННЫЙ ДОКУМЕНТ ЗАБИРАЕМ С ПЕСОЧНИЦЫ, А НЕ СОБИРАЕМ ВТОРОЙ РАЗ В БРАУЗЕРЕ:
       показывать человеку свою версию того, что «должно было получиться», значит однажды
       показать не то, что лежит в файле (закон №52 - правду проверяем на выходе).
       ДВЕРЬ ИМЕННО ПОКАЗА (`/pdf/source`), А НЕ ВЫДАЧИ: `/pdf/result` отдаёт файл и
       ЗАКРЫВАЕТ сессию - «человек забрал, работа кончена». Через неё холст показывал
       собранный PDF, а следующая же правка отвечала «сессия истекла» (живой прогон
       12.10). */
    if (!(await reshow())) { say(T.imgNoShow, 'bad'); return; }
    say(T.imgDone(files.length, j.pages || PAGES.length), 'ok');
    note(T.imgAgain);
  } catch (e) {
    say(String(e && e.message || e), 'bad');
  }
}

/* ═══ ПЕРЕРИСОВАТЬ ХОЛСТ ТЕМ, ЧТО В СЕССИИ СЕЙЧАС ═══
   ЖИВОЙ ОТКАЗ 14.10 (нашёл прогон обрезки): визуальная операция меняет документ на
   песочнице, а холст продолжал показывать прежний - человек жал «Обрезать», получал
   «готово» и видел НЕОБРЕЗАННЫЕ страницы. Для операции, смысл которой «посмотри, как
   стало», это и есть «не сработало» (закон №23: ответ синхронен исходу).
   ДВЕРЬ ПОКАЗА, А НЕ ВЫДАЧИ: `/pdf/result` отдаёт файл и ЗАКРЫВАЕТ сессию. */
async function reshow() {
  const r = await fetch(u('/pdf/source'));
  if (!r.ok) return false;
  const buf = await r.arrayBuffer();
  await render(buf);
  return true;
}

/* ── загрузка файла ────────────────────────────────────────────────────────────── */
async function upload(f) {
  const off = whyOff();
  if (off) { say(off, 'bad'); return; }
  if (f.size > MAXMB * 1048576) { say(T.big(MAXMB), 'bad'); return; }
  say(T.sending);
  try {
    await ticket();
    /* ИМЯ ЕДЕТ PERCENT-ENCODED: в HTTP-заголовке сырой UTF-8 не переживает дорогу
       (спецификация разрешает там latin-1), и «отчёт.pdf» приехал бы мусором. Приём
       раскодирует. Проверено живым прогоном службы: без этого имя схлопывалось в « .pdf». */
    const r = await fetch(u('/pdf/upload'), {
      method: 'POST', body: f,
      headers: { 'X-Pdf-Name': encodeURIComponent(f.name || 'document.pdf') },
    });
    const j = await r.json().catch(() => null);
    if (!r.ok || !j || !j.ok) {
      say((j && (j.human || j.error)) || ('HTTP ' + r.status), 'bad');
      return;
    }
    NAME = j.name || f.name || 'document.pdf';
    await render(f);
    say('');
  } catch (e) {
    say(String(e && e.message || e), 'bad');
  }
}

/* ── отрисовка ─────────────────────────────────────────────────────────────────── */
async function render(fileOrBytes) {
  if (!pdfjs) { say(pdfjsWhy(), 'bad'); return; }
  say(T.loading);
  /* БАЙТЫ БЕРЁМ ЗАНОВО НА КАЖДУЮ ПОПЫТКУ, И ЭТО НЕ ПЕДАНТИЗМ: pdf.js ПЕРЕДАЁТ буфер
     воркеру, то есть ОТСОЕДИНЯЕТ его. Замер: вторая попытка на том же буфере падала
     `Cannot perform Construct on a detached ArrayBuffer` - то есть откат на legacy был бы
     мёртвым по построению. Из файла байты читаются заново и лишней памяти в обычном пути
     это не стоит. */
  const bytes = async () => (fileOrBytes instanceof Blob
    ? await fileOrBytes.arrayBuffer()
    : fileOrBytes.slice(0));
  /* ОТКАТ ОБНИМАЕТ ВЕСЬ ПЕРВЫЙ ПРОХОД, А НЕ ОДИН `getDocument`. Сборка ломается и на
     отрисовке страницы тоже (замер: `getOrInsertComputed` прилетел из `page.render`, а не
     из разбора документа), и узкий try поймал бы только половину случаев. */
  try {
    await renderWith(await bytes());
  } catch (e) {
    if (!(await pdfjsFallback())) throw e;
    await renderWith(await bytes());
  }
}

async function renderWith(buf) {
  DOC = await openDoc(new Uint8Array(buf));
  PAGES = [];
  for (let i = 1; i <= DOC.numPages; i++) PAGES.push({ src: i, rot: 0, sel: false });
  DOCS = [{ doc: DOC, from: 1 }];
  SPL.cuts.clear(); SPL.on = false;
  THUMBS.clear();
  DIRTY = false;
  $('drop').hidden = true;
  $('tools').hidden = false;
  $('bar').hidden = false;
  await paint();
  /* ЭКРАН ИЗ ЧАТА ОТКРЫВАЕМ ЗДЕСЬ: документ нарисован, значит экрану есть что показывать.
     Сбрасываем имя сразу - один раз, а не на каждую перерисовку холста. */
  if (WANT_SCREEN && SCREENS[WANT_SCREEN]) {
    const _fn = SCREENS[WANT_SCREEN];
    WANT_SCREEN = '';
    note('');
    await _fn();
  }
}

/* ═══ ХОЛСТ УМЕЕТ НЕСКОЛЬКО ДОКУМЕНТОВ, И ЭТО ТРЕБОВАНИЕ ОБЪЕДИНЕНИЯ ═══
   Номер `src` у страницы - это номер В ДОКУМЕНТЕ НА ПЕСОЧНИЦЕ, и после объединения он
   продолжается во втором файле. Рисовать его при этом надо из второго pdf.js-документа:
   спроси мы страницу 7 у первого (у которого их четыре), pdf.js отдал бы отказ, а холст
   показал бы пустые карточки - то есть «объединил» выглядело бы как поломка. */
let DOCS = [];           // [{doc, from}] - исходник и приклеенные объединением, по порядку

function docFor(src) {
  for (let i = DOCS.length - 1; i >= 0; i--) {
    if (src >= DOCS[i].from) return { doc: DOCS[i].doc, n: src - DOCS[i].from + 1 };
  }
  return { doc: DOC, n: src };
}

async function thumb(src) {
  if (THUMBS.has(src)) return THUMBS.get(src);
  const d = docFor(src);
  const page = await d.doc.getPage(d.n);
  const vp = page.getViewport({ scale: 1 });
  const scale = Math.min(1.4, 190 / vp.width);
  const v = page.getViewport({ scale: scale });
  const c = document.createElement('canvas');
  c.width = Math.ceil(v.width); c.height = Math.ceil(v.height);
  await page.render({ canvasContext: c.getContext('2d'), viewport: v }).promise;
  THUMBS.set(src, c);
  return c;
}

async function paint() {
  const g = $('grid');
  g.textContent = '';
  for (let i = 0; i < PAGES.length; i++) {
    const p = PAGES[i];
    const d = document.createElement('div');
    d.className = 'pg' + (p.sel ? ' sel' : '');
    d.dataset.i = String(i);
    const c = await thumb(p.src);
    const shown = c.cloneNode(true);
    shown.getContext('2d').drawImage(c, 0, 0);
    /* ПОВОРОТ ПОКАЗЫВАЕМ CSS-ОМ, А ПРИМЕНЯЕМ НА ПЕСОЧНИЦЕ. Перерисовывать страницу
       ради предпросмотра значило бы платить временем за то, что видно и так. */
    if (p.rot) shown.style.transform = 'rotate(' + p.rot + 'deg)';
    d.appendChild(shown);
    const n = document.createElement('div');
    n.className = 'n';
    n.textContent = (i + 1) + (p.src !== i + 1 ? ' (' + p.src + ')' : '')
                  + (p.rot ? ' ' + p.rot + '°' : '');
    d.appendChild(n);
    const x = document.createElement('button');
    x.className = 'x'; x.textContent = '✕'; x.title = T.del;
    x.onclick = (ev) => { ev.stopPropagation(); dropPage(i); };
    d.appendChild(x);
    /* МЕТКА РАЗРЕЗА - ТОЛЬКО В РЕЖИМЕ РАЗРЕЗА И НЕ ПОСЛЕ ПОСЛЕДНЕЙ СТРАНИЦЫ: «разрез
       после последней» не даёт второго куска, то есть это кнопка, которая ничего не
       делает (закон №36 - кнопка либо работает, либо называет причину). */
    if (SPL.on && i < PAGES.length - 1) {
      const cut = document.createElement('button');
      const on = SPL.cuts.has(i + 1);
      cut.className = 'cut' + (on ? ' on' : '');
      cut.textContent = '✂';
      cut.onclick = (ev) => { ev.stopPropagation(); splToggle(i + 1); };
      d.appendChild(cut);
      if (on) d.classList.add('cutAfter');
    }
    d.onclick = () => { p.sel = !p.sel; paint(); };
    g.appendChild(d);
  }
  const nsel = PAGES.filter((p) => p.sel).length;
  const parts = SPL.on ? splRanges() : [];
  $('sub').textContent = (NAME ? NAME + ' · ' : '') + T.pages(PAGES.length)
                       + (nsel ? T.sel(nsel) : '')
                       + (parts.length > 1 ? ' · ' + T.splParts(parts.length,
                                                                parts.join(', ')) : '');
  wireDrag();
}

function dropPage(i) {
  if (PAGES.length <= 1) { say(T.delAll, 'bad'); return; }
  PAGES.splice(i, 1); DIRTY = true; say(''); paint();
}

/* ═══ ВТОРОЙ ДОКУМЕНТ СЕССИИ - ОДНА ДВЕРЬ НА ДВУХ ПОТРЕБИТЕЛЕЙ ═══
   `/pdf/second` кладёт в сессию `cmp.pdf`, и забирают его двое: сравнение версий и
   объединение. Вторая копия этой отправки разошлась бы с первой на заголовке имени или на
   разборе отказа - и человек увидел бы это как «объединение не работает» (закон №40). */
async function sendSecond(f, buf) {
  const r = await fetch(u('/pdf/second'), {
    method: 'POST',
    headers: { 'Content-Type': 'application/pdf',
               'X-Pdf-Name': encodeURIComponent(f.name || 'second.pdf') },
    body: buf,
  });
  const j = await r.json().catch(() => null);
  if (!r.ok || !j || !j.ok) {
    return { ok: false, why: (j && (j.human || j.error)) || ('HTTP ' + r.status) };
  }
  return { ok: true, pages: j.pages || 0 };
}

/* ═══ РАЗРЕЗ: ЧИСЛА СЧИТАЕТ ОДНА ФУНКЦИЯ ═══
   Диапазоны нужны дважды - показать человеку в сводке и отправить воркеру, - и считать их
   двумя местами значило бы однажды показать одно, а отрезать другое. */
function splRanges() {
  const cuts = [...SPL.cuts].filter((c) => c >= 1 && c < PAGES.length).sort((a, b) => a - b);
  const out = [];
  let from = 1;
  for (const c of cuts) { out.push(from + '-' + c); from = c + 1; }
  out.push(from + '-' + PAGES.length);
  return out;
}

function splToggle(after) {
  if (SPL.cuts.has(after)) SPL.cuts.delete(after); else SPL.cuts.add(after);
  say('');
  paint();
}

/* ОБРАТНЫЙ ПУТЬ У РЕЖИМА ЕСТЬ И ОН ПРОВЕРЕН (закон №55): выход из разреза снимает метки,
   иначе следующее «Скачать» отрезало бы по забытым отметкам прошлого замысла. */
function splMode(on) {
  SPL.on = !!on;
  if (!on) SPL.cuts.clear();
  $('bSpl').textContent = on ? T.splOff : T.spl;
  $('bSplGo').hidden = !on;
  say(on ? T.splOn : '');
  paint();
}

async function splGo() {
  const off = whyOff();
  if (off) { say(off, 'bad'); return; }
  const ranges = splRanges();
  if (ranges.length < 2) { say(T.splNone, 'bad'); return; }
  say(T.splWork);
  if (!(await apply({ op: 'split', ranges: ranges.join(',') }))) return;
  const made = (LAST_RES && LAST_RES.made) || ranges.length;
  /* РЕЗУЛЬТАТ РАЗРЕЗА - АРХИВ, И СКАЗАТЬ ОБ ЭТОМ НАДО СЛОВАМИ: холст после него
     показывает по-прежнему ЦЕЛЫЙ документ, потому что куски лежат одним файлом на
     песочнице. Молчание здесь читалось бы как «ничего не произошло» (закон №23). */
  splMode(false);
  say(T.splDone(made), 'ok');
  note(T.splAgain);
}

/* ═══ ОБЪЕДИНЕНИЕ МЕНЯЕТ ИСХОДНИК СЕССИИ, И ХОЛСТ ОБЯЗАН СТАТЬ ТАКИМ ЖЕ ═══
   На песочнице `merge` заменяет `src.pdf` объединённым документом (иначе первое же
   движение страницы вернуло бы документ к одному файлу - `pages` всегда перечитывает
   исходник). Значит и здесь страницы второго файла ДОПИСЫВАЮТСЯ в холст, а их номера
   продолжают нумерацию первого: номер на холсте и номер на диске - одно и то же число,
   иначе «оставить выделенные» отрезало бы не то, что видно. */
async function mrgGo(f) {
  if (!f) return;
  if (!DOC) return;
  const off = whyOff();
  if (off) { say(off, 'bad'); return; }
  if (!/\.pdf$/i.test(f.name || '') && f.type && f.type !== 'application/pdf') {
    say(T.mrgNotPdf, 'bad'); return;
  }
  if (!pdfjs) { say(pdfjsWhy(T.cmpNoPdfjs), 'bad'); return; }
  say(T.mrgSend);
  try {
    const buf = await f.arrayBuffer();
    /* ВТОРОЙ ЛИСТ ОТКРЫВАЕМ ДО ОТПРАВКИ: битый файл честнее назвать здесь, чем после
       ожидания объединения на песочнице. */
    const doc2 = await openDoc(new Uint8Array(buf.slice(0)));
    const sent = await sendSecond(f, buf);
    if (!sent.ok) { say(sent.why, 'bad'); return; }
    say(T.mrgWork);
    const r = await fetch(u('/pdf/op'), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ op: 'merge' }),
    });
    const j = await r.json().catch(() => null);
    if (!r.ok || !j || !j.ok) {
      say((j && (j.human || j.error)) || ('HTTP ' + r.status), 'bad'); return;
    }
    const was = (j.res && j.res.pages_first) || DOCS.reduce(
      (n, d) => Math.max(n, d.from - 1 + d.doc.numPages), 0);
    const add = (j.res && j.res.pages_second) || doc2.numPages;
    DOCS.push({ doc: doc2, from: was + 1 });
    for (let i = 1; i <= add; i++) PAGES.push({ src: was + i, rot: 0, sel: false });
    DIRTY = true;
    await paint();
    say(T.mrgDone(was, add), 'ok');
  } catch (e) {
    say(T.cmpBadFile + ' ' + String((e && e.message) || e), 'bad');
  }
}

/* ═══ ПЕРЕТАСКИВАНИЕ НА POINTER EVENTS, А НЕ НА HTML5 DRAG ═══
   HTML5 drag-and-drop на мобильных не работает вовсе - там нет `dragstart`. Pointer
   events одинаковы для мыши и пальца, поэтому одна реализация закрывает обе платформы, и
   ветки «если телефон» здесь нет ни одной. */
function wireDrag() {
  let from = -1, ghost = null;
  const cards = [...document.querySelectorAll('.pg')];
  cards.forEach((el) => {
    el.onpointerdown = (e) => {
      /* ЛЮБАЯ КНОПКА НА КАРТОЧКЕ ПЕРЕТАСКИВАНИЮ НЕ ОТДАЁТСЯ - И ЭТО ПРАВИЛО, А НЕ СПИСОК
         ИМЁН. `setPointerCapture` на карточке переводит на неё и последующий `click`,
         поэтому нажатие по кнопке внутри приезжает КАРТОЧКЕ: `stopPropagation` у самой
         кнопки не спасает - её обработчик не зовётся вовсе. Раньше здесь стояло имя
         одного класса (`x`), и новая кнопка «✂» молча перестала работать: тап по метке
         разреза ВЫДЕЛЯЛ страницу. Нашёл браузерный прибор (закон №75), по данным этого
         не видно - разметка, размеры и обработчик были на месте. */
      if (e.target.closest && e.target.closest('button')) return;
      from = +el.dataset.i;
      ghost = el;
      el.setPointerCapture(e.pointerId);
      el.classList.add('drag');
    };
    el.onpointermove = (e) => {
      if (from < 0 || ghost !== el) return;
      const t = document.elementFromPoint(e.clientX, e.clientY);
      const card = t && t.closest ? t.closest('.pg') : null;
      cards.forEach((c) => c.classList.remove('over'));
      if (card && card !== el) card.classList.add('over');
    };
    el.onpointerup = (e) => {
      if (from < 0 || ghost !== el) return;
      const t = document.elementFromPoint(e.clientX, e.clientY);
      const card = t && t.closest ? t.closest('.pg') : null;
      el.classList.remove('drag');
      cards.forEach((c) => c.classList.remove('over'));
      const to = card ? +card.dataset.i : -1;
      const was = from;
      from = -1; ghost = null;
      if (to >= 0 && to !== was) {
        const [m] = PAGES.splice(was, 1);
        PAGES.splice(to, 0, m);
        DIRTY = true; say(''); paint();
      }
    };
  });
}

/* ── операции ──────────────────────────────────────────────────────────────────── */
function selIdx() { return PAGES.map((p, i) => p.sel ? i : -1).filter((i) => i >= 0); }

function rotate(deg) {
  const idx = selIdx();
  const target = idx.length ? idx : PAGES.map((_p, i) => i);
  target.forEach((i) => { PAGES[i].rot = (((PAGES[i].rot + deg) % 360) + 360) % 360; });
  DIRTY = true; say(''); paint();
}

/* ═══ ОДИН ВЫЗОВ НА ВСЁ НАМЕРЕНИЕ, А НЕ ПО ВЫЗОВУ НА ТАП ═══
   Порядок, удаление и повороты копятся на странице и уезжают вместе: две операции
   означали бы два прохода по стомегабайтному документу и два повода разойтись
   состояниями. Порядок применяется ПЕРВЫМ, повороты - вторым и уже по НОВЫМ номерам:
   наоборот они легли бы на страницы, которых в результате нет. */
/* Ответ ПОСЛЕДНЕЙ операции: заполняется в `apply`, читается тем, кому нужны его слова. */
let LAST_RES = null;

async function apply(extra) {
  LAST_RES = null;
  const off = whyOff();
  if (off) { say(off, 'bad'); return false; }
  say(T.working);
  try {
    const order = PAGES.map((p) => p.src).join(',');
    const r1 = await fetch(u('/pdf/op'), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ op: 'pages', order: order }),
    });
    const j1 = await r1.json().catch(() => null);
    if (!r1.ok || !j1 || !j1.ok) {
      say((j1 && (j1.human || j1.error)) || ('HTTP ' + r1.status), 'bad'); return false;
    }
    const groups = {};
    PAGES.forEach((p, i) => {
      if (p.rot) (groups[p.rot] = groups[p.rot] || []).push(i + 1);
    });
    for (const deg of Object.keys(groups)) {
      const r2 = await fetch(u('/pdf/op'), {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ op: 'rotate', turn: deg, pages: groups[deg].join(',') }),
      });
      const j2 = await r2.json().catch(() => null);
      if (!r2.ok || !j2 || !j2.ok) {
        say((j2 && (j2.human || j2.error)) || ('HTTP ' + r2.status), 'bad'); return false;
      }
    }
    if (extra) {
      const r3 = await fetch(u('/pdf/op'), {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(extra),
      });
      const j3 = await r3.json().catch(() => null);
      if (!r3.ok || !j3 || !j3.ok) {
        say((j3 && (j3.human || j3.error)) || ('HTTP ' + r3.status), 'bad'); return false;
      }
      /* ОТВЕТ ПОСЛЕДНЕЙ ОПЕРАЦИИ ОСТАЁТСЯ ДОСТУПНЫМ ВЫЗЫВАЮЩЕМУ. `apply` отдаёт только
         «вышло/не вышло», а воркер иногда говорит БОЛЬШЕ: скрытие данных предупреждает,
         что картинка есть на странице ещё раз. Потеряй мы это по дороге - человек решит,
         что убрал лицо, а оно видно рядом. */
      LAST_RES = j3.res || null;
    }
    say(T.ready, 'ok');
    return true;
  } catch (e) {
    say(String(e && e.message || e), 'bad');
    return false;
  }
}

/* ── отдача ────────────────────────────────────────────────────────────────────── */
async function save() {
  if (!(await apply(null))) return;
  /* СКАЧИВАНИЕ ИДЁТ ССЫЛКОЙ, А НЕ fetch+blob: стомегабайтный ответ, собранный в память
     вкладки, на телефоне её и роняет. Билет поэтому едет в query - к ссылке, которую
     открывает сам браузер, заголовок не прицепить ничем. */
  const a = document.createElement('a');
  a.href = u('/pdf/result');
  a.download = NAME || 'document.pdf';
  document.body.appendChild(a); a.click(); a.remove();
  /* СЕССИЯ ЗАКРЫВАЕТСЯ НА ТОЙ СТОРОНЕ, СРАЗУ ПОСЛЕ ОТДАЧИ. Здесь мы только говорим об
     этом человеку: держать кнопку «Скачать» живой над снесённой сессией значило бы
     обещать то, что уже не выполнится. */
  setTimeout(() => { say(T.gone); $('bar').hidden = true; }, 1200);
}

async function toChat() {
  if (!INIT) { say(T.noSign, 'bad'); return; }
  if (!(await apply(null))) return;
  const r = await req(API + '/signal', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(Object.assign({ kind: 'pdf', sid: SID },
                                       BFP ? { bot: BFP } : {})),
  });
  if (r.status !== 200) { say('не отправилось: HTTP ' + r.status, 'bad'); return; }
  say(T.sentChat, 'ok');
  $('bar').hidden = true;
}

/* ═══════════════════════════════════════════════════════════════════════════════
   САМООБНОВЛЕНИЕ. Спрашиваем WORKER'А, а не файл рядом со страницей: сосед лежит на том
   же хосте и попадает в тот же кэш вебвью, то есть отвечает ровно так же устарело -
   старая страница спрашивала бы у старого файла, свежа ли она, и получала «да».
   ЧЕТЫРЕ ИСХОДА, А НЕ ДВА: свежая / есть новее (перезагрузка) / договор разошёлся
   (перезагрузка НЕ лечит) / перезагрузились и всё равно старые (сами не можем).
   ═══════════════════════════════════════════════════════════════════════════════ */
async function checkVersion() {
  if (!API) return;
  try {
    const r = await fetch(API + '/appver?app=pdfstudio');
    const j = await r.json();
    if (!j || j.error) return;                       // молчание не мешает работать
    if (!j.ver || j.ver === VERSION) return;
    if (Q.get('r') === '1') { note(T.oldStuck); return; }
    note(T.old);
    const q = new URLSearchParams(location.search);
    q.set('v', j.ver); q.set('r', '1');
    location.replace(location.pathname + '?' + q.toString());
  } catch (e) { /* сеть молчит - работаем как есть */ }
}

/* ═══════════════════════════════════════════════════════════════════════════════
   ПОДПИСЬ НА СТРАНИЦЕ
   ═══════════════════════════════════════════════════════════════════════════════
   ГЛАВНОЕ РЕШЕНИЕ: НАРУЖУ ЕДУТ ДОЛИ КАДРА, А НЕ КООРДИНАТЫ PDF.
   `viewport.convertToPdfPoint` у pdf.js масштаб съедает верно, но у страницы с
   `/Rotate 90` отдаёт координаты MEDIABOX, а воркер строит накладку в ВИДИМОМ размере -
   это две разные системы, и подпись на повёрнутой странице легла бы не туда. Доли же
   считаются от кадра, который эта самая страница и нарисовала, поэтому системе координат
   PDF взяться неоткуда. Проверено рендером на всех четырёх формах листа.
   ═══════════════════════════════════════════════════════════════════════════════ */
let SIG_PNG = '';        // dataURL выбранной/нарисованной подписи
let SIG_PAGE = 0;        // индекс страницы в PAGES, куда ставим
let SIG_PHASE = '';      // '' | 'pick' | 'place'
let SIG_LIST = [];       // [{num, name, png}] из профиля
let SIG_PICK = -1;       // выбранная сохранённая (её имя предложим при «в профиль»)

const sigSay = (t) => { $('sigSay').textContent = t || ''; };

/* ── своя карточка вместо prompt (в вебвью Telegram его не показывают) ─────────── */
function askText(title, dflt) {
  return new Promise((res) => {
    $('askTtl').textContent = title;
    $('askInput').value = dflt || '';
    $('askNo').textContent = T.cancel;
    $('askYes').textContent = T.ok;
    $('ask').classList.add('on');
    setTimeout(() => { try { $('askInput').focus(); } catch (e) {} }, 60);
    const done = (v) => { $('ask').classList.remove('on'); res(v); };
    $('askNo').onclick = () => done(null);
    $('askYes').onclick = () => done($('askInput').value);
    $('askInput').onkeydown = (e) => { if (e.key === 'Enter') done($('askInput').value); };
  });
}

/* ВОПРОС «ДА ИЛИ НЕТ» - ТОЙ ЖЕ КАРТОЧКОЙ, ЧТО И ВОПРОС СО СТРОКОЙ. Заводить вторую
   означало бы две разные карточки с одинаковой работой, а `confirm()` в вебвью Telegram не
   показывают так же, как и `prompt()`. Поле ввода просто прячется: оно здесь лишнее, а
   показанное пустым читается как «надо что-то написать». */
function askYesNo(title) {
  return new Promise((res) => {
    $('askTtl').textContent = title;
    $('askInput').hidden = true;
    $('askNo').textContent = T.no;
    $('askYes').textContent = T.yes;
    $('ask').classList.add('on');
    const done = (v) => {
      $('ask').classList.remove('on');
      $('askInput').hidden = false;
      res(v);
    };
    $('askNo').onclick = () => done(false);
    $('askYes').onclick = () => done(true);
  });
}

/* ── ящик сигналов: положить и дождаться ответа ────────────────────────────────
   ТРИ МОЛЧАНИЯ РАЗЛИЧИМЫ. «Бот не забрал», «забрал и работает дольше окна» и «ответа нет»
   лечатся по-разному, и одна фраза на все три отправляла бы чинить не то (урок комнаты). */
async function signalAsk(body, tries) {
  const r = await req(API + '/signal', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    /* ЯРЛЫК ДОПИСЫВАЕТСЯ ЗДЕСЬ, А НЕ У КАЖДОГО ВЫЗЫВАЮЩЕГО: забыть его в одном из
       мест значило бы получить задачу, уехавшую не тому боту (закон №40). */
    body: JSON.stringify(Object.assign({}, body, BFP ? { bot: BFP } : {})),
  });
  if (r.status !== 200 || !r.j || !r.j.id) return { why: 'HTTP ' + r.status };
  const id = r.j.id;
  for (let i = 0; i < (tries || 20); i++) {
    await new Promise((z) => setTimeout(z, 1200));
    const g = await req(API + '/result?id=' + encodeURIComponent(id));
    if (g.status === 200 && g.j && g.j.state === 'done') return { res: g.j.res || {} };
  }
  return { why: 'timeout' };
}

/* ── холст рисования ───────────────────────────────────────────────────────────── */
function sigPadInit() {
  const c = $('sigPad');
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = c.clientWidth || 300, h = c.clientHeight || 190;
  c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);
  const g = c.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);
  g.lineWidth = 3; g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = '#101020';
  let drawing = false, drawn = false;
  const at = (e) => {
    const r = c.getBoundingClientRect();
    return [e.clientX - r.left, e.clientY - r.top];
  };
  c.onpointerdown = (e) => {
    e.preventDefault();
    drawing = true; drawn = true;
    const [x, y] = at(e);
    g.beginPath(); g.moveTo(x, y);
    try { c.setPointerCapture(e.pointerId); } catch (z) {}
    SIG_PICK = -1; sigPaintSaved();
  };
  c.onpointermove = (e) => {
    if (!drawing) return;
    e.preventDefault();
    const [x, y] = at(e);
    g.lineTo(x, y); g.stroke();
  };
  c.onpointerup = c.onpointercancel = () => { drawing = false; };
  c.__drawn = () => drawn;
  c.__reset = () => { g.clearRect(0, 0, w, h); drawn = false; };
}

/* ЧТО ЗАБИРАЕМ С ХОЛСТА: только то, что нарисовано, а не весь прямоугольник. Пустые поля
   вокруг росчерка на странице превратились бы в невидимый, но занятый кусок листа - и
   человек не понял бы, почему подпись не встаёт вплотную к строке. */
function sigFromPad() {
  const c = $('sigPad');
  if (!c.__drawn || !c.__drawn()) return '';
  const g = c.getContext('2d');
  const d = g.getImageData(0, 0, c.width, c.height).data;
  let x0 = c.width, y0 = c.height, x1 = -1, y1 = -1;
  for (let y = 0; y < c.height; y++) {
    for (let x = 0; x < c.width; x++) {
      if (d[(y * c.width + x) * 4 + 3] > 8) {
        if (x < x0) x0 = x;
        if (x > x1) x1 = x;
        if (y < y0) y0 = y;
        if (y > y1) y1 = y;
      }
    }
  }
  if (x1 < 0) return '';
  const pad = 6;
  x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad);
  x1 = Math.min(c.width - 1, x1 + pad); y1 = Math.min(c.height - 1, y1 + pad);
  const o = document.createElement('canvas');
  o.width = x1 - x0 + 1; o.height = y1 - y0 + 1;
  o.getContext('2d').drawImage(c, x0, y0, o.width, o.height, 0, 0, o.width, o.height);
  return o.toDataURL('image/png');
}

/* ── сохранённые подписи ───────────────────────────────────────────────────────── */
function sigPaintSaved() {
  const box = $('sigSaved');
  box.textContent = '';
  $('sigSavedTtl').textContent = SIG_LIST.length ? T.signSaved : T.signNoSaved;
  SIG_LIST.forEach((it, i) => {
    const d = document.createElement('div');
    d.className = 'sigCard' + (i === SIG_PICK ? ' sel' : '');
    const im = document.createElement('img');
    im.src = 'data:image/png;base64,' + it.png;
    d.appendChild(im);
    const nm = document.createElement('div');
    nm.className = 'nm'; nm.textContent = it.name || ('#' + it.num);
    d.appendChild(nm);
    const x = document.createElement('button');
    x.className = 'x'; x.textContent = '✕';
    x.onclick = async (ev) => {
      ev.stopPropagation();
      sigSay(T.working);
      const r = await signalAsk({ kind: 'pdfsig', act: 'sig_del', n: it.num });
      if (r.res && r.res.signs) { SIG_LIST = r.res.signs; SIG_PICK = -1; sigPaintSaved(); }
      sigSay((r.res && r.res.note) || (r.why ? T.signWait : ''));
    };
    d.appendChild(x);
    d.onclick = () => {
      SIG_PICK = i;
      SIG_PNG = 'data:image/png;base64,' + it.png;
      $('sigPad').__reset && $('sigPad').__reset();
      sigPaintSaved();
      sigSay('');
    };
    box.appendChild(d);
  });
}

async function sigLoadSaved() {
  if (!INIT || !API) return;
  const r = await signalAsk({ kind: 'pdfsig', act: 'sig_list' });
  if (r.res && r.res.signs) { SIG_LIST = r.res.signs; sigPaintSaved(); }
  else if (r.why) sigSay(T.signWait);
}

/* ── размещение ────────────────────────────────────────────────────────────────── */
async function sigPlace() {
  SIG_PHASE = 'place';
  $('sigPickBox').hidden = true;
  $('sigPlaceBox').hidden = false;
  $('bSigGo').textContent = T.signGo;
  $('bSigKeep').hidden = false;
  await sigPaintPage();
}

async function sigPaintPage() {
  const p = PAGES[SIG_PAGE];
  const cv = $('sigPageCv');
  const page = await DOC.getPage(p.src);
  const v0 = page.getViewport({ scale: 1, rotation: (page.rotate + p.rot) % 360 });
  const wide = Math.min(520, (window.innerWidth || 360) - 56);
  const sc = wide / v0.width;
  const v = page.getViewport({ scale: sc, rotation: (page.rotate + p.rot) % 360 });
  cv.width = Math.ceil(v.width); cv.height = Math.ceil(v.height);
  cv.style.width = Math.ceil(v.width) + 'px';
  await page.render({ canvasContext: cv.getContext('2d'), viewport: v }).promise;
  $('sigPage').textContent = T.signPage(SIG_PAGE + 1, PAGES.length);
  const img = $('sigImg');
  img.src = SIG_PNG;
  await new Promise((z) => { if (img.complete) z(); else img.onload = img.onerror = z; });
  const box = $('sigBox');
  const bw = Math.min(cv.clientWidth * 0.34, cv.clientWidth - 8);
  const ar = (img.naturalHeight || 1) / (img.naturalWidth || 1);
  box.style.width = bw + 'px';
  box.style.height = (bw * ar) + 'px';
  box.style.left = Math.round(cv.clientWidth * 0.55) + 'px';
  box.style.top = Math.round(cv.clientHeight * 0.72) + 'px';
  sigClamp();
}

/* ГРАНИЦЫ ДЕРЖИТ СТРАНИЦА, А ВОРКЕР ИХ ПРОВЕРЯЕТ. Два забора, и это не дублирование:
   здесь человек не может перетащить подпись за лист, там - никто не может прислать такое
   в обход страницы (закон №32). */
function sigClamp() {
  const cv = $('sigPageCv'), box = $('sigBox');
  const W = cv.clientWidth, H = cv.clientHeight;
  let w = box.offsetWidth, h = box.offsetHeight;
  w = Math.max(24, Math.min(w, W)); h = Math.max(12, Math.min(h, H));
  let l = Math.max(0, Math.min(box.offsetLeft, W - w));
  let t = Math.max(0, Math.min(box.offsetTop, H - h));
  box.style.width = w + 'px'; box.style.height = h + 'px';
  box.style.left = l + 'px'; box.style.top = t + 'px';
}

function sigWireBox() {
  const box = $('sigBox'), grip = $('sigGrip'), cv = $('sigPageCv');
  let mode = '', sx = 0, sy = 0, sl = 0, st = 0, sw = 0, sh = 0;
  const start = (e, m) => {
    e.preventDefault(); e.stopPropagation();
    mode = m; sx = e.clientX; sy = e.clientY;
    sl = box.offsetLeft; st = box.offsetTop; sw = box.offsetWidth; sh = box.offsetHeight;
    try { (m === 'size' ? grip : box).setPointerCapture(e.pointerId); } catch (z) {}
  };
  box.addEventListener('pointerdown', (e) => { if (e.target !== grip) start(e, 'move'); });
  grip.addEventListener('pointerdown', (e) => start(e, 'size'));
  const move = (e) => {
    if (!mode) return;
    e.preventDefault();
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (mode === 'move') {
      box.style.left = (sl + dx) + 'px';
      box.style.top = (st + dy) + 'px';
    } else {
      /* ПРОПОРЦИЮ ДЕРЖИМ: растянутая подпись - это чужой почерк, а не размер. */
      const k = Math.max(24, sw + dx) / sw;
      box.style.width = (sw * k) + 'px';
      box.style.height = (sh * k) + 'px';
    }
    sigClamp();
  };
  box.addEventListener('pointermove', move);
  grip.addEventListener('pointermove', move);
  const stop = () => { mode = ''; };
  box.addEventListener('pointerup', stop); box.addEventListener('pointercancel', stop);
  grip.addEventListener('pointerup', stop); grip.addEventListener('pointercancel', stop);
  cv.addEventListener('pointerdown', (e) => e.preventDefault());
}

/* ── поставить ─────────────────────────────────────────────────────────────────── */
async function sigApply() {
  const off = whyOff();
  if (off) { sigSay(off); return; }
  const cv = $('sigPageCv'), box = $('sigBox');
  const nx = box.offsetLeft / cv.clientWidth;
  const ny = box.offsetTop / cv.clientHeight;
  const nw = box.offsetWidth / cv.clientWidth;
  const nh = box.offsetHeight / cv.clientHeight;
  sigSay(T.working);
  try {
    const blob = await (await fetch(SIG_PNG)).blob();
    const r = await fetch(u('/pdf/sig'), { method: 'POST', body: blob });
    const j = await r.json().catch(() => null);
    if (!r.ok || !j || !j.ok) {
      sigSay((j && (j.human || j.error)) || ('HTTP ' + r.status));
      return;
    }
  } catch (e) {
    sigSay(String(e && e.message || e));
    return;
  }
  const ok = await apply({ op: 'sign', pages: String(SIG_PAGE + 1),
                           nx: nx.toFixed(4), ny: ny.toFixed(4),
                           nw: nw.toFixed(4), nh: nh.toFixed(4) });
  if (!ok) { sigSay($('say').textContent || T.working); return; }
  sigClose();
  say(T.signPlaced, 'ok');
}

/* ═══════════════════════════════════════════════════════════════════════════════
   СКРЫТИЕ ДАННЫХ: ОБВЕСТИ ОБЛАСТИ, УВИДЕТЬ СПИСОК, ПРИМЕНИТЬ
   ═══════════════════════════════════════════════════════════════════════════════
   ОБЛАСТЕЙ БОЛЬШЕ ОДНОЙ, И ОНИ НАКАПЛИВАЮТСЯ ДО ПРИМЕНЕНИЯ. Скрытие необратимо, поэтому
   человек должен видеть ВЕСЬ список и обведённое на листе ДО того, как нажмёт: «применилось
   не то» здесь дороже, чем лишний тап. */
let RDT = { areas: [], page: 0 };

const rdtSay = (t, cls) => {
  const e = $('rdtSay');
  e.textContent = t || '';
  e.style.color = cls === 'bad' ? 'var(--bad)' : 'var(--dim)';
};

function rdtClose() {
  $('rdt').classList.remove('on');
  $('rdtBar').hidden = true;
}

async function rdtOpen() {
  if (!DOC) return;
  const off = whyOff();
  if (off) { say(off, 'bad'); return; }
  RDT = { areas: [], page: 0 };
  const sel = PAGES.map((p, i) => p.sel ? i : -1).filter((i) => i >= 0);
  RDT.page = sel.length ? sel[0] : 0;
  $('rdtTtl').textContent = T.rdtTtl;
  /* ПРЕДУПРЕЖДЕНИЕ - ПЕРВОЙ СТРОКОЙ И ДО ОБВОДКИ, как дисклеймер подписи: сказанное
     после применения читается как оправдание задним числом. */
  $('rdtWarn').textContent = T.rdtWarn;
  $('bRdtCancel').textContent = T.rdtCancel;
  $('bRdtAdd').textContent = T.rdtAdd;
  $('bRdtGo').textContent = T.rdtGo;
  $('rdt').classList.add('on');
  $('rdtBar').hidden = false;
  rdtSay('');
  rdtPaintList();
  await rdtPaintPage();
}

async function rdtPaintPage() {
  const cv = await paintSheet('rdtPageCv', RDT.page);
  $('rdtPage').textContent = T.rdtPage(RDT.page + 1, PAGES.length);
  const box = $('rdtBox');
  box.style.width = Math.round(cv.clientWidth * 0.4) + 'px';
  box.style.height = Math.round(cv.clientHeight * 0.05) + 'px';
  box.style.left = Math.round(cv.clientWidth * 0.1) + 'px';
  box.style.top = Math.round(cv.clientHeight * 0.1) + 'px';
  rdtWireBox();
  rdtPaintDone();
}

/* УЖЕ ОБВЕДЁННОЕ РИСУЕМ НА ЛИСТЕ: список числами человек не сверит глазами с документом,
   а обводил он глазами. */
function rdtPaintDone() {
  const wrap = $('rdtWrap'), cv = $('rdtPageCv');
  for (const el of [...wrap.querySelectorAll('.rdtDone')]) el.remove();
  for (const a of RDT.areas) {
    if (a.page !== PAGES[RDT.page].src) continue;
    const d = document.createElement('div');
    d.className = 'rdtDone';
    d.style.left = (a.nx * cv.clientWidth) + 'px';
    d.style.top = (a.ny * cv.clientHeight) + 'px';
    d.style.width = (a.nw * cv.clientWidth) + 'px';
    d.style.height = (a.nh * cv.clientHeight) + 'px';
    wrap.appendChild(d);
  }
}

function rdtPaintList() {
  const box = $('rdtList');
  box.innerHTML = '';
  if (!RDT.areas.length) return;
  const head = document.createElement('div');
  head.textContent = T.rdtList(RDT.areas.length);
  box.appendChild(head);
}

/* ═══ ПРОВОДКА РАМКИ - ОДНА ДВЕРЬ НА ВСЕ ЭКРАНЫ, КОТОРЫЕ ЧТО-ТО ОБВОДЯТ ═══
   Экранов с рамкой два (скрытие данных и обрезка полей), и вторая копия этой механики -
   перетаскивание, ресайз ручкой, удержание внутри листа - разошлась бы с первой на первой
   же правке: pointer-события, захват указателя и `clamp` здесь выведены живым прогоном
   (закон №40). Элементы приходят параметрами, состояние живёт на самой рамке. */
function wireBox(cv, box, grip) {
  if (box.dataset.wired) return;
  box.dataset.wired = '1';
  let mode = '', sx = 0, sy = 0, bx = 0, by = 0, bw = 0, bh = 0;
  const clamp = () => {
    const W = cv.clientWidth, H = cv.clientHeight;
    const w = Math.max(14, Math.min(box.offsetWidth, W));
    const h = Math.max(8, Math.min(box.offsetHeight, H));
    box.style.width = w + 'px'; box.style.height = h + 'px';
    box.style.left = Math.max(0, Math.min(box.offsetLeft, W - w)) + 'px';
    box.style.top = Math.max(0, Math.min(box.offsetTop, H - h)) + 'px';
  };
  const down = (e, m) => {
    mode = m; sx = e.clientX; sy = e.clientY;
    bx = box.offsetLeft; by = box.offsetTop; bw = box.offsetWidth; bh = box.offsetHeight;
    if (e.target.setPointerCapture) e.target.setPointerCapture(e.pointerId);
    e.preventDefault(); e.stopPropagation();
  };
  const move = (e) => {
    if (!mode) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (mode === 'move') {
      box.style.left = (bx + dx) + 'px'; box.style.top = (by + dy) + 'px';
    } else {
      box.style.width = (bw + dx) + 'px'; box.style.height = (bh + dy) + 'px';
    }
    clamp();
    e.preventDefault();
  };
  const up = () => { mode = ''; };
  box.onpointerdown = (e) => { if (e.target !== grip) down(e, 'move'); };
  grip.onpointerdown = (e) => down(e, 'size');
  box.onpointermove = grip.onpointermove = move;
  box.onpointerup = grip.onpointerup = up;
  box.onpointercancel = grip.onpointercancel = up;
}

function rdtWireBox() {
  wireBox($('rdtPageCv'), $('rdtBox'), $('rdtGrip'));
}

/* ДОЛИ РАМКИ СЧИТАЕТ ОДНО МЕСТО: экранный размер канваса - единственная правда о том,
   что человек видел, и два места считали бы её по-разному ровно до первой правки. */
function boxFractions(cv, box) {
  if (!cv.clientWidth || !cv.clientHeight) return null;
  return {
    nx: +(box.offsetLeft / cv.clientWidth).toFixed(4),
    ny: +(box.offsetTop / cv.clientHeight).toFixed(4),
    nw: +(box.offsetWidth / cv.clientWidth).toFixed(4),
    nh: +(box.offsetHeight / cv.clientHeight).toFixed(4),
  };
}

/* ЛИСТ В КАНВАС ЭКРАНА - ТОЖЕ ОДНА ДВЕРЬ: поворот учитывается так же, как у подписи и
   полей (человек обводит то, что ВИДИТ), и расхождение здесь увело бы рамку на
   повёрнутой странице. */
async function paintSheet(cvId, idx) {
  const p = PAGES[idx];
  const cv = $(cvId);
  const page = await DOC.getPage(p.src);
  const v0 = page.getViewport({ scale: 1, rotation: (page.rotate + p.rot) % 360 });
  const wide = Math.min(520, (window.innerWidth || 360) - 56);
  const sc = wide / v0.width;
  const v = page.getViewport({ scale: sc, rotation: (page.rotate + p.rot) % 360 });
  cv.width = Math.ceil(v.width); cv.height = Math.ceil(v.height);
  cv.style.width = Math.ceil(v.width) + 'px';
  await page.render({ canvasContext: cv.getContext('2d'), viewport: v }).promise;
  return cv;
}

function rdtAdd() {
  const доли = boxFractions($('rdtPageCv'), $('rdtBox'));
  if (!доли) return;
  RDT.areas.push(Object.assign({ page: PAGES[RDT.page].src }, доли));
  rdtPaintList();
  rdtPaintDone();
  rdtSay(T.rdtList(RDT.areas.length));
}

async function rdtGo() {
  const off = whyOff();
  if (off) { rdtSay(off, 'bad'); return; }
  if (!RDT.areas.length) { rdtSay(T.rdtNone, 'bad'); return; }
  rdtSay(T.working);
  const n = RDT.areas.length;
  const ok = await apply({ op: 'redact', areas: JSON.stringify(RDT.areas) });
  if (!ok) { rdtSay($('say').textContent || T.working, 'bad'); return; }
  rdtClose();
  /* ПРО ВТОРУЮ ВСТАВКУ КАРТИНКИ ГОВОРИМ ЗДЕСЬ ЖЕ: воркер её называет, и терять это
     предупреждение по дороге нельзя - человек думает, что убрал лицо, а оно видно рядом. */
  const shared = (LAST_RES && LAST_RES.shared_images || []).length;
  say(T.rdtDone(n) + (shared ? ' ' + T.rdtShared : ''), 'ok');
}


/* ═══════════════════════════════════════════════════════════════════════════════
   ПОМЕТКИ: ОБВЁЛ - ВЫБРАЛ ВИД - НАПИСАЛ - ПРИМЕНИЛ
   ═══════════════════════════════════════════════════════════════════════════════
   ЭКРАН ТОТ ЖЕ ПО ЯЗЫКУ, ЧТО У СКРЫТИЯ ДАННЫХ (рамка + список + «Применить»), и это не
   копипаста: человек уже знает этот язык, и учить его второму ради того же дела -
   плата без причины. Механика рамки взята ОДНОЙ ДВЕРЬЮ `wireBox`/`boxFractions`
   (закон №40), своей копии здесь нет.

   ОТЛИЧИЕ ОДНО И ОНО НЕСУЩЕЕ: У ИСХОДА ДВЕ ФОРМЫ. По умолчанию пометки остаются
   НАСТОЯЩИМИ аннотациями PDF - подвижными и снимаемыми. Это и есть то, чего ждут от
   пометок: разметил чужой договор, показал юристу, снял. «Впечатать» делает их частью
   страницы навсегда. Оба свойства названы человеку СЛОВАМИ И ДО НАЖАТИЯ, причём
   переключатель объясняет ТЕКУЩЕЕ состояние, а не то, в которое перейдёт: подпись «сейчас
   будет так» читается однозначно, а «сделать так» - в обе стороны (тот же урок, что у
   переключателя мерки в сравнении). */
let ANN = { marks: [], page: 0, kind: 'high' };

const annSay = (t, cls) => {
  const e = $('annSay');
  e.textContent = t || '';
  e.style.color = cls === 'bad' ? 'var(--bad)' : (cls === 'ok' ? 'var(--ok)' : 'var(--dim)');
};

function annClose() {
  $('ann').classList.remove('on');
  $('annBar').hidden = true;
}

async function annOpen() {
  if (!DOC) return;
  const off = whyOff();
  if (off) { say(off, 'bad'); return; }
  ANN = { marks: [], page: 0, kind: 'high' };
  const sel = PAGES.map((p, i) => p.sel ? i : -1).filter((i) => i >= 0);
  ANN.page = sel.length ? sel[0] : 0;
  $('annTtl').textContent = T.annTtl;
  $('annHint').textContent = T.annHint;
  $('bAnnCancel').textContent = T.annCancel;
  $('bAnnAdd').textContent = T.annAdd;
  $('bAnnGo').textContent = T.annGo;
  $('annBurnTxt').textContent = T.annBurn;
  $('annText').placeholder = T.annTextPh;
  $('annText').value = '';
  $('annBurn').checked = false;
  annPaintKinds();
  annBurnNote();
  $('ann').classList.add('on');
  $('annBar').hidden = false;
  annSay('');
  annPaintList();
  await annPaintPage();
}

/* ВИД ВЫБИРАЕТСЯ ДО ОБВОДКИ И ВИДЕН НА РАМКЕ ЦВЕТОМ: выбирать вслепую и узнавать
   результат из скачанного файла - это ровно то, что закон №75 запрещает. */
function annPaintKinds() {
  const box = $('annKinds');
  box.innerHTML = '';
  for (const [k, t] of [['high', T.annKindHigh], ['box', T.annKindBox],
                        ['note', T.annKindNote]]) {
    const b = document.createElement('button');
    b.className = 'sm' + (ANN.kind === k ? ' on' : '');
    b.textContent = t;
    b.onclick = () => { ANN.kind = k; annPaintKinds(); };
    box.appendChild(b);
  }
  $('ann').classList.toggle('box', ANN.kind === 'box');
}

function annBurnNote() {
  $('annBurnNote').textContent = $('annBurn').checked ? T.annBurnOn : T.annBurnOff;
}

async function annPaintPage() {
  const cv = await paintSheet('annPageCv', ANN.page);
  $('annPage').textContent = T.annPage(ANN.page + 1, PAGES.length);
  const box = $('annBox');
  box.style.width = Math.round(cv.clientWidth * 0.4) + 'px';
  box.style.height = Math.round(cv.clientHeight * 0.05) + 'px';
  box.style.left = Math.round(cv.clientWidth * 0.1) + 'px';
  box.style.top = Math.round(cv.clientHeight * 0.1) + 'px';
  wireBox(cv, box, $('annGrip'));
  annPaintDone();
}

function annPaintDone() {
  const wrap = $('annWrap'), cv = $('annPageCv');
  for (const el of [...wrap.querySelectorAll('.annDone')]) el.remove();
  for (const m of ANN.marks) {
    if (m.page !== PAGES[ANN.page].src) continue;
    const d = document.createElement('div');
    d.className = 'annDone ' + m.kind;
    d.style.left = (m.nx * cv.clientWidth) + 'px';
    d.style.top = (m.ny * cv.clientHeight) + 'px';
    d.style.width = (m.nw * cv.clientWidth) + 'px';
    d.style.height = (m.nh * cv.clientHeight) + 'px';
    wrap.appendChild(d);
  }
}

function annPaintList() {
  const box = $('annList');
  box.innerHTML = '';
  if (!ANN.marks.length) return;
  const head = document.createElement('div');
  head.textContent = T.annList(ANN.marks.length);
  box.appendChild(head);
}

function annAdd() {
  const доли = boxFractions($('annPageCv'), $('annBox'));
  if (!доли) return;
  const текст = ($('annText').value || '').trim();
  /* ═══ ГЕЙТ СТОИТ У ДОБАВЛЕНИЯ, А НЕ У «ПРИМЕНИТЬ» (закон №32) ═══
     Пустую заметку воркер и так отвергнет, но отвергнет он ВЕСЬ пакет - человек потеряет
     десять правильных пометок из-за одной. */
  if (ANN.kind === 'note' && !текст) { annSay(T.annNoteEmpty, 'bad'); return; }
  ANN.marks.push(Object.assign({ page: PAGES[ANN.page].src, kind: ANN.kind, text: текст },
                               доли));
  $('annText').value = '';
  annPaintList();
  annPaintDone();
  annSay(T.annList(ANN.marks.length));
}

async function annGo() {
  const off = whyOff();
  if (off) { annSay(off, 'bad'); return; }
  if (!ANN.marks.length) { annSay(T.annNone, 'bad'); return; }
  annSay(T.working);
  const n = ANN.marks.length;
  const впечатать = $('annBurn').checked;
  const ok = await apply(Object.assign(
    { op: 'annotate', marks: JSON.stringify(ANN.marks) },
    впечатать ? { burn: '1' } : {}));
  if (!ok) { annSay($('say').textContent || T.annFail, 'bad'); return; }
  /* ХОЛСТ ПЕРЕРИСОВЫВАЕМ: пометка - операция ВИДА, и «готово» без листа для неё и есть
     «не сработало» (закон №23). У аннотаций это к тому же единственный способ увидеть,
     что читалка их вообще показывает. */
  await reshow();
  annClose();
  /* СЛОВА ВОРКЕРА ДОВОЗИМ ЦЕЛИКОМ: границу («их можно снять» / «снять нельзя ничем»)
     он знает точнее нашего пересказа, и терять её по дороге нельзя - человек решит, что
     пометки вшиты (закон №41). */
  const его = (LAST_RES && LAST_RES.note) || '';
  say(T.annDone(n, впечатать) + (его ? ' ' + его : ''), 'ok');
}


/* ═══════════════════════════════════════════════════════════════════════════════
   «ЕЩЁ»: ПЯТЬ ОПЕРАЦИЙ, КОТОРЫЕ УМЕЛ ТОЛЬКО ЧАТ (пункт 4 ТЗ 14.10)
   ═══════════════════════════════════════════════════════════════════════════════
   ЦЕЛЬ ФОРМУЛИРОВАЛАСЬ ТАК: «студия умеет всё, что умеет чат, плюс визуальное». Воркер
   эти пять умел с самого начала - не хватало экранов и строки в белом списке приёма.

   ЧТО ПРОИСХОДИТ С ХОЛСТОМ ПОСЛЕ КАЖДОЙ - РЕШАЕТСЯ ПО СМЫСЛУ, А НЕ ОДНИМ ПРАВИЛОМ:
     · распознавание, знак и номера МЕНЯЮТ ВИД страниц -> холст перерисовываем (`reshow`),
       иначе человек видит прежний лист и слово «готово» (закон №23);
     · Markdown отдаёт .md - рисовать его pdf.js нечем, поэтому только слова и «Скачать»;
     · пароль ШИФРУЕТ документ: pdf.js открыть его без пароля не может ПО ПОСТРОЕНИЮ, и
       попытка перерисовать холст закончилась бы отказом на исправной операции. Поэтому
       здесь тоже слова - и прямо сказано, что документ дальше не правится.

   ПАРОЛЬ НЕ ПИШЕТСЯ НИКУДА: он уезжает телом запроса (HTTPS), приём передаёт его воркеру
   stdin'ом (мимо argv, который видно в `ps aux`), а поле ввода чистится сразу после
   отправки - иначе он остался бы в DOM до закрытия вкладки. */
let MOR_BUSY = false;

function morSay(t, cls) {
  const e = $('morSay');
  e.textContent = t || '';
  e.style.color = cls === 'bad' ? 'var(--bad)' : (cls === 'ok' ? 'var(--ok)' : 'var(--dim)');
}

function morClose() {
  $('mor').classList.remove('on');
  $('morBar').hidden = true;
}

function morOpen() {
  if (!DOC) return;
  const off = whyOff();
  if (off) { say(off, 'bad'); return; }
  $('morTtl').textContent = T.morTtl;
  $('morHint').textContent = T.morHint;
  $('morOcrTtl').textContent = T.morOcr;
  $('morOcrNote').textContent = T.morOcrNote;
  $('morWmTtl').textContent = T.morWm;
  $('morWmNote').textContent = T.morWmNote;
  $('morWmText').placeholder = T.morWmHint;
  $('morPgTtl').textContent = T.morPg;
  $('morMdTtl').textContent = T.morMd;
  $('morMdNote').textContent = T.morMdNote;
  $('morPwTtl').textContent = T.morPw;
  $('morPwNote').textContent = T.morPwNote;
  $('morPw').placeholder = T.morPwHint;
  $('bMorOcr').textContent = T.morGo;
  $('bMorWm').textContent = T.morGo;
  $('bMorPg').textContent = T.morGo;
  $('bMorMd').textContent = T.morGo;
  $('bMorPwOn').textContent = T.morPwOn;
  $('bMorPwOff').textContent = T.morPwOff;
  $('bMorClose').textContent = T.rdtCancel;
  /* СПИСКИ ЗАПОЛНЯЕМ КОДОМ, А НЕ РАЗМЕТКОЙ: подписи приходят из i18n, и зашитые в HTML
     остались бы русскими у англоязычного человека (это ловит pdf44). */
  _morFill('morOcrLang', [['ru+en', T.morLangBoth], ['ru', 'RU'], ['en', 'EN']]);
  /* ЗНАЧЕНИЯ - КОНТРАКТ ВОРКЕРА (`{n}` и `{N}`), ПОДПИСИ - ДЛЯ ЧЕЛОВЕКА. Первая редакция
     слала «n/N» вместо «{n}/{N}», и воркер честно отвечал «в формате нет {n} - номеру
     негде появиться»: отказ на исправной кнопке (поймано живым прогоном 22.10). */
  _morFill('morPgFmt', [['{n}', '1'], ['{n}/{total}', T.morFmtOfN],
                        [T.morFmtWordVal, T.morFmtWord]]);
  /* ЗНАЧЕНИЯ - ИМЕНА ИЗ РЕЕСТРА ВОРКЕРА (`PG_POS`), а не свои сокращения: «br» воркер
     честно отвергал «положение не из списка» - отказ на исправной кнопке. */
  _morFill('morPgPos', [['bottom-right', T.morPosBR], ['bottom-center', T.morPosBC],
                        ['bottom-left', T.morPosBL], ['top-right', T.morPosTR],
                        ['top-center', T.morPosTC], ['top-left', T.morPosTL]]);
  morSay('');
  $('mor').classList.add('on');
  $('morBar').hidden = false;
}

function _morFill(id, пары) {
  const el = $(id);
  if (el.dataset.filled) return;
  el.dataset.filled = '1';
  for (const [v, t] of пары) {
