<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PDF-студия</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<!--
  ═══ PDF-СТУДИЯ, ЭТАП 1 ═══
  ЧТО ЭТА СТРАНИЦА ДЕЛАЕТ САМА, А ЧТО ПРОСИТ У ДРУГИХ:
    · рисует страницы (pdf.js, Apache-2.0, лежит рядом двумя файлами);
    · собирает НАМЕРЕНИЕ человека - порядок страниц, поворот, что удалить;
    · за БИЛЕТОМ ходит к Worker'у (там и только там проверяют подпись Telegram);
    · файл кладёт на ПЕСОЧНИЦУ (адрес приезжает параметром `pdf=`), и работу делает она.
  СВОЕЙ ЛОГИКИ РАБОТЫ НАД PDF ЗДЕСЬ НЕТ НИ ОДНОЙ СТРОКИ: страница показывает и просит.

  ═══ ЧЕГО В ЭТАПЕ 1 НЕТ, И ЭТО СКАЗАНО ЧЕЛОВЕКУ, А НЕ ЗАМОЛЧАНО ═══
  Объединение двух документов и конвертация из Word/Excel остались В ЧАТЕ, где они уже
  работают. Причина у каждой своя и названа внизу экрана: объединению нужен ВТОРОЙ файл
  (то есть вторая сессия и второй билет), конвертации - вход, который не является PDF, а
  приём студии принимает только `%PDF-`. Сделать их наполовину значило бы завести кнопку,
  которая иногда работает.
-->
<style>
/* ═══ ЦВЕТ ЖИВЁТ ТОКЕНАМИ, И ОБЕ ТЕМЫ ЗАДАНЫ ЦЕЛИКОМ ═══
   Telegram отдаёт свои `themeParams`, но НЕ ВСЕГДА и не все поля (в браузере их нет
   вовсе). Поэтому наши значения - основа, а тема клиента накладывается сверху там, где
   она есть: страница обязана быть читаемой ДО того, как SDK что-то сказал. */
:root{
  --bg:#f6f7f9; --card:#fff; --ink:#12151a; --dim:#5b6270; --line:#e3e6ea;
  --accent:#7c3aed; --accent-ink:#fff; --accent-line:#8b5cf6;
  --warn:#92400e; --warn-bg:#fef3c7; --bad:#9d174d; --ok:#059669;
  --sel:#ede9fe;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1115; --card:#171a20; --ink:#e7e9ee; --dim:#9aa2b1; --line:#262b34;
    --accent:#8b5cf6; --accent-ink:#fff; --accent-line:#a78bfa;
    --warn:#fbbf24; --warn-bg:#3a2f14; --bad:#fb7185; --ok:#34d399;
    --sel:#2a2140;
  }
}
*{box-sizing:border-box}
/* ═══ hidden ОБЯЗАН СКРЫВАТЬ, И ЭТО НЕ ОЧЕВИДНОСТЬ ═══
   ЗАМЕР БРАУЗЕРОМ 11.10: `#tools`, `#bar`, `#sigBar` и `#frmBar` стояли с атрибутом
   `hidden`, а вычисленный `display` у них был `flex` - потому что правило по ID сильнее
   браузерного `[hidden]{display:none}`. Цена: ряд операций и кнопки «Скачать»/«В чат»
   видны и НАЖИМАЕМЫ до загрузки документа, а панель подписи после закрытия экрана
   остаётся прозрачной мёртвой зоной поверх нижних кнопок. Кнопка, обещающая работу,
   которой не случится, хуже отсутствующей (закон №36).
   ПРАВИЛО ОДНО НА ВСЮ СТРАНИЦУ: без него каждая новая панель повторяет ту же ошибку, и
   заметит её не автор, а человек. Сторож - pdf30. */
[hidden]{display:none !important}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font:15px/1.45 -apple-system,BlinkMacSystemFont,
  "Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  /* min-height, А НЕ height:100% - иначе контейнер равен ровно экрану, и липкая шапка
     уезжает вместе со списком после первой прокрутки (замер в браузере, закон №37). */
  min-height:100vh; padding-bottom:96px;
  -webkit-text-size-adjust:100%;
}
header{
  position:sticky; top:0; z-index:20; background:var(--card);
  border-bottom:1px solid var(--line); padding:10px 12px 8px;
}
h1{font-size:16px; margin:0 0 2px; font-weight:650}
.sub{font-size:12px; color:var(--dim)}
.row{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
/* ═══ РЯД ДЕЙСТВИЙ ЖИВЁТ ВНУТРИ ЛИПКОЙ ШАПКИ ═══
   Отдельным блоком под ней он уезжал бы ПОД неё на первой же прокрутке, и от кнопок
   оставалась бы нижняя половина (закон №37: липкий элемент прибит к своему контейнеру). */
.tools{margin-top:8px}
button{
  font:inherit; color:var(--ink); background:var(--card); border:1px solid var(--line);
  border-radius:9px; padding:8px 11px; cursor:pointer; min-height:38px;
}
button:active{transform:translateY(1px)}
button[disabled]{opacity:.45; cursor:default}
button.pri{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
button.sm{padding:6px 9px; min-height:32px; font-size:13px}
#grid{
  display:grid; grid-template-columns:repeat(auto-fill,minmax(104px,1fr));
  gap:10px; padding:12px;
}
.pg{
  background:var(--card); border:2px solid var(--line); border-radius:10px;
  padding:6px 6px 4px; text-align:center; position:relative; touch-action:none;
  user-select:none; -webkit-user-select:none;
}
.pg.sel{border-color:var(--accent-line); background:var(--sel)}
.pg.drag{opacity:.4}
.pg.over{border-color:var(--accent); border-style:dashed}
.pg canvas{width:100%; height:auto; display:block; border-radius:4px; background:#fff}
.pg .n{font-size:11px; color:var(--dim); margin-top:3px}
.pg .x{
  position:absolute; top:2px; right:2px; width:22px; height:22px; line-height:20px;
  border-radius:50%; border:1px solid var(--line); background:var(--card);
  font-size:13px; padding:0; min-height:0;
}
#drop{
  margin:14px 12px; padding:26px 14px; border:2px dashed var(--line); border-radius:12px;
  text-align:center; color:var(--dim); background:var(--card);
}
#drop.hot{border-color:var(--accent); color:var(--ink)}
#say{padding:10px 12px; font-size:13px; color:var(--dim); white-space:pre-wrap}
#say.bad{color:var(--bad)} #say.ok{color:var(--ok)}
#note{
  margin:10px 12px; padding:9px 11px; border-radius:9px; background:var(--warn-bg);
  color:var(--warn); font-size:12.5px;
}
#bar{
  position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--card);
  border-top:1px solid var(--line); padding:9px 12px calc(9px + env(safe-area-inset-bottom));
  display:flex; gap:8px;
}
#bar button{flex:1}
#zoom{
  position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.88); display:none;
  overflow:auto; padding:12px; text-align:center;
}
#zoom.on{display:block}
#zoom canvas{max-width:100%; height:auto; background:#fff; border-radius:6px}
#zoom .close{position:sticky; top:0; float:right}
.foot{padding:4px 12px 12px; font-size:11.5px; color:var(--dim)}
/* ═══ ПОДПИСЬ ═══
   `touch-action:none` обязателен и на холсте рисования, и на рамке размещения: без него
   жест пальца уезжает в ПРОКРУТКУ страницы, и человек вместо росчерка листает документ.
   Урок оплачен доской в комнате, оттуда же и pointer events вместо touch/mouse. */
/* ═══ ПОЛНОЭКРАННЫЙ ЭКРАН И ЕГО НИЖНЯЯ ПАНЕЛЬ - ОДНИМ КЛАССОМ НА ВСЕ ЧЕТЫРЕ ═══
   Подпись, скрытие, формы и сравнение выглядят одинаково НЕ случайно: человек один раз
   понял, что карточка поверх сетки это «отдельное дело с этим документом». Но описано это
   было ЧЕТЫРЬМЯ копиями правил (три экрана плюс три панели), и копии УЖЕ РАЗОШЛИСЬ: у
   панели подписи `padding` был 9px против 10px у двух других, а радиус карточки 12px
   против 14px. Никто этого не заказывал - просто правку внесли в одно место из трёх.
   Пятая копия ради сравнения версий повторила бы ровно историю закона №40 (четыре копии
   правила ссылки разошлись на кавычке в href, и карточка не приходила вовсе). */
.scr{
  position:fixed; inset:0; z-index:60; background:rgba(0,0,0,.92); display:none;
  overflow:auto; padding:12px calc(12px + env(safe-area-inset-left)) 96px;
}
.scr.on{display:block}
.scr .card{
  max-width:560px; margin:0 auto; background:var(--card); border:1px solid var(--line);
  border-radius:14px; padding:12px;
}
.scrBar{
  position:fixed; left:0; right:0; bottom:0; z-index:61; display:flex; gap:8px;
  padding:10px 12px calc(10px + env(safe-area-inset-bottom)); background:var(--card);
  border-top:1px solid var(--line);
}
.scrBar button{flex:1}
#sig h2{font-size:15px; margin:0 0 8px}
#sigNote{
  margin:0 0 10px; padding:9px 11px; border-radius:9px; background:var(--warn-bg);
  color:var(--warn); font-size:12.5px;
}
#sigSaved{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px}
.sigCard{
  position:relative; border:2px solid var(--line); border-radius:9px; background:#fff;
  padding:4px; width:132px; cursor:pointer;
}
.sigCard.sel{border-color:var(--accent)}
.sigCard img{width:100%; height:46px; object-fit:contain; display:block}
.sigCard .nm{font-size:10.5px; color:#444; text-align:center; margin-top:2px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.sigCard .x{
  position:absolute; top:-7px; right:-7px; width:22px; height:22px; line-height:20px;
  border-radius:50%; border:1px solid var(--line); background:var(--card);
  font-size:13px; padding:0; min-height:0;
}
#sigPad{
  width:100%; height:190px; background:#fff; border:1px dashed var(--line);
  border-radius:9px; display:block; touch-action:none; cursor:crosshair;
}
#sigRow{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px}
#sigWrap{position:relative; margin:0 auto; width:max-content; max-width:100%}
#sigWrap canvas{display:block; max-width:100%; height:auto; background:#fff; border-radius:6px}
#sigBox{
  position:absolute; border:1.5px dashed var(--accent); background:transparent;
  touch-action:none; cursor:move;
}
#sigBox img{width:100%; height:100%; display:block; pointer-events:none}
#sigGrip{
  position:absolute; right:-11px; bottom:-11px; width:26px; height:26px; border-radius:50%;
  background:var(--accent); border:2px solid #fff; touch-action:none; cursor:nwse-resize;
}
/* ═══ ЭКРАН СКРЫТИЯ ДАННЫХ ═══
   Устроен как экран форм и подписи - человек уже знает этот язык. Отличие одно и оно
   несущее: областей БОЛЬШЕ ОДНОЙ, поэтому обведённое складывается в список, и видно, что
   именно уйдёт, ДО нажатия. Скрытие необратимо, и «применилось не то» здесь дороже. */
#rdt h2{font-size:16px; margin:0 0 8px}
#rdtWarn{
  margin:0 0 10px; padding:9px 11px; font-size:13px; border-radius:10px;
  background:var(--warn-bg); color:var(--warn);
}
#rdtWrap{position:relative; display:inline-block; max-width:100%}
#rdtWrap canvas{max-width:100%; height:auto; display:block; border-radius:8px}
#rdtBox{
  position:absolute; border:2px dashed #fb7185; background:rgba(251,113,133,.22);
  touch-action:none; cursor:move;
}
#rdtGrip{
  position:absolute; right:-9px; bottom:-9px; width:20px; height:20px; border-radius:50%;
  background:#fb7185; border:2px solid #fff; touch-action:none; cursor:nwse-resize;
}
/* УЖЕ ОБВЕДЁННЫЕ ОБЛАСТИ ВИДНЫ НА ЛИСТЕ, а не только числами в списке: человек обводит
   глазами и проверять себя будет тоже глазами. */
.rdtDone{position:absolute; background:rgba(0,0,0,.72); pointer-events:none}
#rdtList{font-size:13px; color:var(--dim); padding-top:8px}
#rdtList div{padding:2px 0}
/* ═══ ЭКРАН ФОРМ ═══ */
#frm h2{font-size:16px; margin:0 0 8px}
/* ПОЛЕ - СТРОКА С ПОДПИСЬЮ СВЕРХУ: имя поля в анкете бывает длинным («Фамилия, имя и
   отчество полностью»), и в одну строку с вводом оно не влезает ни на одном телефоне. */
.fld{margin:0 0 10px}
.fld .lbl{font-size:12px; color:var(--dim); margin-bottom:3px; word-break:break-word}
.fld .lbl b{color:var(--ink); font-weight:600}
.fld input[type=text],.fld select{
  width:100%; padding:8px 10px; font-size:15px; color:var(--ink); background:var(--bg);
  border:1px solid var(--line); border-radius:9px; outline:none;
}
.fld input[type=text]:focus,.fld select:focus{border-color:var(--accent-line)}
.fld .chk{display:flex; align-items:center; gap:8px; font-size:15px}
.fld .chk input{width:20px; height:20px}
/* ПОЛЕ ТОЛЬКО ДЛЯ ЧТЕНИЯ ГАСИМ, А НЕ ПРЯЧЕМ: спрятанное читается как «такого поля нет», и
   человек ищет его глазами в документе (закон №36). */
.fld.ro input,.fld.ro select{opacity:.55}
.fld .ro-why{font-size:11px; color:var(--warn)}
#frmMake{margin-top:4px}
#frmWrap{position:relative; display:inline-block; max-width:100%}
#frmWrap canvas{max-width:100%; height:auto; display:block; border-radius:8px}
#frmBox{
  position:absolute; border:2px dashed var(--accent-line); background:rgba(124,58,237,.12);
  touch-action:none; cursor:move;
}
#frmGrip{
  position:absolute; right:-9px; bottom:-9px; width:20px; height:20px; border-radius:50%;
  background:var(--accent); border:2px solid #fff; touch-action:none; cursor:nwse-resize;
}
/* ═══ ЭКРАН СРАВНЕНИЯ ВЕРСИЙ ═══
   ПОДСВЕЧИВАЕМ НА ЛИСТЕ ВТОРОЙ ВЕРСИИ, и это решение, а не оформление: правка живёт ТАМ,
   ГДЕ СЛОВА СТОЯТ СЕЙЧАС, и человек читает новую редакцию, сверяясь со старой. Удалённого
   на этом листе НЕТ - ему отдельный список, иначе подсветка показывала бы пустое место.
   ЦВЕТ БЕЗ ЛЕГЕНДЫ - ЭТО ЗАГАДКА, А НЕ ОТВЕТ: три вида различий (новое, заменённое,
   переехавшее) различаются цветом, и подписи к цветам стоят рядом с листом. */
#cmpWrap{position:relative; display:inline-block; max-width:100%}
#cmpWrap canvas{max-width:100%; height:auto; display:block; border-radius:8px}
.cmpHit{position:absolute; pointer-events:none; border-radius:2px}
.cmpHit.ins{background:rgba(74,222,128,.34); outline:1px solid rgba(74,222,128,.85)}
.cmpHit.rep{background:rgba(250,204,21,.34); outline:1px solid rgba(250,204,21,.9)}
.cmpHit.mv{background:rgba(96,165,250,.30); outline:1px dashed rgba(96,165,250,.9)}
#cmpLeg{display:flex; flex-wrap:wrap; gap:10px; font-size:12px; color:var(--dim); padding:8px 0}
#cmpLeg i{display:inline-block; width:11px; height:11px; border-radius:3px; margin-right:4px}
#cmpSum{
  font-size:13.5px; line-height:1.5; margin:8px 0; padding:9px 11px; border-radius:10px;
  background:var(--warn-bg); color:var(--warn);
}
#cmpSum.plain{background:rgba(255,255,255,.05); color:var(--fg)}
#cmpWhat{font-size:12.5px; color:var(--dim); line-height:1.5; margin:0 0 10px}
#cmpNav{display:flex; gap:8px; align-items:center; padding:0 0 8px}
#cmpNav button{flex:0 0 auto}
#cmpList div, #cmpGone div, #cmpMoved div{padding:4px 0; font-size:13px; line-height:1.45}
#cmpList, #cmpGone, #cmpMoved{font-size:13px; color:var(--fg); padding-top:6px}
#cmpList b, #cmpGone b, #cmpMoved b{color:var(--dim); font-weight:600}
.cmpWas{color:var(--bad); text-decoration:line-through}
.cmpNow{color:var(--ok)}
#sigPage{font-size:12.5px; color:var(--dim); text-align:center; margin:8px 0}
#ask{
  position:fixed; inset:0; z-index:70; background:rgba(0,0,0,.9); display:none;
  padding:16px; align-items:center; justify-content:center;
}
#ask.on{display:flex}
#ask .card{max-width:420px; width:100%}
#ask input{
  width:100%; box-sizing:border-box; font:inherit; color:var(--ink); background:var(--bg);
  border:1px solid var(--line); border-radius:9px; padding:9px 11px; margin:8px 0;
}
</style>

<header>
  <h1 id="ttl">PDF-студия</h1>
  <div class="sub" id="sub">Готовлюсь…</div>
  <div class="row tools" id="tools" hidden>
    <button class="sm" id="bAll">Все</button>
    <button class="sm" id="bNone">Снять</button>
    <button class="sm" id="bRotL">↺ 90°</button>
    <button class="sm" id="bRotR">↻ 90°</button>
    <button class="sm" id="bKeep">Оставить выделенные</button>
    <button class="sm" id="bDel">Удалить выделенные</button>
    <button class="sm" id="bZip">🗜 Сжать</button>
    <button class="sm" id="bSign">✍️ Подпись</button>
    <button class="sm" id="bForm">📋 Формы</button>
    <button class="sm" id="bRdt">🛡 Скрыть данные</button>
    <button class="sm" id="bCmp">🔍 Сравнить версии</button>
    <button class="sm" id="bReset">↩︎ Сначала</button>
  </div>
</header>

<div id="note" hidden></div>
<div id="drop">Перетащи сюда PDF или нажми, чтобы выбрать</div>
<input type="file" id="file" accept="application/pdf,.pdf" hidden>
<div id="grid"></div>
<div id="say"></div>
<div class="foot" id="foot"></div>

<div id="bar" hidden>
  <button id="bSave" class="pri">⬇️ Скачать</button>
  <button id="bChat">📩 В чат</button>
</div>

<div id="zoom"><button class="close sm" id="bZclose">✕</button><div id="zbox"></div></div>

<!-- СКРЫТИЕ ДАННЫХ. Предупреждение стоит ПЕРВОЙ строкой и видно ДО обводки: сказанное
     после применения читается как оправдание задним числом (тот же порядок, что у
     дисклеймера подписи). -->
<div id="rdt" class="scr">
  <div class="card">
    <h2 id="rdtTtl"></h2>
    <div id="rdtWarn"></div>
    <div id="rdtPage" class="foot" style="padding:0 0 6px"></div>
    <div id="rdtWrap">
      <canvas id="rdtPageCv"></canvas>
      <div id="rdtBox"><div id="rdtGrip"></div></div>
    </div>
    <div id="rdtList"></div>
    <div id="rdtSay" style="font-size:13px; color:var(--dim); padding-top:8px"></div>
  </div>
</div>
<div id="rdtBar" class="scrBar" hidden>
  <button id="bRdtCancel"></button>
  <button id="bRdtAdd" class="sm"></button>
  <button id="bRdtGo" class="pri"></button>
</div>

<!-- СРАВНЕНИЕ ВЕРСИЙ. Границу сравнения человек читает ДО нажатия, а не узнаёт из
     результата: мерка здесь СЛОВА, и про оформление с картинками она не знает ничего.
     Второй файл выбирается на этом же экране - отдельная «загрузка второй версии» в
     меню означала бы, что человек выбирает действие, не зная, зачем оно. -->
<div id="cmp" class="scr">
  <div class="card">
    <h2 id="cmpTtl"></h2>
    <div id="cmpWhat"></div>
    <div id="cmpPickBox">
      <button id="bCmpPick" class="sm"></button>
      <input type="file" id="cmpFile" accept="application/pdf,.pdf" hidden>
      <div id="cmpWhich" class="foot" style="padding:6px 0 0"></div>
    </div>
    <div id="cmpSum" hidden></div>
    <div id="cmpNav" hidden>
